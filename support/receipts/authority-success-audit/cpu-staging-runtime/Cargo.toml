[workspace]

[package]
name = "authority-success-refresh-staging"
version = "0.0.0"
edition = "2024"

[lib]
path = "../main_refresh_staging_probe.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = "=1.9.1"
semver = "=1.0.28"
time = { version = "=0.3.55", features = ["parsing", "formatting"] }
url = { version = "=2.5.8", features = ["serde"] }
thiserror = "=1.0.69"
log = "=0.4.34"
blake3 = "=1.8.7"
