[workspace]

[package]
name = "authority-success-pelt-core"
version = "0.0.0"
edition = "2024"

[lib]
name = "pelt_core"
path = "../../../../ports/pelt/core/src/lib.rs"

# The audit builds the actual engine-free default root only. This label lets
# rustc recognize the source cfg; this manifest does not qualify feature genet.
[features]
genet = []

[dependencies]
genet-host-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
workbench = { path = "../../../../crates/cambium/workbench" }
inker = { path = "../../../../crates/inker/inker" }
page-load = { package = "mere-page-load", path = "../../../../crates/system/page-load" }
url = "=2.5.8"

[[test]]
name = "pelt_core_audit_contracts"
path = "../pelt_core_owner_probe.rs"
