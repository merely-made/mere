[workspace]

[package]
name = "authority-success-opfs"
version = "0.0.0"
edition = "2024"

[lib]
name = "muniment_opfs_probe"
path = "../../../../ports/muniment-opfs-probe/src/lib.rs"

[dependencies]
async-trait = "0.1"
blake3 = "=1.8.7"
muniment = { path = "../../../../crates/eidetic/muniment", default-features = false, features = ["json"] }
redb = "=4.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
pollster = "0.4"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "opfs_audit_contracts"
path = "../opfs_owner_probe.rs"
