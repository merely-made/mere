[workspace]

[package]
name = "authority-success-gazette"
version = "0.0.0"
edition = "2024"

[lib]
name = "gazette"
path = "../../../../ports/gazette/src/lib.rs"

[features]
test-support = []

[dependencies]
gaz = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
iri-string = { version = "0.7", default-features = false }
chirograph = { path = "../../../../crates/chirograph" }
incipit = { path = "../../../../crates/incipit" }
sceno = { path = "../../../../crates/cambium/scenes/sceno" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "=2.5.8"
fleece = { package = "mere-fleece", path = "../../../../crates/fleece" }
genet-static-dom = { git = "https://github.com/merely-made/genet.git", branch = "main" }

[[test]]
name = "gazette_audit_contracts"
path = "../gazette_owner_probe.rs"
