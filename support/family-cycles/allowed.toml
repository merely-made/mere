# Ruled, documented repository back edges for scripts/check_family_cycles.py.
# Plan: design_docs/mere_docs/implementation_strategy/2026-11-06_cycle_breaks_plan.md
#
# [[edge]]     a directed repository pair (from names to) that the plan has ruled to
#              break but has not yet. The check runs with these edges left out.
# [[isolated]] a manifest root (repository/path) whose rows are left out of the
#              family-wide graph because its own [workspace] keeps its lock free of the
#              other repository.
#
# Each entry cites the decision that rules it. An entry on no cycle fails the check, so
# delete an entry in the same commit that breaks its cycle. A cycle that remains with the
# entries left out fails.

# D19 (Mark, 2026-11-08): "Allowlist until P5". Inker's optional fleece row on Mere's
# linked-data (mere-fleece -> mere-rdf, engine-split F3) closes against Mere's rows naming
# Inker. Leaves when engine-split P5 folds linked-data into a `mere` crate that does not
# depend on inker.
[[edge]]
from = "inker"
to = "mere"
decision = "D19"
reason = "fleece's optional linked-data row (engine-split F3); mere-rdf names inker, so Inker cannot name the engine until engine-split P5. Leaves with P5."

# D17 (Mark, 2026-11-06): the one isolated Murm root.
[[isolated]]
root = "murm/apps/signalman-desktop"
decision = "D17"
reason = "its own [workspace] root, excluded from Murm's, so neither lock holds the other; the source homes map's pattern for keeping a lock free of Mere."
