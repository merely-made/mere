# Authored transport standards catalog. Review changes as decisions, not generated census data.
# No implementation, conformance, publication, or physical qualification is claimed by this inventory.

schema = "mere.transport-standards-catalog"
version = 1
as_of = "2026-10-11"
owner = "mere/support/standards"
consumer = ["mere transport qualification corpus", "retinue delivery and radio profile planning", "independent implementations through optional adapters"]
status = "authored research catalog for human review; implementation and qualification not asserted"
entry_count = 71
profile_count = 25
scope = "Selected useful specifications for preserved signed objects, IP carriers, retained radio repair, multicast interoperability and optional courier/constrained-IP branches. Includes specification families where normative vendor pins remain pending."
dependency_closure = "not_exhaustive; normative dependencies outside this catalog require feature-specific audit before implementation or conformance claims"
relation_semantics = "Known relationships reflect checked relevant metadata, not exhaustive dependency closure. An absent relationship is not evidence that no relationship exists."
selection_semantics = "core/next/optional/alternative/guidance are proposed evaluation priorities; they do not assert completed implementation, adoption approval or conformance"
profile_semantics = "Profiles compose through adapters. Alternative codecs and RMT transports are mutually selected per transfer/session, while independent profiles can coexist in the same stack."
conformance_claim = "none"
errata_review = "incomplete; RaptorQ verified erratum 5548 checked; other RFC errata not reviewed"
physical_qualification = "none; PHY rates, driver support, multi-radio interference, power and RF compliance need separate hardware-profile evidence"
original_object_rule = "Retain the original signed operation bytes and IDs. Additional manifests, FEC symbols, link receipts and courier receipts do not grant application admission or author authority."
rf_schedule_rule = "No cataloged RFC independently standardizes our radio/channel rotation, tuning guard, repair reservation, retained floor, fairness or application admission policy. These need a separately versioned project profile."
codec_source_caution = "The inspected Mere p2panda-core 0.7.1 header is CBOR; upstream v0.7.0 release prose says all wire protocols moved to Postcard. Source-derived operation encoding and release prose are recorded separately; no implicit migration."

