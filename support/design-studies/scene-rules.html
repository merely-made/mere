<div id="mere-scene-study" aria-label="Mere scene and presentation rule study">
  <style>
    #mere-scene-study { --m-bg:#eee9dc; --m-panel:#faf7ef; --m-fg:#332e28; --m-muted:#696157; --m-line:#c3bba9; --m-accent:#47645e; --m-soft:#dce4dd; --m-radius:4px; --m-font:Georgia,serif; color:var(--m-fg); background:var(--m-panel); border:1px solid var(--m-line); font:14px/1.45 var(--m-font); color-scheme:light; }
    #mere-scene-study * { box-sizing:border-box; }
    #mere-scene-study button,#mere-scene-study input,#mere-scene-study select,#mere-scene-study textarea { font:inherit; color:var(--m-fg); }
    #mere-scene-study button,#mere-scene-study select,#mere-scene-study input,#mere-scene-study textarea { background:var(--m-panel); border:1px solid var(--m-line); border-radius:var(--m-radius); padding:6px 9px; min-width:0; }
    #mere-scene-study button { cursor:var(--cursor-interaction,pointer); }
    #mere-scene-study button:disabled { opacity:.5; cursor:default; }
    #mere-scene-study button[aria-pressed=true],#mere-scene-study .apply { background:var(--m-accent); color:var(--m-panel); border-color:var(--m-accent); }
    #mere-scene-study header { display:flex; align-items:center; gap:14px; padding:14px 18px; flex-wrap:wrap; border-bottom:1px solid var(--m-line); }
    #mere-scene-study .wordmark { font-size:22px; font-weight:500; margin-right:auto; letter-spacing:-.8px; }
    #mere-scene-study .wordmark small { font-size:12px; color:var(--m-muted); letter-spacing:0; margin-left:10px; }
    #mere-scene-study label { display:flex; flex-direction:column; gap:4px; font-size:12px; }
    #mere-scene-study header label { flex-direction:row; align-items:center; gap:7px; }
    #mere-scene-study .layout { display:grid; grid-template-columns:minmax(0,1fr) 282px; }
    #mere-scene-study .stage { background:var(--m-bg); padding:14px; min-width:0; }
    #mere-scene-study .scene-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
    #mere-scene-study .scene-toolbar label { flex:1; min-width:140px; }
    #mere-scene-study .scene-toolbar input[type=range] { padding:0; width:100%; accent-color:var(--m-accent); }
    #mere-scene-study .space { height:500px; position:relative; margin-top:12px; background-image:radial-gradient(var(--m-line) .6px,transparent .6px); background-size:20px 20px; }
    #mere-scene-study .field-boundary { position:absolute; inset:20px 2px 20px; border:1px solid var(--m-line); border-radius:var(--m-radius); pointer-events:none; }
    #mere-scene-study .field-title { position:absolute; top:0; left:12px; z-index:2; background:var(--m-bg); font-size:12px; }
    #mere-scene-study .guides { position:absolute; inset:20px 2px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; pointer-events:none; }
    #mere-scene-study .guides span { border:1px dashed var(--m-accent); background:color-mix(in srgb,var(--m-soft) 25%,transparent); }
    #mere-scene-study .drop-hint { position:absolute; z-index:4; inset:30px; background:color-mix(in srgb,var(--m-soft) 70%,transparent); border:2px dashed var(--m-accent); display:grid; place-items:center; pointer-events:none; }
    #mere-scene-study .links { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
    #mere-scene-study .links path { fill:none; stroke:var(--m-muted); stroke-width:1.25; }
    #mere-scene-study .links rect { fill:var(--m-soft); fill-opacity:.25; stroke:var(--m-accent); stroke-width:1; }
    #mere-scene-study .links text { fill:var(--m-muted); font:12px var(--m-font); }
    #mere-scene-study .node { position:absolute; z-index:1; transform:translate(-50%,-50%); background:var(--m-panel); border:1px solid var(--m-line); border-radius:var(--m-radius); box-shadow:0 3px 9px color-mix(in srgb,var(--m-fg) 8%,transparent); overflow:hidden; }
    #mere-scene-study .node[data-selected=true] { outline:2px solid var(--m-accent); outline-offset:3px; z-index:3; }
    #mere-scene-study .node[data-foreground=true] { border-color:var(--m-accent); }
    #mere-scene-study .node-head { display:flex; align-items:center; gap:4px; border-bottom:1px solid var(--m-line); padding:3px; }
    #mere-scene-study .choose { display:flex; align-items:center; gap:7px; text-align:left; width:100%; border:0; background:transparent; padding:5px; }
    #mere-scene-study .choose span { min-width:0; overflow-wrap:anywhere; }
    #mere-scene-study .handle { border:0; background:transparent; padding:5px; font-size:12px; cursor:grab; touch-action:none; }
    #mere-scene-study .face { width:22px; height:22px; flex:none; color:var(--m-accent); }
    #mere-scene-study .face rect,#mere-scene-study .face polygon { fill:currentColor; }
    #mere-scene-study .node-body { min-height:46px; }
    #mere-scene-study .node-body .large-face { width:56px; height:56px; display:block; margin:12px auto; }
    #mere-scene-study .document { padding:12px; }
    #mere-scene-study .document strong { font-weight:500; display:block; font-size:17px; margin-bottom:8px; }
    #mere-scene-study .document p { margin:0 0 8px; }
    #mere-scene-study .image { width:100%; display:block; aspect-ratio:1.8; background:var(--m-soft); }
    #mere-scene-study video { display:block; width:100%; aspect-ratio:1.8; background:var(--m-bg); }
    #mere-scene-study .facts { padding:7px 10px; font-size:12px; border-top:1px solid var(--m-line); color:var(--m-muted); overflow-wrap:anywhere; }
    #mere-scene-study .status { padding:4px 9px; font-size:11px; color:var(--m-muted); display:flex; gap:8px; flex-wrap:wrap; }
    #mere-scene-study .ambient { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin:14px 0 5px; }
    #mere-scene-study .ambient .kept { border-color:var(--m-accent); }
    #mere-scene-study .ambient-label { font-size:12px; color:var(--m-muted); }
    #mere-scene-study aside { padding:14px; border-left:1px solid var(--m-line); min-width:0; }
    #mere-scene-study h2 { font-size:15px; font-weight:500; margin:0 0 10px; }
    #mere-scene-study h3 { font-size:13px; font-weight:500; margin:16px 0 8px; }
    #mere-scene-study .selection { overflow-wrap:anywhere; min-height:22px; }
    #mere-scene-study .actions { display:flex; flex-wrap:wrap; gap:5px; margin:9px 0; }
    #mere-scene-study .actions button { font-size:12px; }
    #mere-scene-study .link-list { display:flex; gap:5px; flex-wrap:wrap; }
    #mere-scene-study .link-list button { font-size:12px; }
    #mere-scene-study .trace { border-top:1px solid var(--m-line); padding:8px 0; font-size:12px; overflow-wrap:anywhere; }
    #mere-scene-study .trace strong { font-weight:500; }
    #mere-scene-study .trace small { display:block; color:var(--m-muted); font-size:12px; }
    #mere-scene-study .editor { display:grid; gap:8px; }
    #mere-scene-study .editor .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    #mere-scene-study textarea { width:100%; min-height:100px; resize:vertical; font:12px/1.4 ui-monospace,monospace; }
    #mere-scene-study .error { color:var(--m-fg); background:var(--m-soft); padding:7px; overflow-wrap:anywhere; }
    #mere-scene-study .theme-controls { border-top:1px solid var(--m-line); padding:12px 18px; }
    #mere-scene-study .theme-fields { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }
    #mere-scene-study .theme-fields label { flex:1; min-width:130px; }
    #mere-scene-study .theme-fields input[type=color] { width:100%; height:34px; padding:3px; }
    #mere-scene-study .roster { display:flex; gap:5px; flex-wrap:wrap; font-size:12px; margin-top:8px; }
    #mere-scene-study summary { cursor:var(--cursor-interaction,pointer); font-size:12px; }
    #mere-scene-study [hidden] { display:none!important; }
    #mere-scene-study[data-theme=workshop] .space { background-size:28px 28px; }
    #mere-scene-study[data-theme=night] .space { background-image:radial-gradient(var(--m-line) .75px,transparent .75px),radial-gradient(ellipse at 55% 45%,var(--m-soft),transparent 70%); background-size:34px 34px,100% 100%; }
    @media(max-width:850px) { #mere-scene-study .layout { grid-template-columns:1fr; } #mere-scene-study aside { border-left:0; border-top:1px solid var(--m-line); } #mere-scene-study .editor { grid-template-columns:1fr 1fr; } #mere-scene-study .editor .full { grid-column:1/-1; } }
    @media(max-width:540px) { #mere-scene-study header { padding:12px; gap:10px; } #mere-scene-study header label { flex:1; flex-direction:column; align-items:stretch; } #mere-scene-study .wordmark { flex-basis:100%; } #mere-scene-study .space { height:auto; display:flex; flex-direction:column; gap:14px; padding-top:5px; background:none; } #mere-scene-study .node { position:relative; left:auto!important; top:auto!important; transform:none; width:100%!important; } #mere-scene-study .links,#mere-scene-study .field-boundary,#mere-scene-study .guides { display:none!important; } #mere-scene-study .field-title { position:static; align-self:flex-start; } #mere-scene-study .editor { grid-template-columns:1fr; } #mere-scene-study .editor .full { grid-column:auto; } #mere-scene-study .handle { display:none; } }
    @media(prefers-reduced-motion:no-preference) { #mere-scene-study .node { transition:left .2s,top .2s; } #mere-scene-study .node[data-dragging=true] { transition:none; } }
    @media(pointer:coarse) { #mere-scene-study button { min-height:44px; } #mere-scene-study input,#mere-scene-study select,#mere-scene-study textarea { font-size:16px; } }
  </style>
  <header>
    <div class="wordmark">mere <small>scene study</small></div>
    <label>Theme <select id="mere-theme"><option value="paper">Paper and ink</option><option value="workshop">Workshop</option><option value="night">Night</option></select></label>
    <label>Scene <select id="mere-arrangement"><option value="workbench">Workbench</option><option value="neighborhood">Neighborhood</option><option value="hierarchy">Hierarchy</option></select></label>
  </header>
  <div class="layout">
    <section class="stage" aria-label="Mixed-content scene">
      <div class="scene-toolbar">

        <label>Lens <select id="mere-lens"><option value="related">Related</option><option value="history">History</option></select></label>
        <button id="mere-lock" type="button" aria-pressed="false">Unlock forme</button>

      <div class="space" id="mere-space">
        <div class="field-boundary" aria-hidden="true"></div>
        <svg class="links" id="mere-links" role="img" aria-label="Membership and derived similarity links"></svg>
        <div class="guides" id="mere-guides" hidden aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <button class="field-title" id="mere-field" type="button">forme · four surfaces</button>
        <div class="drop-hint" id="mere-drop" hidden>Drop into this region</div>
      </div>
      <div class="ambient" id="mere-ambient" aria-label="Ambient context"></div>
      <div class="roster" id="mere-roster" aria-label="Dismissed surfaces"></div>
    </section>
    <aside aria-label="Selection and presentation rules">
      <h2>Selection</h2>
      <div class="selection" id="mere-selection" aria-live="polite">Choose an object</div>
      <div class="actions">
        <button id="mere-fg-pin" type="button">Foreground pin</button>
        <button id="mere-position-pin" type="button">Position pin</button>
        <button id="mere-dismiss" type="button">Dismiss</button>
        <button id="mere-clear" type="button">Deselect</button>
      </div>
      <div class="link-list" id="mere-link-list" aria-label="Inspect links"></div>
      <div id="mere-provenance" class="facts" hidden></div>
      <h3>Why this presentation?</h3>
      <div id="mere-traces" aria-live="polite"></div>
      <h3>Target → condition → effect</h3>
      <div class="editor">
        <label class="full">Rule <select id="mere-rule"></select></label>
        <label>Target <select id="mere-target"><option value="node">Node</option><option value="relation">Link</option><option value="field">Field</option></select></label>
        <label>Priority <input id="mere-priority" type="number" min="-100" max="100" value="10"></label>
        <label class="full">Condition <select id="mere-condition-preset"><option value="keep">Current condition</option><option value="selected">Selected</option><option value="image">Image in overview</option><option value="compact">Small screen size</option><option value="membership">Membership in hierarchy</option><option value="derived">Derived and inspected</option><option value="unlocked">Unlocked forme</option><option value="always">Always</option></select></label>
        <label class="full">Condition definition <textarea id="mere-condition" spellcheck="false" aria-label="Condition definition"></textarea></label>
        <label class="full">Effect <select id="mere-effect"></select></label>
        <label><span>Enabled</span><input id="mere-enabled" type="checkbox" checked></label>
        <button class="apply" id="mere-apply" type="button">Apply rule</button>
        <div class="error full" id="mere-error" role="alert" hidden></div>
      </div>
    </aside>
  </div>
  <details class="theme-controls">
    <summary>Edit this theme</summary>
    <div class="theme-fields">
      <label>Surface <input id="mere-surface" type="color" value="#faf7ef"></label>
      <label>Accent <input id="mere-accent" type="color" value="#47645e"></label>
      <label>Installed font / fallback stack <input id="mere-font" type="text" value="Georgia, serif"></label>
      <label>Corner radius <input id="mere-radius" type="range" min="0" max="18" value="4"></label>
    </div>
  </details>

  <script data-mere-rule-model>
  (() => {
    const properties=['representation','details','relation_form','provenance','region_guides','drop_previews'];
    const states=['selected','foreground_pinned','position_pinned','layout_unlocked','inspected','overview'];
    const issue=(field,message)=>({field,message});
    const finite=value=>typeof value==='number'&&Number.isFinite(value);
    const scalar=value=>['string','boolean'].includes(typeof value)||finite(value);
    function validate(set) {
      const errors=[],ids=new Set();
      if(set.version!==1) errors.push(issue('version','unsupported presentation rule version'));
      if(!Array.isArray(set.rules)||set.rules.length>256) throw [issue('rules','at most 256 rules are supported')];
      function condition(c,path,depth,count) {
        if(!c||typeof c!=='object') {errors.push(issue(path,'condition must be an object'));return;}
        count.value++;
        if(depth>32||count.value>256) {errors.push(issue(path,'condition complexity limit exceeded'));return;}
        if(['has_fact','equals','number'].includes(c.kind)&&!(typeof c.fact==='string'&&c.fact.trim())) errors.push(issue(path,'a fact name is required'));
        switch(c.kind) {
          case 'always': break;
          case 'state': if(!states.includes(c.state)) errors.push(issue(path,'unknown view state')); break;
          case 'has_fact': break;
          case 'equals': if(!scalar(c.value)) errors.push(issue(path,'a scalar condition value is required')); break;
          case 'number': if(!finite(c.value)||!['lt','lte','eq','gte','gt'].includes(c.op)) errors.push(issue(path,'invalid numeric comparison')); break;
          case 'screen_size': if(!finite(c.enter_below)||!finite(c.exit_above)||c.enter_below<0||c.enter_below>=c.exit_above) errors.push(issue(path,'screen thresholds must be finite, nonnegative and enter < exit')); break;
          case 'all': case 'any':
            if(!Array.isArray(c.conditions)||!c.conditions.length) {errors.push(issue(path,'compound conditions must not be empty'));break;}
            for(let i=0;i<c.conditions.length;i++) { if(count.value>=256) {errors.push(issue(path,'at most 256 conditions per rule'));break;} condition(c.conditions[i],`${path}.conditions[${i}]`,depth+1,count); } break;
          case 'not': condition(c.condition,`${path}.condition`,depth+1,count); break;
          default: errors.push(issue(path,'unknown condition kind'));
        }
      }
      set.rules.forEach((r,i)=>{
        const path=`rules[${i}]`;
        if(typeof r.id!=='string'||!r.id.trim()||ids.has(r.id)) errors.push(issue(`${path}.id`,'rule IDs must be nonempty and unique'));
        ids.add(r.id);
        if(typeof r.label!=='string'||typeof r.enabled!=='boolean'||!Number.isInteger(r.priority)||r.priority< -2147483648||r.priority>2147483647) errors.push(issue(path,'invalid label, enabled flag or priority'));
        if(!r.target||!['node','relation','field'].includes(r.target.kind)||(r.target.ids||[]).some(id=>typeof id!=='string'||!id.trim())) errors.push(issue(`${path}.target`,'invalid target'));
        condition(r.condition,`${path}.condition`,0,{value:0});
        if(!Array.isArray(r.effects)||!r.effects.length) {errors.push(issue(`${path}.effects`,'a rule must declare an effect'));return;}
        const keys=new Set();
        r.effects.forEach((effect,j)=>{
          const p=`${path}.effects[${j}]`,kind=effect.kind;
          const target=['representation','details'].includes(kind)?'node':['relation_form','provenance'].includes(kind)?'relation':'field';

    const presets={selected:{kind:'state',state:'selected'},image:fixture.rule_set.rules[0].condition,compact:fixture.rule_set.rules[2].condition,membership:fixture.rule_set.rules[3].condition,derived:fixture.rule_set.rules[4].condition,unlocked:fixture.rule_set.rules[5].condition,always:{kind:'always'}};
    const choices={node:[['Glyph','Compact face'],['Card','Summary/document'],['Snapshot','Thumbnail'],['LivePane','Live surface'],['details:true','Show attributes'],['details:false','Hide attributes']],relation:[['stroke','Stroke'],['containment','Containment'],['adjacency','Adjacency mark'],['matrix_cell','Matrix cell'],['provenance:true','Show derivation'],['provenance:false','Hide derivation']],field:[['guides:true','Regions and drop previews'],['guides:false','Hide regions and drop previews'],['region_guides:true','Show regions'],['drop_previews:true','Show drop previews']]};
    function effectKey(effects) {if(effects.length===2)return 'guides:'+effects[0].visible;const e=effects[0];return ['representation','relation_form'].includes(e.kind)?e.value:e.kind+':'+e.visible;}
    function effectsFrom(key,target) {if(key.startsWith('guides:')) {const visible=key.endsWith('true');return [{kind:'region_guides',visible},{kind:'drop_previews',visible}];}if(key.includes(':')) {const [kind,value]=key.split(':');return [{kind,visible:value==='true'}];}return [{kind:target==='node'?'representation':'relation_form',value:key}];}
    function effectOptions(target,selected) {$('effect').replaceChildren();choices[target].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;$('effect').append(option);});if(choices[target].some(([value])=>value===selected))$('effect').value=selected;}
    function loadRule(id) {
      const rule=state.rules.rules.find(rule=>rule.id===id)||state.rules.rules[0];lastRule=rule.id;$('rule').value=rule.id;$('target').value=rule.target.kind;$('priority').value=rule.priority;$('enabled').checked=rule.enabled;$('condition').value=JSON.stringify(rule.condition,null,2);$('condition-preset').value='keep';effectOptions(rule.target.kind,effectKey(rule.effects));$('error').hidden=true;
    }
    state.rules.rules.forEach(rule=>{const option=document.createElement('option');option.value=rule.id;option.textContent=rule.label;$('rule').append(option);});
    $('rule').addEventListener('change',()=>loadRule($('rule').value));$('target').addEventListener('change',()=>effectOptions($('target').value));
    $('condition-preset').addEventListener('change',()=>{const value=presets[$('condition-preset').value];if(value)$('condition').value=JSON.stringify(value,null,2);});
    $('apply').addEventListener('click',()=>{
      try {
        const candidate=structuredClone(state.rules),rule=candidate.rules.find(rule=>rule.id===lastRule);rule.target.kind=$('target').value;rule.priority=Number($('priority').value);rule.enabled=$('enabled').checked;rule.condition=JSON.parse($('condition').value);rule.effects=effectsFrom($('effect').value,rule.target.kind);model.validate(candidate);state.rules=candidate;previous={};$('error').hidden=true;render();save();
      } catch(error) {$('error').hidden=false;$('error').textContent=Array.isArray(error)?error.map(issue=>issue.field+': '+issue.message).join('; '):error.message;}
    });
    $('theme').addEventListener('change',()=>{state.theme=$('theme').value;render();save();});$('arrangement').addEventListener('change',()=>{state.scene=$('arrangement').value;render();save();});$('lens').addEventListener('change',()=>{state.lens=$('lens').value;render();save();});
    $('zoom').addEventListener('input',()=>{state.zoom=Number($('zoom').value);render();});$('zoom').addEventListener('change',save);
    $('lock').addEventListener('click',()=>{state.unlocked=!state.unlocked;render();save();});$('field').addEventListener('click',event=>select('workbench',event));
    $('clear').addEventListener('click',()=>{state.selected=[];render();save();});
    $('fg-pin').addEventListener('click',()=>{const ids=state.selected.filter(id=>[...nodes,...peripheral].some(node=>node.id===id)),remove=ids.every(id=>state.foreground.includes(id));state.foreground=remove?state.foreground.filter(id=>!ids.includes(id)):[...new Set([...state.foreground,...ids])];render();save();});
    $('position-pin').addEventListener('click',()=>{const ids=state.selected.filter(id=>nodes.some(node=>node.id===id)),remove=ids.every(id=>state.positionPins.includes(id));state.positionPins=remove?state.positionPins.filter(id=>!ids.includes(id)):[...new Set([...state.positionPins,...ids])];render();save();});
    $('dismiss').addEventListener('click',()=>{const ids=state.selected.filter(id=>[...nodes,...peripheral].some(node=>node.id===id));state.dismissed=[...new Set([...state.dismissed,...ids])];state.foreground=state.foreground.filter(id=>!ids.includes(id));state.selected=[];render();save();});
    $('space').addEventListener('click',event=>{if(event.target.closest('.node')||event.target.closest('button'))return;state.selected=[];render();save();});
    [['surface','panel'],['accent','accent'],['font','font'],['radius','radius']].forEach(([id,key])=>$(id).addEventListener('input',()=>{state.themes[state.theme][key]=key==='radius'?Number($(id).value):$(id).value;applyTheme();drawLinks();save();}));
    new ResizeObserver(()=>drawLinks()).observe($('space'));
    render();loadRule(lastRule);
  })();
  </script>
</div>
