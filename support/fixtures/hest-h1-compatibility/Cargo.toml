[package]
name = "hest-h1-compatibility"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Exercise the immutable published Cambium, including its old command-menu API.
cambium = "=0.4.0"
command-menu = "=0.1.1"
hest = "=0.1.0"
serde_json = "1"

# Prepublication candidates only. Every other dependency resolves from crates.io.
[patch.crates-io]
command-menu = { path = "../../../crates/cambium/command-menu" }
hest = { path = "../../../crates/cambium/hest-0_1" }
