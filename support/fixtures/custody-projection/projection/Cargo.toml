[workspace]

[package]
name = "custody-projection-projection-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[features]
forbidden-api = []

[dependencies]
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main", features = ["native"] }
graphshell-door = { path = "../../../../crates/graphshell/graphshell-door", default-features = false, features = ["projection-door"] }
graphshell-endpoint = { version = "0.0.3", git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false, features = ["projection"] }
serde_json = "1"

