[package]
rust-version = "1.97.1"
name = "merely-release-comparison"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

# Independent research fixture; does not change the family workspace lock.
[workspace]

[dependencies]
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "7a3453a02bc7dea391ef18814c1bfa1a46e67160" }
velopack = "=1.2.161"
minisign = "0.7"
blake3 = "1"
serde_json = "1"
tempfile = "3"
url = "2"
base64 = "0.22"
tough = { version = "=0.24.0", default-features = false, optional = true }
tokio = { version = "1", features = ["rt", "fs"], optional = true }

[features]
tuf = ["dep:tough", "dep:tokio"]

[[bin]]
name = "merely-release-comparison"
path = "src/main.rs"

[[bin]]
name = "tuf-comparison"
path = "src/tuf.rs"
required-features = ["tuf"]

[profile.dev]
debug = 0
incremental = false

[workspace.package]
rust-version = "1.97.1"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true

[patch."https://github.com/merely-made/distillery.git"]
esp = { git = "https://www.github.com/merely-made/distillery.git", rev = "6346f087bb87d879cc9367dfb3d20fa00a8cbb9d" }
esp-testkit = { git = "https://www.github.com/merely-made/distillery.git", rev = "6346f087bb87d879cc9367dfb3d20fa00a8cbb9d" }
distillery = { git = "https://www.github.com/merely-made/distillery.git", rev = "6346f087bb87d879cc9367dfb3d20fa00a8cbb9d" }
mere-mesh = { git = "https://www.github.com/merely-made/distillery.git", rev = "6346f087bb87d879cc9367dfb3d20fa00a8cbb9d" }
