[package]
rust-version = "1.97.1"
name = "settings-wit"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The revisioned settings contract over mere:script's WIT settings interface: a gated server over any owner and a client that is itself an owner."

[features]
default = []
# The fixture owner, gate and call script every binding is checked with.
testkit = []

[dependencies]
# The WIT world lives in this package; its build script publishes the directory to
# this crate's build script as DEP_GRAPHSHELL_ENDPOINT_WIT (Cargo passes `links`
# metadata from normal dependencies only). The crate itself is not used.
graphshell-endpoint = { workspace = true }
mere-surface-api = { workspace = true }
script-wire = { workspace = true }
workbench = { workspace = true }

[build-dependencies]
script-witgen = { workspace = true }

[dev-dependencies]
settings-wit = { path = ".", features = ["testkit"] }

[lints]
workspace = true
