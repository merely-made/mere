[package]
rust-version = "1.97.1"
name = "mere-fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Host-neutral fetch actor and session-cookie runtime for Mere."

[lib]
name = "fetch"
path = "src/lib.rs"

[features]
# Everything the crate did before the blocking handle arrived stays on by
# default. A small host turns the defaults off and takes only `Fetch` over
# netfetcher (design_docs/.../2026-09-20_ranged_fetch_plan.md, D3).
default = ["actor", "smolweb", "persona-cookies", "flip"]
# The off-UI-thread page actor.
actor = ["dep:armillary"]
# gemini, gopher, finger, spartan, nex, guppy and titan through errand.
smolweb = ["dep:errand"]
# Durable per-persona cookies in an eidetic store.
persona-cookies = ["dep:eidetic", "dep:pandect", "dep:serde", "dep:serde_json", "dep:pollster"]
# The session's cookies as portable records for an engine flip.
flip = ["dep:inker"]
https-blobs = ["dep:eidetic", "dep:ureq"]
iroh-blobs = ["dep:eidetic", "dep:transport"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
# Genet's host-side resource contract, so a handle can serve a document
# engine's images and stylesheets under the same policy as every other fetch.
genet-host-api = { workspace = true }
# The fetch vocabulary and the sans-IO page load, which this actor speaks and
# re-exports, so controllers can share them without linking a transport.
page-load = { workspace = true }
armillary = { workspace = true, optional = true }
eidetic = { workspace = true, optional = true }
errand = { workspace = true, optional = true }
netfetcher = { workspace = true }
pollster = { version = "0.4", optional = true }
rustls-pki-types = "1"
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
pandect = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "sync"] }
tracing.workspace = true
url = "2"
inker = { workspace = true, optional = true }
zeroize = "1"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes = "1"
ureq = { version = "2.10", default-features = false, features = ["tls"], optional = true }
transport = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
transport = { workspace = true, features = ["test-identity"] }
identity.workspace = true
bytes = "1"
mockito = "1.4"
pollster = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
