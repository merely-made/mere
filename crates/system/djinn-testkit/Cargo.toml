[package]
name = "djinn-testkit"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Test harness for djinn residents: isolated spawns, walls around the installed resident, and verified receipts."
# A dev-dependency only, by path; never published (harness plan ruling 5).
publish = false

[dependencies]
# The platform data dir, to find the real shared root the walls watch.
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Performance",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
