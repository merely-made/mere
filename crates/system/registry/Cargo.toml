[package]
rust-version = "1.97.1"
name = "mere-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Mere's diagnostics channels and apparatus observations, one feature each."

[lib]
name = "registry"

[features]
default = ["diagnostics"]
diagnostics = ["dep:log", "dep:web-time"]
observations = ["diagnostics", "dep:apparatus-core"]

[dependencies]
apparatus-core = { workspace = true, optional = true }
log = { version = "0.4.29", optional = true }
web-time = { version = "1", optional = true }

[lints]
workspace = true
