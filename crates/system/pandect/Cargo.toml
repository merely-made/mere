[package]
name = "pandect"
version = "0.2.0"
authors = ["@mark-ik"]
license.workspace = true
edition = "2024"
# Publishable from 2026-08-14 as `pandect`.
publish = true

rust-version = "1.97.1"
readme = "README.md"
keywords = ["session", "state", "manifest", "graph", "mere"]
categories = ["data-structures"]
description = "Session manifests, graph and view sidecars, worker declarations, graph-reference adapters and application settings for Mere."

[features]
# The furnace's graph passes (forgetting, consolidation), moved from Athanor.
furnace = []
# The personal graph's device synchronization (engine split D69): the
# Stickleback and p2panda closure, off by default so the default stays light.
personal-sync = ["dep:p2panda-core", "dep:p2panda-store", "dep:stickleback", "dep:thiserror"]

[dependencies]
async-trait = "0.1"
insigne = { workspace = true, features = ["verify"] }
# Stored graph and policy identifiers use hexadecimal encodings.
hex = "0.4"
# The reservoir service: catalog, access, store lifetimes and sealing
# (engine split P4, D3, D9). Re-exported under the old names for cutover.
catchment = { workspace = true, features = ["store"] }
# The storage seam (2026-07-12): eidetic's Store is muniment::Backend.
muniment.workspace = true
kernel.workspace = true
# The native fold record (mer3ly site plan, Rulings 153 and 163).
identity.workspace = true
sporran.workspace = true
blake3 = "1.5"
# The wallet's CBOR, called directly: p2panda-core's helpers were these two
# calls, and its `rand` pulled getrandom 0.2 into the browser build.
ciborium = "0.2"
chacha20poly1305 = "0.11"
# Nonces and secrets from getrandom 0.3 directly, as graphshell's join draws
# them: `rand_core 0.6` would add a third getrandom major to the browser build.
getrandom = "0.3"
# The blob Store trait the content cache persists through (wasm-clean; the host
# supplies the concrete fjall / OPFS backend).
eidetic.workspace = true
# The facet store: the runtime tier of the one-node facet system (typed per-node
# metadata). session-runtime persists a `FacetStore<Uuid>` beside the session
# graph — the durable home the per-node sidecars (browser/participant) converge onto.
chartulary.workspace = true

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
# personal-sync only.
p2panda-core = { package = "p2mere-core", version = "0.10", optional = true }
p2panda-store = { package = "p2mere-store", version = "0.10", default-features = false, optional = true }
stickleback = { workspace = true, optional = true }
thiserror = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The reservoir's durable index (reservoir.rs): muniment's redb file backend,
# whose exclusive lock is the reservoir's one-owner rule. A mere's sessions
# (graph_session.rs) live in its directory backend, as Turnstone's files.
muniment = { workspace = true, features = ["redb", "directory"] }

[dev-dependencies]
tempfile = "3"
kernel = { workspace = true, features = ["fixtures"] }
servitor.workspace = true
# Tests construct sample graphs that need positions; kernel
# exposes the petgraph-backed API expecting `euclid::Point2D`.
euclid = "0.22"
# Store-adapter tests implement an in-memory Store (async-trait) and drive the
# async calls to completion (pollster), mirroring eidetic's own tests.
pollster = "0.4"
# Native test storage only; browser integration exercises IndexedDB.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The real fjall-backed Store, for the graph-codicil persistence test that proves
# a codicil survives a store close + reopen (the "survives restart" condition).
muniment = { workspace = true, features = ["fjall"] }
# access's and personal_sync's async tests; personal_sync's two-device test
# joins a real space over the transport.
murm-sync.workspace = true
transport = { workspace = true, features = ["test-identity"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
muniment = { workspace = true, features = ["indexeddb"] }
wasm-bindgen-test = "=0.3.79"
uuid = { version = "1", features = ["js"] }

[lints]
workspace = true
