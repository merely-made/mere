[package]
name = "pandect"
version = "0.1.1"
authors = ["@mark-ik"]
license.workspace = true
edition = "2024"
# Publishable from 2026-08-14 as `pandect`.
publish = true
rust-version = "1.92.0"
readme = "README.md"
keywords = ["session", "state", "manifest", "wallet", "mere"]
categories = ["data-structures"]
description = "Pandect: everything a Mere session gathers under one cover. Session manifests, graph and view sidecars, worker declarations, content and facet stores, settings, and the persona wallet carry lane -- a complete digest of one running session's record."

[dependencies]
# Certificate filenames are hex-encoded ids, so this is production code,
# not a test helper: wallet_grant/certificate.rs encodes on the write path.
hex = "0.4"
# The platform data dir, for the family-shared identity root.
dirs = "5"
# The storage seam (2026-07-12): eidetic's Store is muniment::Backend.
muniment.workspace = true
incipit.workspace = true
kernel.workspace = true
alembic = { workspace = true, features = ["recall"] }
forme.workspace = true
identity.workspace = true
notochord.workspace = true
blake3 = "1.5"
# The wallet's CBOR, called directly: p2panda-core's helpers were these two
# calls, and its `rand` pulled getrandom 0.2 into the browser build.
ciborium = "0.2"
chacha20poly1305 = "0.11"
# Nonces and secrets from getrandom 0.3 directly, as graphshell's join draws
# them: `rand_core 0.6` would add a third getrandom major to the browser build.
getrandom = "0.3"
# The blob Store trait the content cache persists through (wasm-clean; the host
# supplies the concrete fjall / OPFS backend).
eidetic.workspace = true
# The facet store: the runtime tier of the one-node facet system (typed per-node
# metadata). session-runtime persists a `FacetStore<Uuid>` beside the session
# graph — the durable home the per-node sidecars (browser/participant) converge onto.
chartulary.workspace = true

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabard = { workspace = true }
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The reservoir's durable index (reservoir.rs): muniment's redb file backend,
# whose exclusive lock is the reservoir's one-owner rule. A mere's sessions
# (graph_session.rs) live in its directory backend, as Turnstone's files.
muniment = { workspace = true, features = ["redb", "directory"] }

[dev-dependencies]
tempfile = "3"
kernel = { workspace = true, features = ["fixtures"] }
servitor.workspace = true
# Tests construct sample graphs that need positions; kernel
# exposes the petgraph-backed API expecting `euclid::Point2D`.
euclid = "0.22"
# content_store tests implement an in-memory Store (async-trait) and drive the
# async calls to completion (pollster), mirroring eidetic's own tests.
async-trait = "0.1"
pollster = "0.4"
# The real fjall-backed Store, for the graph-codicil persistence test that proves
# a codicil survives a store close + reopen (the "survives restart" condition).
eidetic = { workspace = true, features = ["fjall"] }
