[package]
name = "mere-framing"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "A magic-and-version header for stored and sent postcard records."

[lib]
name = "framing"
path = "src/lib.rs"

[dependencies]
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = "1"
