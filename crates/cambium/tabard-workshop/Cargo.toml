[package]
rust-version = "1.97.1"
name = "tabard-workshop"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Tabard's reusable appearance workshop surface and authored-theme workflow"
readme = "README.md"

[features]
default = []
host-previews = ["dep:cambium-rootstock"]
native-host = ["dep:cambium-genet-winit-host", "host-previews"]

[dependencies]
tabard.workspace = true
tinct.workspace = true
cambium = { workspace = true, features = ["highlight"] }
sprigging.workspace = true
mere-document-lanes.workspace = true
document-canvas.workspace = true
inker.workspace = true
netrender.workspace = true
genet-livery.workspace = true
genet-scripted-dom.workspace = true
layout-dom-api.workspace = true
paint_list_render.workspace = true
livery.workspace = true
cambium-rootstock = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cambium-genet-winit-host = { workspace = true, optional = true }

[dev-dependencies]
netrender = { workspace = true, features = ["vello-cpu"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"
genet-render-host.workspace = true
cambium-genet-winit-host.workspace = true
taproot.workspace = true
genet-scripted-dom.workspace = true
layout-dom-api.workspace = true
accesskit = "0.24"
winit.workspace = true
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
