[package]
name = "backstep"
version = "0.2.0"
description = "An editor's ephemeral state: snapshot undo with keyed coalescing and a saved marker, a host-implemented clipboard contract, and linear back/forward navigation."
authors.workspace = true
edition.workspace = true

rust-version = "1.97.1"
license = "MPL-2.0"
repository.workspace = true
keywords = ["undo", "redo", "history", "editor", "clipboard"]
categories = ["gui", "data-structures"]
# Renamed from `edit-history` on 2026-10-15 (Mark), who then cleared it for
# publishing; `backstep` was free on crates.io at that date. No dependencies.
# 0.1.0 is published; 0.2.0 (unpublished) adds the clipboard contract and
# chrome's linear history (engine-split D27, 2026-11-08).

[lib]
name = "backstep"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
# A host keeps scene traces in this history (tests/scene_trace_history.rs); the
# scene crates are Graphshell's, so the test lives here, above them.
sceno.workspace = true
scenotime.workspace = true

[lints]
workspace = true
