[package]
name = "backstep"
version = "0.1.0"
description = "Undo and redo over whole-document snapshots, with keyed coalescing on a host clock and a saved marker."
authors.workspace = true
edition.workspace = true

rust-version = "1.97.1"
license = "MPL-2.0"
repository.workspace = true
keywords = ["undo", "redo", "history", "editor"]
categories = ["gui", "data-structures"]
# Renamed from `edit-history` on 2026-10-15 (Mark), who then cleared it for
# publishing; `backstep` was free on crates.io at that date. No dependencies.

[lib]
name = "backstep"
path = "src/lib.rs"

[dependencies]
