[package]
name = "cambium-winit-a11y"
version = "0.3.0"
description = "AccessKit hosting for genet-backed Cambium applications on winit"
edition.workspace = true
rust-version = "1.92"
license = "MPL-2.0"
repository.workspace = true
# Can never be published, and that is the reason this crate exists. It needs the
# laid-out genet DOM and the platform adapter
# (`genet-winit-host`), both of which inherit genet's `publish = false`. Holding
# them here keeps `cambium-winit` itself down to `cambium` + `winit`, so the
# key-translation half is publishable and reachable from a registry consumer.
# Split out of cambium-winit 2026-07-26; the code is unchanged.
publish = false

[features]
default = ["image-decode"]
# Forwards genet-livery's image decoding (mer3ly Ruling 111); on by default.
image-decode = ["genet-render/image-decode", "cambium-rootstock/image-decode"]

[dependencies]
sprigging = { version = "0.2.0", path = "../sprigging" }
# The neutral accessibility seam this crate implements for winit. The
# request vocabulary lives there because it never named winit or AccessKit
# in the first place; only the window handle below is ours.
cambium-rootstock = { version = "0.1.0", path = "../cambium-rootstock", default-features = false }
winit = "0.30.13"
accesskit = "0.24"
genet-render = { workspace = true }
genet-winit-host = { workspace = true }
genet-scripted-dom = { workspace = true }
layout-dom-api = { workspace = true }

[dev-dependencies]
# Experiment E1a's session half (app composition brief, AC3): two retained
# sessions laid out, projected, grafted as AccessKit subtrees and read back
# through the consumer under each pinned adapter.
cambium = { version = "0.3.3", path = "../cambium" }
mere-surface-api = { workspace = true }
uxtree = { workspace = true }
accesskit_consumer_windows = { package = "accesskit_consumer", version = "=0.35.0" }
accesskit_consumer_unix = { package = "accesskit_consumer", version = "=0.36.0" }
accesskit_consumer_macos = { package = "accesskit_consumer", version = "=0.38.0" }
