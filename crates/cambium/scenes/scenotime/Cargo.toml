[package]
rust-version = "1.97.1"
name = "scenotime"
version = "0.0.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Runtime for the scenograph projection engine: stable epochs, idempotent diffs, host-clocked transitions, and picking."
readme = "../README.md"
keywords = ["projection", "scene", "incremental", "runtime"]
categories = ["visualization", "caching"]

[dependencies]
sceno = { version = "0.0.6", path = "../sceno" }
serde = { version = "1.0.219", features = ["derive"] }
# Carries a scene-trace step's opaque host annotation, as sceno's
# `Arrangement::Custom` carries its config. sceno already depends on it, so
# this names a crate scenotime built against, not a new class of dep.
serde_json = "1.0.140"

[dev-dependencies]
# The tests show a host keeping scene traces in Cambium's one history.
backstep = { version = "0.1.0", path = "../../backstep" }
