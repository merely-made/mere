[package]
rust-version = "1.97.1"
name = "scenograph"
version = "0.0.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Host-neutral authoring model for durable Scenograph projection definitions."
readme = "../README.md"
keywords = ["projection", "authoring", "scene", "visualization"]
categories = ["visualization", "data-structures"]

[dependencies]
backstep.workspace = true
# A swatch's subgraph scope (Scenograph editor plan, SE63, SE67).
curation = { package = "mere-curation", version = "0.1.0", path = "../../../forme/curation" }
# `SourceRef`, the score contract's source identity, which a resolved dataset's
# occurrences carry.
sceno = { version = "0.0.6", path = "../sceno" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# The value-level script contract, the trait only (Scenograph editor plan, SE39,
# SE92). The engine behind it is the host's choice; scenograph links none.
# Optional (SE98): a git dependency would block a crates.io release.
script-engine-api = { workspace = true, optional = true }

[features]
# Run `Condition::Script` (`RuleSet::resolve_with_scripts`). Off by default: the
# condition is data and always present, and `resolve` refuses a set carrying one.
scripts = ["dep:script-engine-api"]
