[package]
rust-version = "1.97.1"
name = "scenomise"
version = "0.0.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Choreography for the scenograph projection engine: placement algorithms that realize persisted scores into arranged scenes."
readme = "../README.md"
keywords = ["layout", "projection", "scene", "graph"]
categories = ["visualization", "algorithms"]

[features]
# Inert attributed-block transport; geometry-only users do not take a parser.
djot = ["dep:jotdown"]
# The projection editor's reducer (`authoring`): a draft, its undo history and
# a panel workbench. It carries state between calls, which the closed-form
# solvers do not, so a consumer that only places scenes does not take it.
authoring = ["dep:backstep", "dep:workbench"]

[dependencies]
jotdown = { version = "0.10", optional = true }
sceno = { version = "0.0.5", path = "../sceno" }
scenograph = { version = "0.0.4", path = "../scenograph" }
# The registry's capability records serialize, and a custom arrangement's
# config is the opaque `serde_json::Value` the score already carries.
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# The solvers' transcendentals (`math`): the same bits on every target, so an
# arrangement does not depend on the machine that solved it (ruling S4).
libm = { workspace = true }
backstep = { version = "0.1.0", path = "../../backstep", optional = true }
workbench = { version = "0.1.0", path = "../../workbench", optional = true }

[dev-dependencies]
# A composed facet opens as a scenotime snapshot (Scenograph editor plan, S1).
scenotime = { version = "0.0.4", path = "../scenotime" }
