[package]
name = "cambium-genet-web-host"
version = "0.1.0"
description = "The browser event source for a Cambium application host: DOM events and a canvas, grafted onto cambium-rootstock"
edition.workspace = true
rust-version = "1.92"
license = "MPL-2.0"
repository.workspace = true
# Same posture as the winit event source: it rides Genet's retained
# Livery/Buckram host integration, which remains unpublished. Consumers take it
# from genet.git by branch.
publish = false

[dependencies]
# The stock this is grafted onto. Everything below is what a browser adds.
cambium-rootstock = { version = "0.1.0", path = "../cambium-rootstock" }
cambium = { version = "0.3.3", path = "../cambium" }
genet-render-host = { workspace = true }
genet-scripted-dom = { workspace = true }
netrender = { workspace = true }
wgpu = { workspace = true }
# The accessibility mirror: genet's neutral projection, lowered to ARIA, and
# AccessKit only to read what a leaf says of itself.
document-session-api = { workspace = true }
accesskit = "0.24"
# Walking the laid-out DOM for the mirror's targets and a leaf's key.
layout_dom_api = { workspace = true }

# The browser itself. Declared for wasm32 only, so a native build of the
# workspace resolves none of it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.127"
web-sys = { version = "0.3", features = [
    "CompositionEvent",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "PointerEvent",
    "Text",
    "WheelEvent",
    "Window",
] }

# The mirror's tests lay the example page out without a window.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cambium-genet-winit-host = { version = "0.1.0", path = "../cambium-genet-winit-host" }

# The accessibility page, mounted in a browser.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[[example]]
name = "a11y_page"
path = "examples/a11y_page/main.rs"
crate-type = ["cdylib"]
