[package]
name = "cambium-web"
version = "0.1.0"
description = "The browser event source for a Cambium application host: DOM events and a canvas, grafted onto cambium-rootstock"
edition.workspace = true

rust-version = "1.97.1"
license = "MPL-2.0"
repository.workspace = true
# Same posture as the winit event source: it rides Genet's retained
# Livery/Buckram host integration, which remains unpublished. Consumers take it
# from genet.git by branch.
publish = false

[lib]
name = "cambium_genet_web_host"

[features]
default = ["image-decode", "webgpu"]
# The WebGPU presentation route. A WebGL2-only artifact leaves it out, so its
# boot path, and with Netrender's `without-classic-vello` the Classic
# renderer, are not linked.
webgpu = []
# Composition of portable scenes into one page scene (Netrender's sparse
# fragment resolver). Direct WebGL2 presents through it; WebGPU can too.
portable = ["netrender/vello-webgl"]
# Direct WebGL2 presentation, independently of optional WebGPU compute.
webgl = ["portable"]
# Forwards genet-livery's image decoding (mer3ly Ruling 111); on by default.
image-decode = ["cambium-rootstock/image-decode", "mesquite/image-decode"]

[dependencies]
# The stock this is grafted onto. Everything below is what a browser adds.
cambium-rootstock = { version = "0.1.0", path = "../cambium-rootstock", default-features = false }
cambium = { version = "0.6.0", path = "../cambium" }
genet-presenter = { workspace = true }
genet-scripted-dom = { workspace = true }
netrender = { workspace = true }
paint_list_render = { workspace = true, features = ["resource-bundle"] }
paint_list_api = { workspace = true }
wgpu = { workspace = true }
# The accessibility mirror lowers Rootstock's composed host projection to ARIA.
document-session-api = { workspace = true, features = ["accesskit"] }
accesskit.workspace = true
# DOM and layout fixture vocabulary.
layout_dom_api = { workspace = true }

# The browser itself. Declared for wasm32 only, so a native build of the
# workspace resolves none of it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
mesquite = { path = "../mesquite", default-features = false }
js-sys = "0.3"
wasm-bindgen = "=0.2.129"
# Reading a chosen file's bytes, which the browser hands over asynchronously.
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "CompositionEvent",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FocusEvent",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "PointerEvent",
    "Performance",
    "Text",
    "WheelEvent",
    "Window",
    "WebglLoseContext",
    "WebGlSync",
] }

# The mirror's tests lay the example page out without a window.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sprigging = { version = "0.3.0", path = "../sprigging" }
cambium-desktop = { version = "0.1.0", path = "../cambium-genet-winit-host" }
netrender = { workspace = true, features = ["vello-cpu"] }

# The accessibility page, mounted in a browser.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook = "0.1"
tabard.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[example]]
name = "a11y_page"
path = "examples/a11y_page/main.rs"
crate-type = ["cdylib"]

# The one-run fixture for run_static_constructors_once; examples/ctor_once/run.mjs
# loads it in Node.
[[example]]
name = "ctor_once"
path = "examples/ctor_once/main.rs"
crate-type = ["cdylib"]

[[example]]
name = "presentation_page"
path = "examples/presentation_page/main.rs"
crate-type = ["cdylib"]
required-features = ["webgl"]
