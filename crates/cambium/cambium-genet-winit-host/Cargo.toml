[package]
name = "cambium-desktop"
version = "0.1.0"
description = "The single-root Cambium desktop host: winit lifecycle, Livery/Buckram layout and paint, input routing, and AccessKit sync over one GenetAppRunner"
edition.workspace = true

rust-version = "1.97.1"
license = "MPL-2.0"
repository.workspace = true
# Rides genet-livery / genet-winit-host, which inherit genet's publish = false,
# so this host can never publish either — the same posture as
# cambium-winit-a11y, and the reason cambium-winit stays a separate thin
# published crate. Consumers take this from genet.git by branch.
publish = false

[lib]
name = "cambium_genet_winit_host"

[features]
default = ["image-decode"]
# Forwards genet-livery's image decoding (mer3ly Ruling 111); on by default.
image-decode = ["taproot/image-decode", "cambium-rootstock/image-decode", "cambium-a11y/image-decode"]

[dependencies]
parley.workspace = true
# The accessibility tree type the host projects into and hands the adapter;
# named here so the `Harness` can return one for a test to assert against.
accesskit.workspace = true
# The desktop's file chooser (cambium-rootstock's file seam): the platform's
# open dialog, through the crate Graphshell's desktop already uses.
light-file-dialog = "3.21.3"
meristem = { version = "0.2.0", path = "../meristem" }
cambium = { version = "0.6.0", path = "../cambium" }
# The windowing-neutral half. This crate is now the winit event source for
# it: it converts winit input into the neutral vocabulary and routes.
cambium-rootstock = { version = "0.1.0", path = "../cambium-rootstock", default-features = false }
cambium-winit = { version = "0.3.0", path = "../cambium-winit" }
cambium-a11y = { version = "0.3.0", path = "../cambium-winit-a11y", default-features = false }
sprigging = { version = "0.3.0", path = "../sprigging" }
# The semantic-selector resolver the headless `Harness` drives applications by,
# so a host test targets a control by role and label rather than by pixel.
# Named genet-probe until genet 7baa554c (2026-09-14).
taproot = { workspace = true }
genet-scripted-dom = { workspace = true }
genet-winit = { workspace = true }
layout_dom_api = { workspace = true }
netrender = { workspace = true }
paint_list_api = { workspace = true }
paint_list_render = { workspace = true }
wgpu = { workspace = true }
# Named directly for the `Surface` implementation's return type; it already
# arrived transitively through genet-winit-host.
genet-presenter = { workspace = true }
winit = { workspace = true }

[dev-dependencies]
taproot = { workspace = true, features = ["estimated-probe-fixtures"] }
workbench = { workspace = true }
serde_json = { workspace = true }
mesquite = { version = "0.1.0", path = "../mesquite" }

# The tests drive the harness by role/label, and read the DOM directly for the
# assertions the state does not carry.
layout_dom_api = { workspace = true }

# macOS only, and only for one thing: reading the traffic lights' own frames so
# the reserved region is measured rather than guessed at a size Apple has
# changed before. winit already builds on objc2, so this adds no new toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
