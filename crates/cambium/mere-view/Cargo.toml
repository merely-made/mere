[package]
name = "mere-view"
version = "0.1.0"
description = "The mere view: a mere's sessions and graph as one Cambium component every application embeds."
edition.workspace = true

rust-version = "1.97.1"
license = "MPL-2.0"
repository.workspace = true
keywords = ["mere", "cambium", "graph", "sessions", "gui"]
categories = ["gui"]
publish = true

[features]
# Subgraph derivation (moved from `mere`, D54) needs incipit's forme and Serde;
# off, mere-view's cone stays free of taffy and petgraph.
subgraph = ["incipit/arrangement", "dep:serde", "dep:serde_json"]
query = ["subgraph", "dep:linked-data", "linked-data/query"]
# Editable query UI is absent from ordinary mere views and the site viewer.
query-editor = ["query"]
workbench-editor = ["dep:platen", "platen/workspace-editor"]
presentation-editor = []
# The gloss outline and graph digests (moved from `mere`, D98): the outline
# snapshot, minimap geometry and the document outline into uxtree.
gloss = [
    "cartography/canvas",
    "dep:accesskit",
    "dep:inker",
    "dep:netrender",
    "dep:tabard",
    "dep:tracing",
    "dep:uxtree",
]

[dependencies]
linked-data = { workspace = true, optional = true }
platen = { path = "../../platen/platen", default-features = false, optional = true }
cambium = { workspace = true }
# Graph-only layouts by strategy id, over a kernel graph built from the model,
# and the channel registry: the spectral coordinates a graph-only layout reads
# (dynamics grammar plan, G2b, F53).
cartography = { workspace = true, features = ["signals"] }
incipit = { workspace = true }
kernel = { workspace = true }
# The paint leaf's colour type; hosts supply the palette.
sprigging = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }
inker = { workspace = true, optional = true }
netrender = { workspace = true, optional = true }
tabard = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uxtree = { workspace = true, optional = true }

[dev-dependencies]
scenograph = { workspace = true, features = ["editor"] }
cartography = { workspace = true, features = ["canvas", "physics-engine"] }
serde_json.workspace = true
euclid = "0.22"
kernel = { workspace = true, features = ["fixtures"] }
netrender.workspace = true

mandrake = { workspace = true }
# The headed harness (examples/harness.rs) and its scenario lane.
cambium-desktop = { workspace = true }
genet-scripted-dom = { workspace = true }
taproot = { workspace = true, features = ["image-decode"] }
layout_dom_api = { workspace = true }

[lints]
workspace = true
