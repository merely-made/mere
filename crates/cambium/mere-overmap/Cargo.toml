[package]
name = "mere-overmap"
version = "0.1.0"
description = "A mere route read from another device or application: the route's wire vocabulary, and the mere view filled from its projections over an admitted session."
edition.workspace = true
rust-version = "1.97.1"
license = "MPL-2.0"
repository.workspace = true
keywords = ["mere", "cambium", "graph", "sessions", "remote"]
categories = ["gui"]
publish = true

[features]
default = ["view"]
# The mere view over a route: `route` fills `mere-view`'s model from the
# route's projections, and `route_session` drives one admitted endpoint on
# graphshell-client's `SessionDriver`. Off, the crate is the wire vocabulary
# alone, which a host that serves the route (Graphshell's `mere_host`) takes
# without the view's Cambium cone.
view = ["dep:mere-view", "dep:graphshell-client", "dep:hest", "dep:cartography", "dep:sceno", "dep:uuid"]

resident = ["dep:djinn", "view", "dep:graphshell-endpoint"]

[dependencies]
djinn = { workspace = true, optional = true, features = ["door-native"] }
chirograph.workspace = true
kernel.workspace = true
pandect.workspace = true
scenotime.workspace = true
serde.workspace = true
serde_json.workspace = true
# The relation adapter id the graph projection's items name.
cartography = { workspace = true, optional = true }
graphshell-client = { workspace = true, optional = true }
hest = { workspace = true, optional = true }
graphshell-endpoint = { workspace = true, optional = true, features = ["projection-door"] }
mere-view = { workspace = true, optional = true }
sceno = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
