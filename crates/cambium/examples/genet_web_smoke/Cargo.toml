[package]
rust-version = "1.97.1"
name = "genet-web-smoke"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone project — intentionally NOT a workspace member, in mere as it was
# in genet (it carries its own `[workspace]` and `[patch]` tables, and
# `cargo check --workspace` does not cover it). Proves the genet engine core
# renders in a browser: cambium view tree -> ScriptedDom ->
# Livery + Buckram -> PaintList -> paint_list_render -> netrender ->
# WebGPU canvas surface. No Servo shell, no winit, no JS engine.
#
# Build (from genet/ root):
#   cargo build --manifest-path examples/genet_web_smoke/Cargo.toml --target wasm32-unknown-unknown
#   wasm-bindgen --target web --out-dir examples/genet_web_smoke/pkg \
#     examples/genet_web_smoke/target/wasm32-unknown-unknown/debug/genet_web_smoke.wasm
#   python -m http.server -d examples/genet_web_smoke 8000
# then open http://localhost:8000 in a WebGPU browser (Chrome/Edge).
#
# netrender crates come from merely-made/netrender git (converted from the
# first receipt's sibling path deps once the per-target-webgpu commit
# landed on main, per the netrender_smoke pattern).

[lib]
name = "genet_web_smoke"
crate-type = ["cdylib"]
path = "src/lib.rs"

[workspace]

[dependencies]
# View layer. Cambium landed in mere on 2026-09-03 under the platform boundary
# plan (P2), and this example came with it, so `cambium` is a plain relative
# path inside this repository again — no sibling checkout needed. Cambium
# declares genet-scripted-dom by version; the patch below pulls that registry
# edge onto the same genet revision so the ScriptedDom and observable
# contracts unify with genet-livery's graph.
cambium = { path = "../../cambium" }

# genet engine core. These were relative paths into genet's `components/`;
# from mere they are git pins at the revision every genet.git pin in this
# repository names.
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }
genet-livery = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }

# Rasterizer stack shares one published source with Genet through the root
# bridge below, so paint_list_api unifies with genet-livery's copy.
netrender = { git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
netrender_device = { git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
paint_list_api = { git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
paint_list_render = { git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }

wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu"] }

# Web glue. Keep wasm-bindgen exact so its generated schema stays deliberate.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "console",
] }
console_error_panic_hook = "0.1"

# Mirrors the genet workspace [patch.crates-io] entries this dependency
# graph needs (patches are per-workspace-root, and this example is its
# own workspace). Same rationale comments as genet/Cargo.toml. Each was a path
# into genet's checkout and is now a git pin at the same revision; cargo finds
# `genet-taffy` and `sonic-rs` by package name anywhere in that repository.
[patch.crates-io]
# Keep the standalone smoke on this checkout's current scripted-DOM and
# render-neutral DOM contracts instead of a previously published graph.
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084", version = "=0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084", version = "=0.1.1" }
# Published Genet Taffy fork, locally patched to this checkout for smoke builds.
# The exact versions pick one package each: genet holds two `genet-taffy`s.
genet-taffy = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084", version = "=0.14.0" }
# ahash runtime-rng/getrandom-0.3 drop for the wasm graph.
sonic-rs = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }
# Classic 0.11 and its owned repairs; standalone patches are not inherited.
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }

[workspace.package]
rust-version = "1.97.1"

# Published shadow-resource repair across Genet and host renderer contracts.
# Genet retains its qualified source pin; this root redirects the complete
# runtime family to one immutable Git source identity. Standalone roots must
# repeat this bridge. Retire after coordinated Genet supplier adoption.
[patch."https://github.com/merely-made/netrender.git"]
netrender = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
netrender_device = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
paint_list_api = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
paint_list_render = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
