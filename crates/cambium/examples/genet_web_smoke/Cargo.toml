[package]
rust-version = "1.97.1"
name = "genet-web-smoke"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone project — intentionally NOT a workspace member, in mere as it was
# in genet (it carries its own `[workspace]` and `[patch]` tables, and
# `cargo check --workspace` does not cover it). Proves the genet engine core
# renders in a browser: cambium view tree -> ScriptedDom ->
# Livery + Buckram -> PaintList -> paint_list_render -> netrender ->
# WebGPU canvas surface. No Servo shell, no winit, no JS engine.
#
# Build (from genet/ root):
#   cargo build --manifest-path examples/genet_web_smoke/Cargo.toml --target wasm32-unknown-unknown
#   wasm-bindgen --target web --out-dir examples/genet_web_smoke/pkg \
#     examples/genet_web_smoke/target/wasm32-unknown-unknown/debug/genet_web_smoke.wasm
#   python -m http.server -d examples/genet_web_smoke 8000
# then open http://localhost:8000 in a WebGPU browser (Chrome/Edge).
#
# netrender crates come from merely-made/netrender git (converted from the
# first receipt's sibling path deps once the per-target-webgpu commit
# landed on main, per the netrender_smoke pattern).

[lib]
name = "genet_web_smoke"
crate-type = ["cdylib"]
path = "src/lib.rs"

[workspace]

[dependencies]
# View layer. Cambium landed in mere on 2026-09-03 under the platform boundary
# plan (P2), and this example came with it, so `cambium` is a plain relative
# path inside this repository again — no sibling checkout needed. Cambium
# declares genet-scripted-dom by version; the patch below pulls that registry
# edge onto the same genet revision so the ScriptedDom and observable
# contracts unify with genet-livery's graph.
cambium = { path = "../../cambium" }

# genet engine core. These were relative paths into genet's `components/`;
# from mere they are git pins at the revision every genet.git pin in this
# repository names.
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-livery = { git = "https://github.com/merely-made/genet.git", branch = "main" }

# Rasterizer stack shares one published source with Genet through the root
# bridge below, so paint_list_api unifies with genet-livery's copy.
netrender = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_render = { git = "https://github.com/merely-made/netrender.git", branch = "main" }

wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu"] }

# Web glue. Keep wasm-bindgen exact so its generated schema stays deliberate.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "console",
] }
console_error_panic_hook = "0.1"

# Mirrors the genet workspace [patch.crates-io] entries this dependency
# graph needs (patches are per-workspace-root, and this example is its
# own workspace). Same rationale comments as genet/Cargo.toml. Each was a path
# into genet's checkout and is now a git pin at the same revision; cargo finds
# `genet-taffy` and `sonic-rs` by package name anywhere in that repository.
[patch.crates-io]
# Canonical promoted families; keep registry and Git consumers type-identical.
armillary = { git = "https://github.com/merely-made/armillary.git", rev = "92d5b15cf39aaac40a3f2d863ffee69c9be11bfc" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "738ef15956a29a125820b2d6c2280d39a6214f8e" }
commons-spine = { git = "https://github.com/merely-made/gemot.git", rev = "692674ca66728f5b0dbb2fc7e756acaa83626f5c" }
dict-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "738ef15956a29a125820b2d6c2280d39a6214f8e" }
errand = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
esp = { git = "https://github.com/merely-made/esp.git", rev = "6d6ad84b773c9baf2390bd7807a21ca9887e6efd" }
finger-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
fsp-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
gemini-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
gemot = { git = "https://github.com/merely-made/gemot.git", rev = "692674ca66728f5b0dbb2fc7e756acaa83626f5c" }
gopher-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
guppy-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
hagiograph = { git = "https://github.com/merely-made/eidetic.git", rev = "738ef15956a29a125820b2d6c2280d39a6214f8e" }
kepler-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
luggage = { git = "https://github.com/merely-made/eidetic.git", rev = "738ef15956a29a125820b2d6c2280d39a6214f8e" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", rev = "738ef15956a29a125820b2d6c2280d39a6214f8e" }
mien = { git = "https://github.com/merely-made/gemot.git", rev = "692674ca66728f5b0dbb2fc7e756acaa83626f5c" }
misfin = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
moothold = { git = "https://github.com/merely-made/gemot.git", rev = "692674ca66728f5b0dbb2fc7e756acaa83626f5c" }
mooting = { git = "https://github.com/merely-made/gemot.git", rev = "692674ca66728f5b0dbb2fc7e756acaa83626f5c" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "738ef15956a29a125820b2d6c2280d39a6214f8e" }
nex-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
scorpion-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
scroll-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
servitor = { git = "https://github.com/merely-made/eidetic.git", rev = "738ef15956a29a125820b2d6c2280d39a6214f8e" }
spartan-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", rev = "738ef15956a29a125820b2d6c2280d39a6214f8e" }
text-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
# Keep the standalone smoke on this checkout's current scripted-DOM and
# render-neutral DOM contracts instead of a previously published graph.
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
# Published Genet Taffy fork, locally patched to this checkout for smoke builds.
# The exact versions pick one package each: genet holds two `genet-taffy`s.
genet-taffy = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.14.0" }
# ahash runtime-rng/getrandom-0.3 drop for the wasm graph.
sonic-rs = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Classic 0.11 and its owned repairs; standalone patches are not inherited.
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }

[workspace.package]
rust-version = "1.97.1"
