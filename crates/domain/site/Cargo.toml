[package]
name = "mere-site"
version = "0.1.0"
edition.workspace = true
rust-version = "1.97.1"
license.workspace = true
repository.workspace = true
description = "Portable native-site manifests and canonical publication snapshots"

[dependencies]
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
language-tags = "0.3"
time = { version = "0.3", features = ["parsing"] }
muniment = { workspace = true, optional = true }
eidetic = { workspace = true, optional = true }
gemot = { workspace = true, optional = true }
personae = { workspace = true, optional = true }
stickleback = { workspace = true, optional = true }

[features]
default = []
history = ["dep:muniment"]
publication = ["dep:muniment", "dep:eidetic", "dep:gemot", "dep:personae", "dep:stickleback"]

[dev-dependencies]
async-trait = "0.1"
pollster = "0.4"
tempfile = "3"
muniment = { workspace = true, features = ["directory", "redb"] }
proofs.workspace = true
servitor.workspace = true
mien.workspace = true
