[package]
rust-version = "1.97.1"
name = "uxtree"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable a11y / automation tree for the Mere browser — projects mere structural elements into AccessKit nodes."
documentation = "https://docs.rs/uxtree"
readme = "README.md"
keywords = ["accessibility", "a11y", "accesskit", "automation", "tree"]
categories = ["accessibility"]

[lib]
path = "src/lib.rs"

[features]
default = []
# `FrozenScene`'s AccessKit tree (`frozen::FrozenUxTree`): graphshell-client's
# frozen realization, which moved to the Graphshell repository, handed to the
# platform assistive stack.
frozen = ["dep:graphshell-client"]

[dependencies]
accesskit.workspace = true
graphshell-client = { workspace = true, optional = true }
inker.workspace = true
tracing.workspace = true

[dev-dependencies]
# Fold projection tests lower the committed Micron probe pages.
nematic.workspace = true
# Experiment E1a (app composition brief, AC3): the subtree join is checked
# against the shared stable consumer used by the pinned platform adapters.
accesskit_consumer.workspace = true

[lints]
workspace = true
