[package]
rust-version = "1.97.1"
name = "mere-chrome"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Graphshell domain layer for the Mere browser — root toolbar, app menu, address/omnibar, window chrome view-models."
documentation = "https://docs.rs/chrome"
readme = "README.md"
keywords = ["graphshell", "toolbar", "omnibar", "mere", "domain"]
categories = ["gui"]

[lib]
name = "chrome"
path = "src/lib.rs"

[dependencies]
# The linear back/forward history lives in backstep (engine-split D27).
backstep.workspace = true
# Host-enacted effects leave as hest Invocations (engine-split D29).
hest.workspace = true
incipit = { workspace = true, features = ["arrangement"] }
kernel.workspace = true
serde = { version = "1.0", features = ["derive"] }
url = "2"

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
