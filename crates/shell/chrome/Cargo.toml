[package]
rust-version = "1.97.1"
name = "mere-chrome"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser chrome state for the Mere family: address classification and suggestions, the omnibar search session, toolbar draft state and focus authorities."
documentation = "https://docs.rs/chrome"
readme = "README.md"
keywords = ["graphshell", "toolbar", "omnibar", "mere", "domain"]
categories = ["gui"]

[lib]
name = "chrome"
path = "src/lib.rs"

[dependencies]
# The linear back/forward history lives in backstep (engine-split D27).
backstep.workspace = true
kernel.workspace = true
serde = { version = "1.0", features = ["derive"] }
url = "2"

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
