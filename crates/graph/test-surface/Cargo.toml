[package]
name = "mere-test-surface"
version = "0.0.1"
authors = ["@mark-ik"]
license.workspace = true
edition = "2024"
# Mere's shared test graph (engine split D272): a dev-dependency only, never
# published, so it stays out of every published API.
publish = false

rust-version = "1.97.1"
description = "A minimal session graph for Mere's tests: surfaces that each show a resource over the engine's resource store."

[dependencies]
mere = { version = "0.1.0", path = "../engine", default-features = false }
oxrdf = { version = "0.3", features = ["rdf-12"] }
portolan.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[lints]
workspace = true
