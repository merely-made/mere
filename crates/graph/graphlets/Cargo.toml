[package]
name = "graphlets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure graphlet derivation and shape classification for the Mere graph family."
documentation = "https://docs.rs/graphlets"
readme = "README.md"
keywords = ["graph", "graphlets", "mere", "forme", "classifier"]
categories = ["algorithms", "data-structures"]

[lib]
path = "src/lib.rs"

[dependencies]
forme.workspace = true
kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
kernel = { workspace = true, features = ["fixtures"] }
euclid = "0.22"
# E3 probe only (recursive-query experiments plan, 2026-09-11): ascent prototype of
# graphlet derivation in `tests/ascent_bench.rs`. Delete together with that file.
ascent = "0.8"

[lints]
workspace = true
