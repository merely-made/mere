# The core pack (declared-lens D13, lessons D13): the user-agent pack every
# load resolves first. build.rs compiles it to canonical CBOR and emits the
# engine's id constants (D8). It carries no workspace terms (Traversal,
# Arrangement): those are Graphshell's pack (P7, C2).

id = "pack:core"
version = "0.1.0"
kind = ["vocabulary", "lens"]
licence = "MPL-2.0"
credit = ["Mark Alan Boykin"]
provides = ["rel:", "family:"]

[prefixes]
pack = "https://mere.computer/packs/"
rel = "https://mere.computer/ns/rel#"
family = "https://mere.computer/ns/family#"
axis = "https://mere.computer/ns/axis#"
stratum = "https://mere.computer/ns/stratum#"
durability = "https://mere.computer/ns/durability#"
retract = "https://mere.computer/ns/retractability#"
project = "https://mere.computer/ns/projectability#"
force = "https://mere.computer/ns/force#"
symmetry = "https://mere.computer/ns/symmetry#"
present = "https://mere.computer/ns/presentation#"
derive = "https://mere.computer/ns/derivation#"

# R2: an axis a row does not name, or names only with unobserved values.
[vocabulary.defaults]
"axis:stratum" = "stratum:resource"
"axis:durability" = "durability:retained-until-compaction"
"axis:retractability" = "retract:asserter"
"axis:projectability" = "project:projectable"
"axis:force" = "force:none"
"axis:symmetry" = "symmetry:directed"
"axis:presentation" = "present:generic"
"axis:derivation" = "derive:not-derived"

# The lens half: the core pack selects nothing beyond itself.
[lens]

# Families.

[[vocabulary.terms]]
iri = "family:semantic"
kind = "family"
labels = { en = "semantic" }

[[vocabulary.terms]]
iri = "family:containment"
