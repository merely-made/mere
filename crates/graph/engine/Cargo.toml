[package]
rust-version = "1.97.1"
name = "mere"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mere, the semantic-web engine: the assertion model and resource graph, linked-data formats, ingest, the RDF projection and SPARQL query."
publish = true
keywords = ["json-ld", "rdf", "linked-data", "graph", "semantic-web"]
categories = ["web-programming", "data-structures"]

[lib]
name = "mere"
path = "src/lib.rs"

[features]
default = ["bundled-contexts"]
# Vendored standard-vocabulary JSON-LD contexts (schema.org, ActivityStreams 2.0,
# plus a small Mere-authored Dublin Core context; ~220 KB) so an arbitrary remote
# `@context` resolves offline via `ContextCache::full()`. Disable for a slimmer
# binary — `full()` then equals `minimal()`. See `assets/NOTICE` for licensing.
bundled-contexts = []
# SPARQL query over the graph via spareval's `QueryableDataset`, evaluated
# over a dictionary-encoded quad index (chartulary::quads) built from the
# projected quads (no RocksDB, wasm-viable).
# Off by default: the dataset and the format entry points need no evaluator; base stays slim, only consumers that want SPARQL
# pull the evaluator. Tests retain a materialized spareval dataset as the
# parity oracle for the indexed dataset.
# Preserve directional JSON-LD terms previously enabled through Oxigraph.
query = ["dep:spareval", "dep:spargebra", "dep:oxsdatatypes", "dep:getrandom02", "oxjsonld/rdf-12"]

[dependencies]
serde.workspace = true
# Captured facets are decimal JSON and must replay to the same floating-point bits.
serde_json = { workspace = true, features = ["float_roundtrip"] }
uuid = { workspace = true, features = ["v5"] }
# The model's persisted types keep their rkyv archive shape (engine split P5 L3).
rkyv = { version = "0.8", features = ["std"] }
strum = { version = "0.28", features = ["derive"] }
petgraph = { version = "0.8.3", features = ["serde-1"] }
url = "2.5"
# SystemTime::now() through Date.now() in wasm32 browser hosts.
web-time = "1"
oxjsonld = "0.2"
oxttl = { version = "0.2", features = ["rdf-12"] }
oxrdf = { version = "0.3", features = ["rdf-12"] }
# RDF/XML parse only (D142), for the dataset entry points (always on).
oxrdfxml = { version = "0.2", features = ["rdf-12"] }
# The resource graph's substrate, and the id-level quad index the query
# feature's held dataset wraps.
chartulary.workspace = true
# Preserve query extensions previously enabled transitively by Oxigraph.
spareval = { version = "0.2.9", optional = true, features = ["sparql-12", "sep-0002", "sep-0006", "calendar-ext"] }
spargebra = { version = "0.4", optional = true, features = ["sparql-12"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# oxrdf's random blank-node support reaches getrandom 0.3. Browser builds also
# pass `--cfg getrandom_backend="wasm_js"`, following Mere's existing web lanes.
getrandom = { version = "0.3", features = ["wasm_js"] }
# Every prepared SPARQL query initializes NOW and its planning timer, even
# without an explicit NOW expression. Use the evaluator's browser clock.
oxsdatatypes = { version = "0.2", features = ["js"], optional = true }
# The evaluator's rand 0.8 has its own entropy backend, distinct from oxrdf.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }

[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }
# The W3C conformance harness (tests/w3c_conformance): SPARQL result files.
sparesults = { version = "0.3", features = ["sparql-12"] }

[lints]
workspace = true

# The headless resource inspector reads the dataset through SPARQL (D141 F11).
[[example]]
name = "inspect"
required-features = ["query"]
