[package]
rust-version = "1.97.1"
name = "mere-rdf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Compatibility shim: re-exports the `mere` engine's linked-data paths under their old names."
keywords = ["json-ld", "rdf", "linked-data", "graph", "semantic-web"]
categories = ["web-programming", "data-structures"]

[lib]
name = "linked_data"
path = "src/lib.rs"

[features]
default = ["bundled-contexts"]
bundled-contexts = ["mere/bundled-contexts"]
query = ["mere/query", "kernel/query"]

[dependencies]
mere = { version = "0.1.0", path = "../engine", default-features = false }
# The surface half of the projection and the contribution importer moved to
# `kernel::rdf` (engine split P5 L3); their old names here resolve there.
kernel.workspace = true

[lints]
workspace = true
