[package]
name = "mere-linked-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JSON-LD export/import bridge between the Mere graph kernel and linked data."
documentation = "https://docs.rs/linked-data"
keywords = ["json-ld", "rdf", "linked-data", "graph", "semantic-web"]
categories = ["web-programming", "data-structures"]

[lib]
name = "linked_data"
path = "src/lib.rs"

[features]
default = ["bundled-contexts"]
# Vendored standard-vocabulary JSON-LD contexts (schema.org, ActivityStreams 2.0,
# plus a small Mere-authored Dublin Core context; ~220 KB) so an arbitrary remote
# `@context` resolves offline via `ContextCache::full()`. Disable for a slimmer
# binary — `full()` then equals `minimal()`. See `assets/NOTICE` for licensing.
bundled-contexts = []
# SPARQL query over the graph via spareval's `QueryableDataset` evaluated
# directly over the projected quads (no store copy, no RocksDB, wasm-viable).
# Off by default: base linked-data stays slim, only consumers that want SPARQL
# pull the evaluator. Tests retain a materialized spareval dataset as the
# parity oracle for the borrowed adapter.
# Preserve directional JSON-LD terms previously enabled through Oxigraph.
query = ["dep:spareval", "dep:spargebra", "oxjsonld/rdf-12"]

[dependencies]
# The statement vocabulary (`LinkStatement`) produced by inker's pure
# `link_statements` walk; this crate carries the graph-side apply half.
inker.workspace = true
kernel.workspace = true
serde_json.workspace = true
uuid.workspace = true
oxjsonld = "0.2"
oxttl = { version = "0.2", features = ["rdf-12"] }
oxrdf = { version = "0.3", features = ["rdf-12"] }
# Preserve query extensions previously enabled transitively by Oxigraph.
spareval = { version = "0.2", optional = true, features = ["sparql-12", "sep-0002", "sep-0006", "calendar-ext"] }
spargebra = { version = "0.4", optional = true, features = ["sparql-12"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# oxrdf's random blank-node support reaches getrandom 0.3. Browser builds also
# pass `--cfg getrandom_backend="wasm_js"`, following Mere's existing web lanes.
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
kernel = { workspace = true, features = ["fixtures"] }
