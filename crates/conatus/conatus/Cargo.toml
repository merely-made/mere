[package]
name = "conatus"
version = "0.1.0"
edition = "2024"

rust-version = "1.97.1"
license.workspace = true
description = "Host-neutral 3D body, collision, query, and fixed-step runtime for Merely spatial applications and games."
repository = "https://github.com/merely-made/mere"
keywords = ["game-engine", "physics", "voxel", "spatial", "simulation"]
categories = ["game-engines", "simulation"]

[dependencies]
nisus = { workspace = true, optional = true }
# enhanced-determinism: wing ruling 604 and F165, replay bit for bit.
rapier3d = { version = "0.36", features = ["enhanced-determinism"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
cubecl = { version = "=0.11.1", default-features = false, features = ["std", "wgpu"], optional = true }
burn = { version = "=0.22.1", default-features = false, features = ["std"], optional = true }
burn-wgpu = { version = "=0.22.1", default-features = false, features = ["std", "autotune"], optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[features]
default = ["bodies"]
# The body, collision, query and fixed-step runtime on Rapier 3D: the crate's
# ordinary path. A consumer of the resident lane alone turns defaults off.
bodies = ["dep:nisus", "dep:rapier3d", "dep:serde"]
# CubeCL owns allocations. Raw-kernel consumers borrow views of those
# allocations, so this entire device carriage is opt-in and absent from the
# ordinary Conatus body/runtime path.
resident = [
    "dep:wgpu",
    "dep:bytemuck",
    "dep:cubecl",
    "dep:getrandom",
]
# Burn tensor views of resident planes (`ResidentChunk::burn_f32_view`).
burn = [
    "resident",
    "dep:burn",
    "burn/wgpu",
    "dep:burn-wgpu",
]

[[test]]
name = "resident_chunk"
required-features = ["burn"]

[[test]]
name = "resident"
required-features = ["resident"]

[[test]]
name = "exclusion"
required-features = ["resident"]

[[test]]
name = "voxel_integration"
required-features = ["bodies"]

[[test]]
name = "world_contacts"
required-features = ["bodies"]

[[test]]
name = "world_reads"
required-features = ["bodies"]

[[test]]
name = "world_refresh"
required-features = ["bodies"]

[dev-dependencies]
serde_json = "1"
pollster = "0.4"
seiche = { path = "../seiche" }
euclid = "0.22"
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan", "metal", "wgsl"] }
