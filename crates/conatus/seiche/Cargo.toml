[package]
name = "seiche"
version = "0.0.6"
edition = "2024"
license.workspace = true
description = "Kernel-free, rapier-backed force-directed graph layout: bodies bound to node keys, themable and tensorized force laws, and numen field couplings. A host feeds node keys + positions; seiche integrates."
repository = "https://github.com/merely-made/mere"
keywords = ["physics", "layout", "graph", "force-directed", "rapier"]
categories = ["graphics", "simulation"]

[lib]
path = "src/lib.rs"

[dependencies]
# rapier2d is the dynamics + collision substrate. Mere's spatial
# behavior (node exclusion, edge springs, themable moot fields) all
# resolve through this simulation, so the dep lands as a foundational
# layer alongside vello and petgraph rather than a feature bolt-on.
# enhanced-determinism (F165, carrying part of G8): cross-platform float
# results through libm and glamx scalar-math.
rapier2d = { version = "0.36", features = ["enhanced-determinism"] }
# NodeKey (the opaque body identifier) is petgraph's NodeIndex, the same type mere's
# kernel and chartulary use, so seiche stays graph-agnostic without depending on
# either; a consumer feeds its own node keys + positions in.
petgraph = "0.8"
# Field algebra: CouplingForce evaluates numen's default analytic path to drive
# Rapier bodies. Burn is local and opt-in for tensorized force laws only.
numen = { path = "../numen", version = "0.2" }
euclid = "0.22"
tracing = "0.1"
# The off-thread half of the `runtime` module: the actor harness a host offloads
# the simulation onto. Optional (feature `actor`, on by default) so a consumer
# that only wants the integrator — a wasm build, a batch layout job — takes the
# inline backend and no threading runtime at all.
armillary = { path = "../../armillary", version = "0.1.1", optional = true }
# The lagged evaluator on the host's device (feature `gpu`): conatus's
# resident lane, and the wgpu handle types a host passes in.
conatus = { path = "../conatus", version = "0.1.0", features = ["resident"], optional = true }
wgpu = { version = "30", default-features = false, optional = true }
burn = { version = "=0.22.0", default-features = false, features = ["std"], optional = true }
burn-wgpu = { version = "=0.22.0", default-features = false, features = ["std", "autotune"], optional = true }

# The dynamics spec's (de)serialization (feature `serde`): one serde type for
# every format, JSON in a saved scene, CBOR in personal sync, TOML for a recipe
# a person writes (dynamics grammar plan, G4a, F104).
serde = { version = "1", features = ["derive"], optional = true }
# Every refusal while reading a spec names its path (F113).
serde_path_to_error = { version = "0.1", optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
# No mere `kernel` dep: seiche is the kernel-free physics core. The graph glue that
# read/wrote a mere `Graph` (the former `kernel-bridge` wrappers) lives host-side now
# (mere-canvas's `build` adapters); the graph-free sync_nodes / sync_edges / positions
# are the whole interface a host drives.

[features]
default = ["actor"]
# `runtime::Physics::Actor`: the simulation on an armillary actor thread, with
# the inline backend always available. Off leaves `Physics` inline-only.
actor = ["dep:armillary"]
# Tensor laws are opt-in. The default integrator stays Burn-free.
tensor-burn = ["dep:burn", "burn/ndarray", "dep:getrandom"]
tensor-burn-wgpu = ["tensor-burn", "burn/wgpu", "burn/extension", "dep:burn-wgpu", "dep:getrandom"]
# NodeExclusion's law on the host's GPU, lagged (`seiche::gpu`).
gpu = ["dep:conatus", "dep:wgpu"]
# Benchmark-only staging helper for the exact NodeExclusion law.
gpu-bench = ["tensor-burn-wgpu"]
# The dynamics spec as data: serde on `spec` and the types it names.
serde = ["dep:serde", "dep:serde_path_to_error"]

[dev-dependencies]
uuid = "1"
# The spec's round trips: JSON as a scene carries it, TOML as a recipe file.
serde_json = "1"
toml = "0.8"
# The `gpu` receipts boot an adapter of their own.
pollster = "0.4"
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan", "metal", "wgsl"] }
