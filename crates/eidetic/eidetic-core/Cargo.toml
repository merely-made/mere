[package]
name = "eidetic"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Private local-memory lane for the Mere browser — typed blob request/response vocabulary and store trait, host-agnostic and storage-backend-agnostic."
documentation = "https://docs.rs/eidetic"
readme = "README.md"
keywords = ["memory", "storage", "blob", "browser", "mere"]
categories = ["data-structures"]

[lib]
name = "eidetic"
path = "src/lib.rs"

[dependencies]
# The personae signing binding for pack engrams (participant gate B4): the
# identity crate IS the "concrete shape lands with identity" note on
# SignatureRef, landed.
identity = { workspace = true, optional = true }
# The storage floor (2026-07-12): eidetic's `Store` was muniment's `Backend`
# declared twice — same get/put/delete/list seam. Eidetic now consumes it, and
# `eidetic::Store` is an alias so the layers above (manifests, schemas, engrams)
# read unchanged. Plan: design_docs/…/2026-07-12_eidetic_on_muniment_plan.md.
muniment = { path = "../muniment", version = "0.1.0", features = ["json"] }
async-trait = "0.1"
blake3 = "1.5"
jsonschema = { version = "0.18", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The browsing lineage bridge (`browsing::lineage`, feature `lineage`):
# projects stemma's live visit authority into durable BrowsingTrace engrams.
# Optional so wasm/OPFS consumers that only read memory skip the lineage crate.
# stemma is the promoted (MIT/Apache) successor to the retired in-tree
# node-lineage. Git sibling; local checkout via the gitignored
# `.cargo/config.toml` patch.
chartulary = { path = "../chartulary", version = "0.2.0", optional = true }
# Blob fetchers (features `https-fetcher`, `iroh-fetcher`).
transport = { workspace = true, optional = true }
ureq = { version = "2.10", default-features = false, features = ["tls"], optional = true }

[features]
default = ["pack-signing", "json-schema"]
# Personae-backed pack signing and verification. Browser consumers that only
# need storage, typed payloads, and browsing memory can omit the native
# identity/crypto cone.
pack-signing = ["dep:identity"]
# Full JSON Schema validation. Browser consumers that only use Mere-native
# schemas can omit the heavier validator and its platform-specific dependency
# cone while preserving a clear "validator unavailable" error for stored JSON
# Schema definitions.
json-schema = ["dep:jsonschema"]
lineage = ["dep:chartulary"]
# Blob fetchers for eidetic::resolve_blob, one per source kind.
https-fetcher = ["dep:ureq"]
iroh-fetcher = ["dep:transport"]

[dev-dependencies]
bytes = "1"
identity.workspace = true
mockito = "1.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
pollster = "0.4"
# Reference sealer for the encrypt-at-rest seam tests (`seal` module). Runtime
# stays crypto-free: the production PayloadSealer lives in the host, which owns
# the wallet epoch keys.
chacha20poly1305 = "0.11"
