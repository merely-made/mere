[package]
name = "hagiograph"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The history organ: standing marks along product-defined axes, feats judged against them, and deep time that gives a generated world its past. Judges and generates history; storage stays in journals."
readme = "README.md"
keywords = ["memory", "legend", "memorial", "history", "provenance"]
categories = ["data-structures"]
exclude = ["design_docs/"]

[dependencies]
serde = { workspace = true }

[dev-dependencies]
postcard = { version = "1", default-features = false, features = ["alloc"] }
