[package]
rust-version = "1.97.1"
name = "graphshell-endpoint"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Application-injected projection and intent boundary for Graphshell."

[features]
default = []
# The carriers, one feature each. The traits and `chirograph` stay wasm-clean;
# `network` brings Tokio's multi-threaded runtime.
local = ["dep:serde", "dep:serde_json"]
network = ["dep:serde_json", "dep:tokio"]
stdio = ["dep:serde_json"]
# The application side of the first-party door: admission, the app client,
# custody and its clients, quarantine, the owner-only local endpoint and
# tracked tasks (Graphshell stack lift plan, L1, ruling R3). Native only; the
# module is not compiled for wasm32 even with the feature on.
door = [
    "dep:base64",
    "dep:chatelaine",
    "dep:dramatis",
    "dep:insigne",
    "dep:libc",
    "dep:pandect",
    "dep:personae",
    "dep:rand_core",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "dep:uuid",
    "dep:windows-sys",
    "dep:zeroize",
    "tokio/net",
    "tokio/sync",
    "tokio/time",
]

[dependencies]
chirograph.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread"], optional = true }
# `door`: the identity views, custody and roster types the door carries.
base64 = { workspace = true, optional = true }
chatelaine = { workspace = true, optional = true }
dramatis = { workspace = true, optional = true }
insigne = { workspace = true, optional = true }
pandect = { workspace = true, optional = true }
personae = { workspace = true, optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
thiserror = { version = "1", optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zeroize = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
sceno.workspace = true
scenotime.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }
