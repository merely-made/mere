[package]
rust-version = "1.97.1"
name = "graphshell-endpoint"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Application-injected projection and intent boundary for Graphshell."

[features]
default = []
projection = ["dep:chirograph"]
local = ["projection", "dep:serde", "dep:serde_json"]
network = ["projection", "dep:serde_json", "dep:tokio"]
stdio = ["projection", "dep:serde_json"]
door = ["dep:serde", "dep:serde_json", "dep:thiserror", "dep:zeroize"]
door-native = ["door", "dep:personae", "dep:tokio", "dep:base64", "dep:rand_core"]
door-serve = ["door-native", "dep:armillary", "armillary/tokio", "dep:tracing", "dep:libc", "dep:windows-sys"]
custody = ["door", "dep:base64", "dep:chatelaine", "dep:dramatis", "dep:eidetic", "dep:insigne", "dep:personae", "dep:uuid"]
custody-client = ["custody", "door-native", "dep:tracing"]
projection-door = ["projection", "door-native"]
profile = ["custody-client"]

[dependencies]
chirograph = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { version = "1", optional = true }
zeroize = { version = "1", optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), any(unix, windows)))'.dependencies]
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread", "net", "time", "sync", "macros"], optional = true }
armillary = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chatelaine = { workspace = true, optional = true }
dramatis = { workspace = true, optional = true }
eidetic = { workspace = true, optional = true }
insigne = { workspace = true, optional = true }
personae = { workspace = true, optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_System_Threading"], optional = true }
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
sceno.workspace = true
scenotime.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }
