[package]
rust-version = "1.97.1"
name = "graphshell-door"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mere's side of Graphshell: the application door client, identity profile and projection provider routes, over the Graphshell protocol layer."
publish = false

[features]
default = []
# The projection client and carrier over the application connection, and the
# endpoint that forwards over it.
projection-door = ["dep:ostiary", "ostiary/native", "dep:serde_json", "dep:tokio"]
# Portable messages for the application projection provider route.
projection-offer = ["dep:ostiary", "dep:serde", "dep:serde_json"]
# The native runner for a projection offer.
projection-provider = ["projection-offer", "ostiary/native", "dep:tokio"]
# The Graphshell application's identity: the persona in use, as djinn releases it.
profile = ["dep:ostiary", "ostiary/native", "dep:castellan-client", "castellan-client/client", "dep:dramatis", "dep:insigne", "dep:personae"]

[dependencies]
chirograph.workspace = true
graphshell-endpoint = { workspace = true, features = ["projection"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ostiary = { workspace = true, optional = true }
castellan-client = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), any(unix, windows)))'.dependencies]
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread", "net", "time", "sync", "macros"], optional = true }
dramatis = { workspace = true, optional = true }
insigne = { workspace = true, optional = true }
personae = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
