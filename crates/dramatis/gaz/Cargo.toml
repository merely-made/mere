[package]
name = "gaz"
version = "0.0.1"
edition = "2024"
license.workspace = true
description = "The contact layer: persona-scoped contact records. Your petname for them, filed under an anchor that never moves (a typed root key, an atproto did:plc, or a local id), with keys, handles and endpoints each carrying their own trust state, plus kith/kin tiers and recency. A resolver finds the wide world; gaz keeps who you actually know."
repository = "https://github.com/merely-made/mere"
readme = "README.md"
keywords = ["contacts", "petname", "identity", "persona", "kith"]
categories = ["data-structures"]
exclude = ["design_docs/"]

[features]
# The host supplies both the backend and codec. The data model has no default
# features and no persistence dependency until this is selected.
muniment = ["dep:muniment"]

[dependencies]
# Typed public keys and retained proof artifacts are plain data in insigne,
# so gaz takes on no cryptography by depending on it.
insigne.workspace = true
serde.workspace = true
# The stack's UUID type, for local anchors. No default features: gaz reads no
# random source, so it never needs uuid's generators.
uuid = { version = "1", default-features = false }
# Direct declaration permits disabling muniment's default JSON codec without
# changing the workspace's default for other consumers.
muniment = { version = "0.1.2", path = "../../eidetic/muniment", default-features = false, optional = true }

[dev-dependencies]
# Real issuers and signature checks exercise retained proofs after reload;
# neither is part of gaz's production dependency graph.
personae.workspace = true
insigne = { workspace = true, features = ["verify"] }
# The binary codec muniment stores with, so the binary serde path is tested
# against the format M1 persists in.
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"
muniment = { version = "0.1.2", path = "../../eidetic/muniment", default-features = false, features = ["json", "postcard"] }
pollster = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
muniment = { version = "0.1.2", path = "../../eidetic/muniment", default-features = false, features = ["redb"] }
tempfile = "3"
