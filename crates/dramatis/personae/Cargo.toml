[package]
name = "personae"
version = "0.2.1"
edition = "2024"
license.workspace = true
description = "The identity and carry layer for the Merely ecosystem: a master Ed25519 keypair, deterministic per-protocol key derivation (BLAKE3), a passphrase/OS-store-unlocked vault, and sealed-record storage. A person has personae, plural — work, research, burner — so the crate is the register of your faces and their root of trust. Promoted from mere's persona/identity."
repository = "https://github.com/merely-made/mere"
keywords = ["identity", "ed25519", "keychain", "vault", "p2p"]
categories = ["cryptography", "authentication"]

[lib]
path = "src/lib.rs"

# Bins from the 2026-07-22 identity-vault-ssh-agent plan. Both are feature-
# gated so the published lib keeps its lean default dep tree.
#
# V2: serves vault `ssh` slots over the OpenSSH agent protocol (Windows
# named pipe / Unix socket).
[[bin]]
name = "personae-agent"
path = "src/bin/personae-agent.rs"
required-features = ["agent"]

# V3: inspect and manage the vault from a terminal. `agent` because its
# `add-ssh` door refuses keys the agent cannot sign, as `ssh-add` and
# castellan's import do (chatelaine ruling 60).
[[bin]]
name = "personae-vault"
path = "src/bin/personae-vault/main.rs"
required-features = ["agent"]

# Vault lock ruling 6's no-residue instrument. It installs its own global
# allocator, so it runs outside libtest's harness, on one thread.
[[test]]
name = "no_residue"
path = "tests/no_residue.rs"
harness = false

[features]
# SSH keys as vault slots (encode/decode/import). The agent, and the CLI
# whose import shares its signability door, need `agent` on top.
ssh = ["dep:ssh-key", "dep:signature", "dep:gethostname"]
# RSA signs through ring; the rsa crate only builds the key at load (rulings
# 52, 59: RUSTSEC-2023-0071 rules out its signing and decryption). ECDSA
# through RustCrypto's curves, named here rather than left to ssh-agent-lib's
# feature unification.
agent = [
  "ssh",
  "dep:ssh-agent-lib",
  "dep:tokio",
  "dep:tracing-subscriber",
  "dep:ring",
  "dep:rsa",
  "ssh-key/p256",
  "ssh-key/p384",
  "ssh-key/p521",
]
# Windows Hello as the unlock gate (vault lock rulings 21, 28). Elsewhere
# presence reports unavailable.
os-presence = ["dep:windows"]

[dependencies]
ed25519-dalek = { version = "3", features = ["zeroize"] }
blake3 = "1.5"
# Delegation statements and attestations live in insigne; personae issues them
# and needs the checks.
insigne = { workspace = true, features = ["verify"] }
getrandom = "0.3"
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "1"
tracing = "0.1"
# Passphrase-encrypted storage + sealed-record backends.
# `zeroize` clears the working memory we hand it (vault lock ruling 33).
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# `agent` feature: SSH agent protocol + OpenSSH key handling. The `signature`
# traits are how ssh-key exposes signing. ssh-key's `rsa` feature is not asked
# for here: its RSA signer is the rsa crate's, which the agent never calls.
ssh-agent-lib = { version = "0.6", optional = true }
ssh-key = { version = "0.6", features = ["ed25519"], optional = true }
# RSA private-key operations, constant-time. Already in the lock (rustls).
ring = { version = "0.17.14", optional = true }
# Builds the full RSA key (CRT values included) from OpenSSH's components and
# exports it as PKCS#8 for ring, once per load (ruling 59). Already in the
# graph through ssh-agent-lib's ssh-key `crypto` feature.
rsa = { version = "0.9", default-features = false, optional = true }
# Hostname for the local device id (ssh_ca self-grants). Already in the
# workspace lock via transitive deps; tiny (rustix + windows-link).
gethostname = { version = "1", optional = true }
signature = { version = "2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] } # ssh-key 0.6 test helper (PrivateKey::random)
hex = "0.4"
tempfile = "3"
# Tests verify RSA signatures with ssh-key's public-key verification, which
# is the rsa crate's public operation, independent of the ring signer.
ssh-key = { version = "0.6", features = ["ed25519", "rsa"] }

# OS-store unlock backend (Windows DPAPI today; other platforms follow).
# The browser build. Two `getrandom` majors reach this crate — 0.3 directly,
# 0.4 through the RustCrypto stack under `chacha20poly1305` and
# `curve25519-dalek` — and each refuses `wasm32-unknown-unknown` unless told
# to use the JavaScript backend. 0.4 needs only the feature. 0.3 needs the
# feature *and* `--cfg getrandom_backend="wasm_js"` in the wasm target's
# rustflags, which cannot be expressed here; the browser crate's build carries
# it. Declared as target dependencies so no native build pays for them.
#
# 0.3 keeps its ordinary name: Cargo merges a target table's features into the
# same-named entry under `[dependencies]`, and refuses the same package twice
# under two names. 0.4 is a different package version, so it must be renamed —
# that is the one case the rename is for.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_0_4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# `uuid` refuses the target too unless told where randomness comes from; `js`
# is its route for `wasm32-unknown-unknown`. Same merge, same name.
uuid = { version = "1", features = ["js"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }
# `os-presence`: UserConsentVerifier, and its window-parented interop.
# Already in the workspace lock through djinn.
windows = { version = "0.62", optional = true, features = [
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_System_WinRT",
] }
