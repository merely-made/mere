[package]
name = "insigne"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "An insigne is a graded, presentable proof of identity in the Mere platform's dramatis tier: made to be shown and surviving showing, from a bare key (continuity) through signed cross-attestations to delegation certificates. Your insigne is what someone else's gaz keeps. Built today: the typed public key, the bare-key grade, as plain data. Not the secrets (that is chatelaine) and not the keeper (that is castellan)."
readme = "README.md"
keywords = ["identity", "attestation", "proof", "persona", "petname"]
categories = ["authentication", "cryptography"]

[features]
# Certificate ids and attenuation, which hash with BLAKE3.
digest = ["dep:blake3"]
# Signature checks on ed25519-dalek, the version personae signs with.
verify = ["digest", "dep:ed25519-dalek"]

[dependencies]
blake3 = { version = "1.5", optional = true }
ed25519-dalek = { version = "3", optional = true }
serde.workspace = true

[dev-dependencies]
ed25519-dalek = "3"
# The checks under test sit behind `verify`; this turns it on for every test
# target, so `cargo test -p insigne` cannot silently skip them.
insigne = { path = ".", features = ["verify"] }
# The binary codec muniment stores with, so the binary serde path is tested
# against the format a gaz persists in.
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"
