# The shipped document-core guest (transplanted from the P0/P1 probe). Standalone
# with its own `[workspace]` and Rust 1.98.1 pin. Built to wasm32-wasip2;
# the host test loads the
# resulting component.
[workspace]

[package]
rust-version = "1.97.1"
name = "document-core-guest"
version = "0.0.1"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# std build: on wasip2 this also imports the WASI world, so the host grants the
# WASI floor. A no_std minimal-cap guest is a later tightening (plan §10.4).
wit-bindgen = "0.58"

[profile.release]
opt-level = "s"
strip = true

[workspace.package]
rust-version = "1.97.1"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
