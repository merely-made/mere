# The app-core test guest: a component that emits app actions through the
# envelope. Standalone workspace with its own toolchain pin, built to
# wasm32-wasip2 by the host's build.rs; the host tests load the artifact.
[workspace]

[package]
rust-version = "1.97.1"
name = "app-core-guest"
version = "0.0.1"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"

[profile.release]
opt-level = "s"
strip = true

[workspace.package]
rust-version = "1.97.1"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
