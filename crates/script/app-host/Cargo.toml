# The app-core component host: the native side of the `app-core` WIT world —
# the ENVELOPE lane (ruled 2026-07-23). A component emits app actions through
# one stable `{name, payload}` record; this crate instantiates the world, backs
# the `emit` import with a host-supplied [`ActionSink`], and drives the
# lifecycle. It knows nothing about any particular app's action vocabulary:
# decoding an envelope and deciding whether it may lower is the sink's job
# (turnstone's ring gate), so the host stays app-agnostic.
#
# A sibling of document-host over the same `mere:script` contract (one WIT package, in the Graphshell
# repository, materialised at `crates/script/wit` by build.rs): two worlds, two hosts.
[package]
name = "app-host"
version = "0.0.1"
edition = "2021"

rust-version = "1.97.1"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The WIT world lives in this package; its build script publishes the directory to
# this crate's build script as DEP_GRAPHSHELL_ENDPOINT_WIT (Cargo passes `links`
# metadata from normal dependencies only). The crate itself is not used.
graphshell-endpoint = { workspace = true }
# wasmtime 45, matching document-host (one engine version across the two hosts).
wasmtime = "45"
wasmtime-wasi = "45"
# Drives the async exports from sync callers; the lib stays executor-neutral.
pollster = "0.4"
# Settings for app-settings participants (capability door K1, D22).
settings-wit = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
# The projection session served to a component guest (capability door D18).
graphshell-endpoint = { workspace = true, features = ["wit-testkit"] }
# The settings fixture owner, gate and call script (capability door K1, D22).
settings-wit = { workspace = true, features = ["testkit"] }
script-wire.workspace = true
workbench = { workspace = true }

[lints]
workspace = true
