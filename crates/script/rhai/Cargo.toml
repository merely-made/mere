[package]
rust-version = "1.97.1"
name = "script-rhai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Rhai backend for the knot block-evaluator lane: an inker BlockEvaluator over the Rhai scripting engine (pure Rust, sandboxed, native operation budget)."

[lib]
path = "src/lib.rs"

[dependencies]
# The thin knot-eval contract (BlockEvaluator + EvalOutput). This backend
# satisfies that slice, *not* genet's full DOM-shaped ScriptEngine seam —
# Rhai is a logic/mod language with no DOM, async, or GC.
inker = { workspace = true }
# Rhai: pure Rust, embeddable, sandboxed by default (no file/network), with a
# built-in operation budget (`set_max_operations`) so `eval_block`'s runaway
# cap is first-class rather than hand-rolled.
# `sync` makes Engine Send + Sync (Rc becomes Arc, RefCell becomes RwLock
# throughout rhai). Required because a KnotEndpoint holds its evaluators and a
# resident host schedules endpoints across threads. We register no host
# bindings and no custom types, so the feature costs us nothing at the API
# boundary; it costs atomic refcounting inside script evaluation, which is an
# on-demand fence with an operation budget rather than a hot path.
rhai = { version = "1", features = ["sync"] }
# The value-level script contract (Scenograph editor plan, SE39): rhai implements
# `ValueEngine` beside the inker `BlockEvaluator`.
script-engine-api = { workspace = true }
# Host maths for rules (SE40, SE94); rhai's own float-maths package is not loaded.
libm = { workspace = true }

[dev-dependencies]
# The rule runner tests resolve a real rule set (SE92); the library itself links
# neither scenograph nor its types.
scenograph = { workspace = true }

[features]
# Builds the wasm32 determinism example (tests/wasm_maths_bits.mjs); off by default
# so a plain `cargo test` does not build a cdylib.
wasm-check = []

[[example]]
name = "maths_bits"
crate-type = ["cdylib"]
required-features = ["wasm-check"]

# wasm32 only (SE97): the example, and getrandom 0.3 (rhai -> ahash) needs its
# browser backend, selected by `--cfg getrandom_backend="wasm_js"` in the runner.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.129"
getrandom = { version = "0.3", features = ["wasm_js"] }
