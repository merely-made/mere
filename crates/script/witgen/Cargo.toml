[package]
rust-version = "1.97.1"
name = "script-witgen"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generates native Rust bindings for a WIT interface over script-wire. A build-dependency only."

[dependencies]
anyhow = "1"
heck = "0.5"
wit-parser.workspace = true

[dev-dependencies]
arbitrary = "1"
wit-parser = { workspace = true, features = ["decoding"] }
wit-smith = "=0.263.0"

[lints]
workspace = true
