[package]
rust-version = "1.97.1"
name = "incipit"
version = "0.2.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace identity vocabulary for Mere: the stable ids of a graph and a session, and view-local curation (subgraph specifications and folds), and, behind the `arrangement` feature, forme: the workbench arrangement authority. No dependency on the graph itself."
documentation = "https://docs.rs/incipit"
keywords = ["identity", "graph", "session", "mere"]
categories = ["data-structures"]

[lib]
path = "src/lib.rs"

[features]
default = []
# `incipit::forme`, the workbench arrangement authority (the former
# `mere-forme` crate, merged 2026-11-08 under engine split D28). The default
# stays ids and curation on serde and uuid alone.
arrangement = ["dep:serde_json", "dep:taffy", "dep:petgraph"]
# Native on-disk persistence of `FormeDocument`s (`incipit::forme::store`).
# Off so wasm consumers stay `std::fs`-free; the native host enables it.
arrangement-store = ["arrangement"]
# `incipit::view`: a pane's durable view state (`ViewIntent`) and its sidecar,
# moved from pandect (engine split D44, D78). It names Graphshell's contract
# root (sceno's link keys, hest's command choices); the sidecar writes through
# muniment's atomic file.
view = ["dep:serde_json", "dep:sceno", "dep:hest", "dep:muniment"]
# `incipit::{navigation, trail, roster}`: read-side vocabularies over the
# kernel graph (moved from the mere facade, engine split D58). Brings the
# kernel and forme; the default stays ids and curation.
graph = ["arrangement", "dep:kernel"]

[dependencies]
# The graph and session ids live in catchment and are re-exported here
# (engine split P4, D60).
catchment.workspace = true
serde.workspace = true
uuid.workspace = true
serde_json = { version = "1.0", optional = true }
kernel = { workspace = true, optional = true }
sceno = { workspace = true, optional = true }
hest = { workspace = true, optional = true }
muniment = { workspace = true, optional = true }
# Forme's persisted arrangement vocabulary still uses the stable-0.11
# `Dimension` API. This is independent of Livery/Buckram's current Taffy slot;
# migrate it only with a serialization review.
taffy = { version = "=0.11.0-experimental-cache-fix.3", optional = true }
# `forme::derive_topology` walks a petgraph graph. Every arrangement consumer
# already builds petgraph 0.8 through the kernel, so it is not gated further.
petgraph = { version = "0.8", features = ["serde-1"], optional = true }

[dev-dependencies]
# The view sidecar's relation-tag test pins the kernel's tag ordinals.
kernel = { workspace = true, features = ["fixtures"] }
serde_json = "1"
proptest = "1.11"

[lints]
workspace = true
