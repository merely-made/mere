[package]
rust-version = "1.97.1"
name = "knot-editor-host"
version = "0.1.1"
edition.workspace = true
authors = ["Mark AB (markik)"]
# Not workspace: this crate is ours, not Servo-derived, so it keeps the founding
# license and its own repository rather than inheriting genet's MPL-2.0 and the
# workspace repository that still points at upstream servo. Matches illume, the
# portable half of the same pair.
license = "MPL-2.0"
repository = "https://github.com/merely-made/mere"
description = "The knot editor retained buffer and readout, retiring: the editor moves to Knot knot-document and the reuse-lexers now live in illume (feature markdown), re-exported here."
readme = "README.md"
documentation = "https://docs.rs/knot-editor-host"
keywords = ["djot", "editor", "syntax-highlighting", "injection"]
categories = ["text-processing"]
publish = true

[lib]
path = "src/lib.rs"

[features]
default = ["preview"]
preview = ["dep:inker", "dep:nematic"]

[dependencies]
# Landed in mere 2026-09-03: the former relative path into genet's components
# is now the workspace git pin.
cambium = { workspace = true }
illume = { workspace = true, features = ["markdown"] }
# A parser the workspace already ships (nematic uses it for CommonMark knots).
# Its offset-iter event stream maps to highlight spans the same way jotdown
# does.
# The editor model ties source text to the rendered preview through the same
# engine path the rest of the family uses: inker's EngineDocument + nematic's
# DjotKnotEngine.
inker = { workspace = true, optional = true }
nematic = { workspace = true, optional = true }

[lints]
workspace = true
