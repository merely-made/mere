# The native side every C0 binding shares: the payload codec (D6, D13), the
# test provider, and the call script whose transcript the bindings compare.
[package]
name = "c0-contract"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
chirograph = { path = "../../../chirograph" }
sceno = { path = "../../../cambium/scenes/sceno" }
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
