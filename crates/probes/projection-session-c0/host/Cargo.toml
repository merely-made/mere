# The component side of C0: a Wasmtime 45 host serving the projection
# session to the test guest from the shared test provider.
[package]
name = "c0-host"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
c0-contract = { path = "../contract" }
# wasmtime 45, matching app-host and document-host.
wasmtime = "45"
wasmtime-wasi = "45"
