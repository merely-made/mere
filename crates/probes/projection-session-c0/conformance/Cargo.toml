# Measuring our generator (D17) against wRPC, random input and real WIT.
[package]
name = "c0-conformance"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
c0-route-a = { path = "../route-a" }
c0-witgen = { path = "../witgen" }
wit-bindgen-wrpc = "=0.12.0"
anyhow = "1"
wit-parser = { version = "=0.263.0", features = ["decoding"] }
wit-smith = "=0.263.0"
arbitrary = "1"

[dev-dependencies]
proptest = "1"

[build-dependencies]
c0-witgen = { path = "../witgen" }
wit-bindgen-wrpc-rust = "=0.12.0"
wit-bindgen-core = "0.59"
