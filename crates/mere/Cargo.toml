[package]
name = "mere"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
rust-version = "1.92.0"
description = "The composed graph library behind Turnstone and other graph-shaped applications."

[features]
default = ["graph", "linked-data", "canvas", "workbench"]
# The portable Mere graph/domain surface. This is deliberately smaller than
# the composed desktop facade so browser hosts can take graph truth without
# presentation or host-workbench dependencies.
graph = [
    "dep:forme",
    "dep:kernel",
    "dep:serde",
    "dep:serde_json",
    "dep:uuid",
]
# Semantic import/export remains independent of the graph canvas.
linked-data = ["graph", "dep:linked-data"]
# Mere's graph-aware visual surface. `gloss` is canvas-backed, so it belongs in
# this capability rather than the graph-only cone.
canvas = [
    "graph",
    "dep:accesskit",
    "dep:canvas",
    "dep:inker",
    "dep:netrender",
    "dep:registry",
    "dep:tracing",
    "dep:uxtree",
]
# App-host composition and routing. Native hosts use this today; portable
# graph consumers do not need to pay for it.
workbench = [
    "graph",
    "dep:apparatus",
    "dep:inker",
    "dep:platen",
    "dep:workbench",
]
# The app-facing semantic query surface stays opt-in because it carries the
# SPARQL evaluator. Consumers that only need graph construction do not pull it.
query = ["linked-data", "linked-data/query"]
# Test-only fixture escape hatch. This mirrors kernel's gate without exposing
# the fixture API to ordinary library consumers.
fixtures = ["graph", "kernel/fixtures"]

[dependencies]
accesskit = { workspace = true, optional = true }
netrender = { workspace = true, optional = true }
registry = { workspace = true, features = ["theme"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
uxtree = { workspace = true, optional = true }
apparatus = { workspace = true, optional = true }
forme = { workspace = true, optional = true }
# The engine-management layer (genet component since 2026-07-10): the facade
# composes mere's routing vocabulary over inker's host-neutral policy.
inker = { workspace = true, optional = true }
kernel = { workspace = true, optional = true }
linked-data = { workspace = true, optional = true }
canvas = { workspace = true, optional = true }
platen = { workspace = true, optional = true }
workbench = { workspace = true, optional = true }

[dev-dependencies]
euclid = "0.22"
kernel = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
