[package]
rust-version = "1.97.1"
name = "mere-alembic"
version = "0.0.1"
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
description = "Alembic is the recall and workshop component of Distillery, the Mere platform's works: the memory surfaces (short-term, long-term, codicils, search) behind a `recall` feature, and the granted-agent and automation workshop over them — create, grant, run, observe, interrupt, and dissolve a bounded actor. Athanor (mere-athanor), the distillation furnace, is its authority half and the first such actor. Inside Distillery since 2026-09-02: Distillery runs models, its Alembic component runs work over them."
readme = "README.md"
keywords = ["memory", "agents", "recall", "automation", "local-first"]
categories = ["development-tools"]

[lib]
name = "alembic"
path = "src/lib.rs"

[features]
workshop = ["dep:serde"]
workshop-surface = ["workshop", "dep:cambium"]
workshop-native = ["workshop-surface", "dep:cambium-desktop"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
cambium = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cambium-desktop = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
taproot.workspace = true

[lints]
workspace = true
