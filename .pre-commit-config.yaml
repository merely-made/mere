# mere/design_docs/mere_docs/implementation_strategy/2026-10-30_house_style_plan.md
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: line-ceiling
        name: line ceiling
        entry: line-ceiling
        language: rust
        types: [text]
        always_run: true
        additional_dependencies: ["cli:https://github.com/merely-made/eidetic:line-ceiling-v0.0.2:line-ceiling"]
      - id: responsa-check
        name: responsa check
        entry: responsa check
        language: rust
        pass_filenames: false
        always_run: true
        additional_dependencies: ["cli:https://github.com/merely-made/eidetic:responsa-v0.0.3:responsa"]
      - id: clippy
        name: clippy
        entry: cargo clippy --locked --all-targets
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$'
        pass_filenames: false
      # The query feature is off in the workspace build, so the hook above never
      # compiles spareval or the indexed dataset; a lock that broke it went unseen
      # on 2026-11-10.
      - id: clippy-query
        name: clippy (query feature)
        entry: cargo clippy --locked --all-targets -p mere-rdf -p mere-view --features mere-rdf/query,mere-view/query
        language: system
        files: '(^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$'
        pass_filenames: false
      - id: dependency-bans
        name: dependency bans
        entry: cargo deny --locked check bans
        language: system
        pass_filenames: false
        always_run: true
