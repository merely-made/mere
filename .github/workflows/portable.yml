name: Portable dependency graph
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  viewer-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install viewer toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown,wasm32-wasip2
      - name: Install matching Wasm packager
        run: cargo +1.98.1 install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Exercise budget acceptance and refusal
        run: python3 ports/graphshell/web/scripts/test_viewer_budget.py
      - name: Build viewer and enforce interaction caps
        run: python3 ports/graphshell/web/scripts/build-viewer.py --out-dir viewer-delivery/pkg
      - name: Retain viewer delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphshell-viewer-delivery
          path: viewer-delivery/pkg
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # License header gate (stack seams plan S80), first so no later failure skips it.
      - name: Prove the license header gate can fail
        run: python scripts/relicense_headers.py --self-test
      - name: Check owned sources carry the MPL-2.0 header
        run: python scripts/relicense_headers.py --check
      - name: Install integration toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-wasip2,wasm32-unknown-unknown
      - name: Exercise local lock isolation
        run: python scripts/test_cargo_mode.py
      - name: Check portable workspace and lock provenance
        run: python scripts/cargo_mode.py verify +1.98.1
      - name: Check embedded guests explicitly
        shell: pwsh
        run: |
          foreach ($guest in @('crates/script/app-host/guest', 'crates/script/document-host/guest', 'crates/script/document-host/guest-bomb')) {
            python scripts/cargo_mode.py verify +1.98.1 --manifest-path "$guest/Cargo.toml" --metadata-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo +1.98.1 build --locked --manifest-path "$guest/Cargo.toml" --target wasm32-wasip2 --release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
