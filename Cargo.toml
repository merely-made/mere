[workspace]
resolver = "2"
members = [
    "crates/mere",
    "crates/canvas/cartography",
    "crates/canvas/pictograph",
    "crates/graph/graph-kernel",
    "crates/graph/linked-data",
    "crates/incipit",
    "crates/system/catchment",
    "crates/system/pandect",
    "crates/system/fetch",
    "crates/system/registry",
    "crates/system/tabard",
    "crates/forme/uxtree",
    "crates/domain/personal-facts",
    "crates/platen/platen",
    # personae, insigne, gaz, chatelaine, notochord and the dramatis facade
    # left for their own repository on 2026-10-09 (dramatis repo plan, DR-D);
    # the shared persona picker is a module of cambium (engine split D10).
    # mere-edit went to Eidetic (engine split D40); ux-events, document-host,
    # graphshell-client-tests, tabard-workshop and pelt-desktop to Graphshell's
    # host/ workspace (P3 slice 1, D36, D37); the pelt and tabard-desktop binaries to
    # Turnstone (D36); gazette-ledger retired (D39).
    "crates/script/app-host",
    "crates/script/block-host",
    "crates/script/authority-host",
    # Native WIT bindings (capability door D17-D19): the runtime and its generator.
    # ─── Absorbed 2026-07-23 (design_docs/.../2026-07-23_repo_consolidation_plan.md) ───
    # Cambium remains a platform component. The 2026-10-19 foundation
    # promotion moved Eidetic, Armillary, ESP and Gemot to independent suppliers;
    # their crate identities and public APIs are unchanged. The spatial runtime
    # (numen, seiche, seiche-model, nisus, modulus, conatus, tenant) left for
    # merely-made/seiche on 2026-11-07 (engine split plan, P2).
    # The scene family sits under the Cambium umbrella (platform boundary plan
    # §1, P2): one family per crates/<family>/ directory, with the widget lane
    # and the scene lane sharing a home and keeping their state models apart.
    # The generic `scenograph` facade crate is gone; its solver registry moved
    # into `scenomise`. The published name now belongs to the host-neutral
    # projection authoring model, not a runtime facade.
    "crates/cambium/scenes/scenomise",
    "crates/cambium/scenes/scenograph",
    "crates/graphshell/graphshell-door",
    "crates/graphshell/graphshell-host",
    "crates/graphshell/graphshell-mcp",
    "ports/graphshell",
    "ports/graphshell/mere",
    "ports/graphshell/dramatis-pane",
    "ports/graphshell/blocks",
    "ports/mere-resident",
    "ports/moot",
    "ports/distillery/athanor",
    # ─── Landed 2026-09-03 from genet (design_docs/mere_docs/implementation_
    # strategy/2026-09-02_platform_boundary_and_repository_topology_plan.md,
    # the consumers-first half of P3) ───
    # Pelt's retained-session controller stays while the Graphshell port names it.
    "ports/pelt/core",
    # ─── Landed 2026-09-03 from genet (the same plan, P2) ───
    # The Cambium family: the retained widget lane. It keeps its own crate
    # names and versions; only its repository home moved. The scene lane lives
    # beside it under `crates/cambium/scenes/` (listed above with the other
    # absorbed families, because it has been mere's since 2026-07-23).
    "crates/cambium/cambium",
    "crates/cambium/cambium-rootstock",
    "crates/cambium/cambium-winit",
    "crates/cambium/cambium-winit-a11y",
    "crates/cambium/cambium-genet-winit-host",
    "crates/cambium/cambium-genet-web-host",
    "crates/cambium/backstep",
    "crates/cambium/meristem",
    "crates/cambium/sprigging",
    # The scenario lane over a Cambium document host. Landed 2026-09-14 from
    # Isometry, where it was `wing-scenario`; the products switch to it next.
    "crates/cambium/mandrake",
    # Retained application chrome over Cambium, so it sits under the umbrella.
    "crates/cambium/workbench",
    # The mere view every application embeds (reservoir plan V2b).
    "crates/cambium/mere-view",
    # A mere route read remotely, filling the mere view (stack lift plan L14, R7).
    "crates/cambium/mere-overmap",
    # The application host contract genet's P1 split out of genet-host-api. A
    # host contract rather than a widget, so it lands beside `fetch`.
    "crates/system/surface-api",
    # The settings contract over mere:script's WIT (capability door K1, D22).
    "crates/system/settings-wit",
    # The djinn test harness (djinn test harness plan, ruling 5): unpublished,
    # a path dev-dependency for djinn, castellan, personae and their siblings.
    "crates/system/djinn-testkit",
    # The engine-management layer (inker, document-canvas, the three engine
    # adapters), the smolweb lane (nematic, illume), knot-editor-host, the
    # document lanes, page-load, fleece and script-rhai left for
    # merely-made/inker on 2026-11-07 (engine split plan, P1).
    # Errand now owns the continuing Smolweb family in merely-made/errand.
    # Fetch consumes its independently versioned integration crate.
]
exclude = [
    "support/patches/light-file-dialog",
    "crates/probes",
    # The unpublished browser host carries Git-only Genet presentation deps.
    # Keep it outside release resolution. NOTE: the entry below sits inside a
    # directory that is itself an explicit member (`ports/graphshell`), so
    # cargo never applies the exclusion and the line is documentation, not
    # mechanism. What actually keeps it out is the empty `[workspace]` table in
    # its own manifest, which is also what makes it buildable by
    # `--manifest-path`; and standing alone, it has to restate every `[patch]`
    # entry below that its graph needs.
    "ports/graphshell/web",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/mere"
# The scene crates inherit this; it matches what their own workspace
# declared before the 2026-07-23 absorption.
authors = ["Mark AB (markik)"]

# Centralized load-bearing pins. Every crate that uses one of these declares
# it directly with `<dep>.workspace = true` rather than via transitive
# resolution through another crate's re-export. Per
# `~/.claude/.../memory/feedback_workspace_pins_drive_probes.md`: workspace
# pins canonically, probes adapt; pick once with the user, don't churn.
[workspace.dependencies]
murm-sync = { version = "0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main" }
# The application door's contract: wire, frames, routes, declarations and the
# client (Armillary's djinn-slimming S2).
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main", default-features = false }
# Independent application door and resident lifetime supplier.
djinn = { version = "0.0.3", git = "https://github.com/merely-made/armillary.git", branch = "main", default-features = false }
# OS peer facts shared with Djinn's door (capability door plan D7).
peer-facts = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }

cue-netrender = { git = "https://github.com/merely-made/wgpu-cue.git", branch = "main" }
webcue = { git = "https://github.com/merely-made/wgpu-cue.git", branch = "main" }
wgpu-cue = { git = "https://github.com/merely-made/wgpu-cue.git", branch = "main" }
# ─── Workspace-internal path deps ────────────────────────────────────────────
# Every workspace member listed here; consumers do `dep.workspace = true`
# so only the root Cargo.toml knows where each crate lives. Package names
# below are the *current* names — rename passes (drop mere-* prefix etc.)
# update both this list and consumer references in one shot.
# Seiche and numen come from merely-made/seiche (engine split plan, P2). The
# default field evaluation path stays portable; optional Burn/Rhai/Resident
# carriage is selected at the owning crate.
seiche = { version = "0.0.6", git = "https://github.com/merely-made/seiche.git", branch = "main", default-features = false }
cartography = { package = "mere-cartography", version = "0.0.2", path = "crates/canvas/cartography" }
linked-data = { package = "mere-rdf", version = "0.0.1", path = "crates/graph/linked-data" }
kernel = { package = "mere-kernel", version = "0.0.3", path = "crates/graph/graph-kernel" }
# The graph-canvas content-root (was `orrery`; that name retired to the Merely
# product tier ladder, 2026-07-09 — see the boundary pass plan amendments).
pictograph = { version = "0.2.0", path = "crates/canvas/pictograph", default-features = false }
# The IconVG implementation pictograph encodes faces with (repos/emblem).
emblem = "0.2.0"
# Graph digest projections (djot outline, metrics) — `glossary` (was `mere-orrery`).

# The actor-kernel runtime (host-neutral): the !Send host-kernel boundary + the
# Send actor harness the constellation is built on. Promoted to its standalone
# repo (code-identical cutover 2026-07-09, boundary pass slice A); git sibling
# consumed one-way, local checkout via the gitignored `.cargo/config.toml` patch.
armillary = { version = "0.1.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }
# The scenograph projection-engine family's core contract (scene snapshots,
# footprints, spaces, measurements) — git sibling consumed one-way, local
# checkout via the gitignored `.cargo/config.toml` patch. cartography emits
# sceno scenes (the P2 consumption slice; projection_proofs_plan).
sceno = { version = "0.0.7", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
sceno-backdrops = { version = "0.0.1", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenomise = { version = "0.0.7", path = "crates/cambium/scenes/scenomise" }
scenotime = { version = "0.0.5", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenograph = { version = "0.0.6", path = "crates/cambium/scenes/scenograph" }
# The remaining families absorbed 2026-07-23. Consumers keep using
# `<dep>.workspace = true`, so only this block knows where each one lives.
# The identity tier lives in merely-made/dramatis since DR-D (dramatis repo
# plan). Every entry names the SAME revision: two revisions are two sources,
# and two personae in one graph split its types. A sibling that embeds in
# this graph (Knot, through djinn) must pin the same revision too. Until
# dramatis is pushed, the gitignored `.cargo/config.toml` patches these to a
# local checkout.
personae = { version = "0.3.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
chartulary = { version = "0.3.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# The legend/memorial view over journals and codicils; reservation only.
hagiograph = { version = "0.0.1", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
numen = { version = "0.2.1", git = "https://github.com/merely-made/seiche.git", branch = "main" }
esp = { version = "0.1.0", git = "https://github.com/merely-made/distillery.git", branch = "main" }
# Fixture data is a dev-only supplier package; keep the runtime cohort unchanged.
esp-testkit = { version = "0.1.0", git = "https://github.com/merely-made/distillery.git", branch = "main" }
# The projection contract, executed in duplicate (was graphshell-protocol;
# renamed 2026-08-14 because the contract is the family's, not the portal's).
chirograph = { version = "0.0.4", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# The card vocabulary chirograph re-exports and castellan wants without the wire.
graphshell-client = { version = "0.0.2", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
graphshell-endpoint = { version = "0.0.3", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
graphshell-door = { version = "0.0.1", path = "crates/graphshell/graphshell-door" }
# The serving half: admission, the session loop, the catalog and the projection
# host (Graphshell stack lift plan, L2, ruling R4). Default features off here;
# each consumer names the half it serves.
graphshell-host = { version = "0.0.2", path = "crates/graphshell/graphshell-host", default-features = false }
# The credential-keeper port (dramatis plan D4). No longer a reservation:
# C1/C2 landed the OTP core, sealed OTP items, the release gate, and the
# `keeper` identity surface graphshell re-exports.
castellan = { version = "0.0.4", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
sporran = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
custody-wire = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
djinn-custodian = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# The model-works port; first real consumer of the mesh host supervisor.
distillery = { version = "0.0.1", git = "https://github.com/merely-made/distillery.git", branch = "main" }
# The places port: one port, two surfaces (murmur = conversation, moot =
# community), composing gemot, commons, murm, and stickleback without owning
# their authority. Founding reservation, no implementation. Package is
# `mere-moot` because crates.io `moot` and `murmur` are both held elsewhere.
moot = { package = "mere-moot", version = "0.0.1", path = "ports/moot" }
athanor = { package = "mere-athanor", version = "0.0.1", path = "ports/distillery/athanor" }
# Shared pins the graphshell crates inherit.
base64 = "0.22"
blake3 = "1"
# One upstream ipc-channel across the family (capability door D10); never
# force-inprocess outside an application root.
ipc-channel = "0.23.1"
# Exactly pinned: wit-parser states no API stability and ships a new 0.X
# with every wasm-tools release (capability door D17).
wit-parser = "=0.263.0"
mere = { path = "crates/mere" }

fetch = { package = "mere-fetch", version = "0.0.1", path = "crates/system/fetch" }
page-load = { package = "mere-pageload", version = "0.0.1", git = "https://github.com/merely-made/inker.git", branch = "main" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
incipit = { version = "0.2.3", path = "crates/incipit" }
comms = { package = "mere-comms", version = "0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main" }
# The reservoir service, split from pandect (engine split P4, D3, D9).
catchment = { version = "0.1.0", path = "crates/system/catchment" }
pandect = { version = "0.2.0", path = "crates/system/pandect" }
# Self-update over signed manifests (the cargo-packager-updater fork; ruled
# 2026-07-24: name luggage, home mere). Apps consume it via git dep like the
# rest of the family; mere itself will when its own packaging lands.
#
# `default-features = false` here is the release-identity core only. Cargo
# forbids a member turning a workspace dependency's defaults *off*, so the
# workspace declaration has to be the minimal common denominator and each
# member opts up. A member that wants the update pipeline writes
# `luggage = { workspace = true, features = ["native"] }`; forgetting to is a
# compile error naming the missing item, never a silently crippled updater.
# The crate's own `default = ["native"]` still serves consumers outside this
# workspace, which is who it is for.
luggage = { default-features = false, git = "https://github.com/merely-made/eidetic.git", branch = "main" }
registry = { package = "mere-registry", path = "crates/system/registry", default-features = false }

# The engine-management family moved to genet 2026-07-10, came back on
# 2026-09-03 under the platform boundary plan's P3, and left for
# merely-made/inker on 2026-11-07 (engine split plan, P1), with the smolweb
# lane, knot-editor-host, the document lanes, page-load, fleece and script-rhai.
inker = { version = "0.1.1", git = "https://github.com/merely-made/inker.git", branch = "main" }
document-canvas = { version = "0.1.0", git = "https://github.com/merely-made/inker.git", branch = "main" }
# `default-features = false` belongs on this declaration: the external
# knot-editor opts back into `html-fragment` explicitly.
nematic = { version = "0.1.1", git = "https://github.com/merely-made/inker.git", branch = "main", default-features = false }
fleece-extract = { package = "fleece", version = "0.5.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
fleece = { package = "mere-fleece", version = "0.0.1", git = "https://github.com/merely-made/inker.git", branch = "main" }
genet-text = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
illume = { version = "0.0.3", git = "https://github.com/merely-made/inker.git", branch = "main" }
# ─── Landed from genet 2026-09-03 (platform boundary plan, P2) ──────────────
# Workspace members, so path deps. None of the eleven may appear in
# .cargo/config.toml's genet patch table: patching a git source at a path that
# is also a workspace member is a hard lockfile collision.
cambium = { version = "0.6.1", path = "crates/cambium/cambium" }
cambium-rootstock = { version = "0.1.0", path = "crates/cambium/cambium-rootstock", default-features = false }
mandrake = { version = "0.1.0", path = "crates/cambium/mandrake" }
cambium-winit = { version = "0.3.0", path = "crates/cambium/cambium-winit" }
cambium-a11y = { version = "0.3.0", path = "crates/cambium/cambium-winit-a11y" }
cambium-web = { version = "0.1.0", path = "crates/cambium/cambium-genet-web-host" }
hest = { version = "0.2.1", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
backstep = { version = "0.2.0", path = "crates/cambium/backstep" }
meristem = { version = "0.2.0", path = "crates/cambium/meristem" }
sprigging = { version = "0.3.0", path = "crates/cambium/sprigging" }
# The three engine adapters, unpublished, from merely-made/inker.
scrying-engine = { version = "0.2.0", git = "https://github.com/merely-made/inker.git", branch = "main" }
graft-engine = { version = "0.2.0", git = "https://github.com/merely-made/inker.git", branch = "main" }
weld-engine = { version = "0.2.0", git = "https://github.com/merely-made/inker.git", branch = "main" }

# Centralized 2026-08-26. These were previously restated in each member with a
# full git spec, so a genet bump meant editing fifteen files and a missed one
# silently forked the lineage. Stated once here; members inherit with
# `foo.workspace = true` and add only their own features/optional flags.
genet-scripted-dom = { version = "0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
# Unpublished (0.0.0): native event dispatch plan, Phase 2 (cambium click, key and focus listeners).
genet-events = { version = "0.0.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
layout-dom-api = { version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
layout_dom_api = { package = "layout-dom-api", version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-livery = { version = "0.0.4", git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
# Named genet-probe until genet 7baa554c (2026-09-14); same crate, new name.
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false, features = ["accesskit"] }
genet-static-dom = { version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
# The application half of the former `genet-host-api` — the settings
# projection and the surface admission vocabulary. Genet's P1 split it out as
# `mere-surface-api` (genet 57bcc38fdae, platform boundary plan §9.3), leaving
# `genet-host-api` at 0.2.0 as the raw engine half, which mere does not
# consume. The plan moved it here on 2026-09-03; it is a workspace member now.
mere-surface-api = { version = "0.1.1", path = "crates/system/surface-api" }
workbench = { version = "=0.1.1", path = "crates/cambium/workbench" }
mere-view = { version = "0.1.0", path = "crates/cambium/mere-view" }
mere-overmap = { version = "0.1.0", path = "crates/cambium/mere-overmap", default-features = false }
errand = { version = "0.4.0", git = "https://github.com/merely-made/errand.git", branch = "main" }
# Errand's wire layer: one spec-faithful crate per protocol, published under
# names that belong to the protocols' communities rather than to the engine
# that speaks them (the 2026-07-23 repo consolidation and the 2026-08-03
# smolweb home decision). They were genet's `[workspace.dependencies]` while
# errand lived there; they arrive here with it. `finger-protocol` carries
# WebFinger too, which errand deliberately does not enable, since WebFinger is
# HTTP and errand does not speak HTTP.
nex-protocol = { version = "0.1.1" }
spartan-protocol = { version = "0.1.1" }
guppy-protocol = { version = "0.1.1" }
gopher-protocol = { version = "0.2.0" }
gemini-protocol = { version = "0.1.7" }
scroll-protocol = { version = "0.1.0" }
finger-protocol = { version = "0.1.1", default-features = false, features = [
    "client",
] }
netfetcher = { version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
# ─── Landed from genet 2026-09-03 (platform boundary plan, P3) ───────────────
# Workspace members, so path deps. None of these may appear in
# .cargo/config.toml's genet patch table.
pelt-core = { path = "ports/pelt/core" }
tabard = { version = "0.0.2", path = "crates/system/tabard" }
mere-lanes = { version = "0.1.0", git = "https://github.com/merely-made/inker.git", branch = "main" }

# Genet crates the landed ports reach. In genet these were relative paths into
# `components/`; here they are git pins at the same single revision as every
# other genet.git line in this file — the source-identity invariant (plan §8.7,
# §9.4). Package names that differ from the key are spelled out.
genet-host-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-documents = { git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
genet-document-resources = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-render = { git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false, features = ["livery", "accesskit"] }
# The present core (wgpu boot, surface format, Scene rasterization) every host
# stands on. Named here because the landed Cambium hosts reached it by relative
# path inside genet and now reach genet.git like the rest of the family.
genet-presenter = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-winit = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted = { git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
cambium-desktop = { version = "0.1.0", path = "crates/cambium/cambium-genet-winit-host" }
genet-runtime = { git = "https://github.com/merely-made/genet.git", branch = "main" }
script-engine-api = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
# Deterministic maths for scripted rules (Scenograph editor plan, SE40, SE93). No
# default features: the host functions must give the same bits on every target.
libm = { version = "0.2", default-features = false }
genet-bole = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-vano = { git = "https://github.com/merely-made/genet.git", branch = "main" }
