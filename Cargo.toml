
[workspace]
resolver = "2"
# The engine (engine split D59, P3 slice 4): the toolkit went to Graphshell's host/,
# the reference app to Turnstone, pictograph to emblem (D102 to D104).
members = [
    "crates/graph/graph-kernel",
    "crates/graph/engine",
    "crates/graph/rdfc",
    "crates/system/catchment",
    "crates/system/pandect",
    "crates/domain/personal-facts",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/mere"
# The scene crates inherit this; it matches what their own workspace
# declared before the 2026-07-23 absorption.
authors = ["Mark AB (markik)"]

# Centralized load-bearing pins. Every crate that uses one of these declares
# it directly with `<dep>.workspace = true` rather than via transitive
# resolution through another crate's re-export. Per
# `~/.claude/.../memory/feedback_workspace_pins_drive_probes.md`: workspace
# pins canonically, probes adapt; pick once with the user, don't churn.
[workspace.dependencies]
murm-sync = { version = "0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main" }

kernel = { package = "mere-kernel", version = "0.0.3", path = "crates/graph/graph-kernel" }
# Graph digest projections (djot outline, metrics) — `glossary` (was `mere-orrery`).

# The remaining families absorbed 2026-07-23. Consumers keep using
# `<dep>.workspace = true`, so only this block knows where each one lives.
# The identity tier lives in merely-made/dramatis since DR-D (dramatis repo
# plan). Every entry names the SAME revision: two revisions are two sources,
# and two personae in one graph split its types. A sibling that embeds in
# this graph (Knot, through djinn) must pin the same revision too. Until
# dramatis is pushed, the gitignored `.cargo/config.toml` patches these to a
# local checkout.
personae = { version = "0.3.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
fieldbook = { version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
hodograph = { version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
portolan = { version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
quadstore = { version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
sporran = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
blake3 = "1"

# The reservoir service, split from pandect (engine split P4, D3, D9).
catchment = { version = "0.1.0", path = "crates/system/catchment" }

eidetic = { version = "0.0.3", default-features = false, features = ["product"], git = "https://github.com/merely-made/eidetic.git", branch = "main" }

# The shared replicated-space runtime beneath every signed peer domain: joined
# spaces, policy-before-insert processing, operation storage, checkpoints,
# retention mechanics, and native drop carriage. Promoted out of the murm
# supercrate 2026-07-26 (it was `murm-replication`, but Murm, Mesh, Moot, and
# transport all consume it). Domains keep their own operation grammar,
# addressing, authorization, and materialization.
stickleback = { version = "0.3", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Murm at fb6360c12b (main: the merge of 3d9e799f, the browser initiator's
# callback-lifetime fix, and 38e9c9b8, `TransportKind::InProcess`, so Djinn's
# local doors hand admission an `AcceptedSession`; lift plan pass (b)).
# Named through the `www` alias; see the Murm patch table below.
transport = { package = "mere-transport", version = "0.0.2", git = "https://github.com/merely-made/murm.git", branch = "main" }

# The host supervisor above the mesh (host lanes plan, gate H0): owns in-flight
# jobs, their control handles, and the OS-facing condition/clock seams that
# `mere-mesh` deliberately refuses to have.

# The same crate as `personae` above, under mere's historical alias. Both
# entries must carry the SAME version: they resolve to one package, and a
# stale pin here is invisible from the personae line.
identity = { package = "personae", version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# The participant authority gate (participant gate B1/B3): document-host derives
# its import-level Grant from a servitor authority — one grant, two faces.
servitor = { version = "0.0.3", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Path + version: the path is used for local workspace builds, the version lets
# a publishable dependent (stickleback) record the crates.io dependency.
muniment = { version = "0.2.1", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Stored key-rooted contacts (the "them" side personae keeps): petnames, handles,
# per-endpoint trust, kith/kin tiers, recency. Relocated from repos/gaz 2026-08-10.
gaz = { version = "0.0.3", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# The cast-list tier's facade reservation; empty until something imports it.
dramatis = { version = "0.0.5", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# The graded identity proofs and the never-shown secrets; reservations, no code.
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }

# Input + accessibility + window plumbing.
accesskit = "0.25.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

# Station commissioning now lives in Murm; resident NomadNet remains optional.

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# ─── Knot's Mere contracts resolve from this checkout ───────────────────────
# knot-editor pins a released Mere revision so it builds standalone. Embedded
# here it must not bring a second copy of Mere's own crates: two sources for one
# package is a type mismatch, not a resolution failure. Every package knot-editor
# and knot-document name from `mere.git` is redirected to its workspace member,
# so the shared contracts keep one Cargo source identity. Add an entry whenever
# Knot names a new Mere package; a name missing here resolves from git and is a
# duplicate.
#
# insigne, notochord and personae left for merely-made/dramatis (DR-D). A Knot
# revision that still names them through mere.git is redirected to the one
# dramatis revision this workspace pins, not to a path; a Knot revision that
# names them through dramatis.git needs no entry, only the same revision
# (Cargo refuses a patch from dramatis.git to dramatis.git).
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch.crates-io]
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# gaz (dramatis) takes muniment from crates.io so dramatis never pins mere;
# this swaps in mere's own, so the graph holds one muniment and castellan's
# stores and gaz's agree on its types.
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Livery/Buckram select published genet-taffy 0.16 directly. No Git patch is
# needed; the registry source remains independent of the Genet checkout.
# No parley/fontique patch rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a patch row here would match no package and fail resolution.
# genet-livery reaches the fork by path inside the git checkout, and Mere's own
# `parley` workspace dep names the fork by package (see [workspace.dependencies]).

# Genet's optional script-engine-boa owns its exact Boa Git revision directly.
# Registry overrides here would be unused and would not redirect that Git pin.

# Physics in dev builds (physics catalog plan, ruled 2026-10-04, "Opt 3 in dev
# for physics"): one Density start took 146.5 s at the dev profile's
# opt-level 0 and 6.0 s with these six crates at 3, the pictograph suite
# 102.5 s and 12.6 s, with the rebuild after a one-line seiche edit unchanged
# and backtraces keeping file and line. graphshell-web's own manifest names the
# same six.