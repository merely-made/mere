[statements."stack.1"]
title = "Build on the stack we have"
source = "design_docs/doctrine.md"
area = "The stack"
summary = "Build on the stack we have; try use, configure, compose and extend before implementing the gap; dependencies earn their cost, components are modules, and extraction serves planned hosts."
draws_on = ["house-style D1", "house-style D2", "house-style D12", "house-style D14", "isocosm:600", "isocosm:organs.5"]

[statements."stack.2"]
title = "The stack supplies identity and trust"
source = "design_docs/doctrine.md"
area = "The stack"
summary = "Identity and admitted connections come from the stack; a product maps peers to its participants and never manufactures keys or trust roots."
draws_on = ["isocosm:962"]

[statements."stack.3"]
title = "Seams and formats"
source = "design_docs/doctrine.md"
area = "The stack"
summary = "Open contracts separate producers, hosts and runners; open formats first, useful cheap drafts included and labeled by status; capabilities name supplier, grant and lifetime owner; extension follows data (packs hold all recognition as open names over axes the core observes, compiled as enums that carry the rest), scripts, components and native crates by call cost."
draws_on = ["engine-split D1", "house-style D15", "linked-data-platform-lessons D2", "linked-data-platform-lessons D4", "linked-data-platform-lessons D6", "linked-data-platform-lessons D7", "linked-data-platform-lessons D31", "linked-data-platform-lessons D32", "distillery:distillery-extraction D8", "distillery:distillery-extraction D9", "distillery:distillery-extraction D15", "isocosm:27", "isocosm:77", "isocosm:78", "isocosm:1000"]
replaces = ["stack.5"]

[statements."stack.4"]
title = "Platforms and the web"
source = "design_docs/doctrine.md"
area = "The stack"
summary = "Desktop first-class, the web a floored tier; best capabilities where free; gamepads are the stack's; web modules share one helper and pin."
draws_on = ["isocosm:21", "isocosm:29", "isocosm:77", "isocosm:532", "isocosm:536", "isocosm:537", "isocosm:556", "isocosm:567"]

[statements."stack.6"]
title = "Storage follows the death condition"
source = "design_docs/doctrine.md"
area = "The stack"
summary = "Storage follows the death condition; mutable state has one owner, consumers borrow within its lifetime or carry a handle or copy; persist by durable identity."
draws_on = ["house-style D15", "graphshell:node-body-face-model D1"]

[statements."stack.7"]
title = "Source size"
source = "design_docs/doctrine.md"
area = "The stack"
summary = "No source file over 600 lines without a listed reason; splits follow existing responsibilities; one shared check at commit and in each local gate."
draws_on = ["house-style D10", "house-style D11", "house-style D13", "isocosm:592", "isocosm:1160"]

[statements."stack.8"]
title = "Bound work and distinguish its outcomes"
source = "design_docs/doctrine.md"
area = "The stack"
summary = "Background work has an owner, configurable limits, cancellation and joined completion; refusal, failure, cancellation and success remain distinguishable."
draws_on = ["house-style D15", "stack.6"]

[statements."stack.9"]
title = "Two roots, by nature"
source = "design_docs/doctrine.md"
area = "The stack"
summary = "Two roots by nature, data and presentation; a leaf goes to the root of its nature; neither root names anything above it; one trunk is not forced."
draws_on = ["cycle-breaks D9", "engine-split D12", "engine-split D19", "linked-data-platform-lessons D10"]

[statements."surfaces.1"]
title = "A frame hosts one presentation"
source = "design_docs/doctrine.md"
area = "Surfaces"
summary = "A frame hosts one presentation, a reader's document or a surface producer; a tile presents a resource, a pane answers a question; an embedded application is a presentation, not a pane."

[statements."surfaces.2"]
title = "A catalogued surface is an emitting one"
source = "design_docs/doctrine.md"
area = "Surfaces"
summary = "A catalogued surface has an open and dismiss seam; an intended one stays in its record until built; shell state has one owner, and the surface renders it."

[statements."surfaces.3"]
title = "A contribution is one of four kinds"
source = "design_docs/doctrine.md"
area = "Surfaces"
summary = "Four contribution kinds, declared in a typed manifest list and verified at activation; a presentation's declaration is one type the reader layer owns and the manifest carries."
draws_on = ["stack.3"]

[statements."surfaces.4"]
title = "A surface names its five authorities"
