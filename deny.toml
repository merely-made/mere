# cargo-deny configuration for mere.
#
# Today it holds one rule, the custody boundary (dramatis repo plan, rulings
# D4 and D16): castellan keeps every secret at rest and in hand (the vault,
# its storages and unlock ladder, the SSH agent, the wallet's seeds and
# private epochs). Its independently launched custodian links it; apps and
# workers call an authenticated custody route, and Djinn reaches the
# custodian through custody-wire, which links no castellan. Since H2 a
# default Djinn build links none either: only its `in-process-custody`
# feature (test suites and receipt hosts) does, which is why Djinn stays a
# wrapper here, where every feature is on.
#
#   cargo deny check bans
#
# Passes since DR-C: graphshell's keeper adapters moved into djinn (D15) and
# signalman's station grants go through djinn's custody route (D17).

[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
  { crate = "castellan", wrappers = ["djinn", "djinn-custodian"], reason = "castellan is secret custody; only Djinn and its independently launched custodian link it; applications and workers may not" },
]
