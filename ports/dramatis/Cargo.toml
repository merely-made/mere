[package]
rust-version = "1.97.1"
name = "dramatis-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Persona selection, local authentication and quarantine review through the Djinn resident."

[package.metadata.packager]
product-name = "Dramatis"
identifier = "com.merely.dramatis"
publisher = "Merely"
authors = ["Mark Alan Boykin"]
icons = ["icons/merely.png"]
binaries = [{ path = "dramatis-ui", main = true }]
# Run from Mere's root. The driver supplies profile/target paths to this hook.
before-packaging-command = "python ports/dramatis/package.py prepare"

[package.metadata.packager.nsis]
install-mode = "currentUser"
# Vault data belongs to the shared Djinn resident, not this uninstaller.


[[bin]]
name = "dramatis-ui"
path = "src/main.rs"

[dependencies]
cambium.workspace = true
mesquite.workspace = true
taproot.workspace = true
cambium-desktop.workspace = true
persona-picker.workspace = true
# The custody client and quarantine types, without the Graphshell port
# (stack lift plan, L1).
graphshell-endpoint = { workspace = true, features = ["custody-client"] }
dramatis.workspace = true
personae.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "time", "macros"] }

image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
chatelaine.workspace = true
taproot = { workspace = true, features = ["estimated-probe-fixtures"] }
luggage = { workspace = true, features = ["native"] }
tempfile = "3"

[build-dependencies]
sha2.workspace = true
