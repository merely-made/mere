personae.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "time", "macros"] }

image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
chatelaine.workspace = true
taproot.workspace = true
