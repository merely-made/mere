[package]
name = "dramatis-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dramatis-ui"
path = "src/main.rs"

[dependencies]
cambium.workspace = true
cambium-genet-winit-host.workspace = true
persona-picker.workspace = true
graphshell = { path = "../graphshell" }
