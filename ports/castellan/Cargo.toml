[package]
name = "castellan"
version = "0.0.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Castellan is the credential-keeper port of the Mere platform: the officer of the gate who holds your chatelaine (secrets: passwords, 2FA seeds, tokens) and presents your insignia (graded proofs of identity), in trust for your personae. Hosts embed views; only the castellan touches secrets, and every release is a gate petition."
readme = "README.md"
keywords = ["credentials", "identity", "vault", "agent", "persona"]
categories = ["authentication"]

[features]
# Secret custody moved here from personae and pandect in DR-B (dramatis repo
# plan, rulings D3, D8, D9 and D22): the vault, its passphrase and OS-sealed
# storages, the unlock ladder, the SSH agent, and the wallet's seeds and
# private epochs. Only djinn may link this crate (D4, D16: `deny.toml`).
#
# The SSH agent and its CLI (`personae-agent`, `personae-vault`), the
# approval broker, and SSH keys as vault slots. RSA signs through ring; the
# rsa crate only builds the key at load (rulings 52, 59: RUSTSEC-2023-0071
# rules out its signing and decryption). ECDSA through RustCrypto's curves,
# named here rather than left to ssh-agent-lib's feature unification.
agent = [
  "personae/ssh",
  "dep:ring",
  "dep:rsa",
  "dep:rand_core",
  "dep:signature",
  "dep:ssh-agent-lib",
  "dep:ssh-key",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing-subscriber",
  "ssh-key/p256",
  "ssh-key/p384",
  "ssh-key/p521",
]
# Windows Hello as the unlock gate (vault lock rulings 21, 28). Elsewhere
# presence reports unavailable.
os-presence = ["dep:windows"]
# The wallet's secret half, moved from pandect (D8): the identity seed, the
# delegated-device identity, the remote-auth wrapping keys, the private-epoch
# bridge, and the grant flows that sign or wrap with them. pandect keeps the
# public manifests, roster and grant vocabulary.
wallet = ["dep:pandect"]
# The SitedStationGrant adapter issues and checks the signed RemoteAuth
# envelope with the wallet's seed.
station-grants = ["wallet"]
# The keeper surface (founded 2026-08-14): the secret-free read model, the
# card/intent projection, and the resident PersonaeHost authority, moved home
# from graphshell per the port law.
keeper = [
  "agent",
  "wallet",
  "dep:chirograph",
]
# Freedesktop Secret Service 0.2 adapter. The portable sealed collection model
# compiles everywhere; the D-Bus server is Linux-only.
secret-service = ["dep:thiserror", "dep:tokio", "dep:zbus"]

[dependencies]
# The check conclusions and faults, named directly (insigne proofs plan, B).
insigne = { workspace = true, features = ["verify"] }
# HMAC + the three hashes RFC 6238 allows. RustCrypto, and sha2 is already a
# workspace pin, so this adds one lineage rather than three.
base64.workspace = true
# The secret-free item taxonomy; the OTP display enums are defined there.
chatelaine.workspace = true
# The identity surface's plain types (dramatis repo plan, DR-A).
dramatis.workspace = true
hmac = "0.13"
notochord.workspace = true
personae.workspace = true
serde.workspace = true
sha1 = "0.11"
sha2.workspace = true
uuid.workspace = true
pandect = { workspace = true, optional = true }
zeroize = "1"
# ── custody (DR-B) ────────────────────────────────────────────────────────
# Passphrase-encrypted storage and the wrapped vault root. `zeroize` clears
# the working memory we hand it (vault lock ruling 33).
argon2 = { version = "0.5", features = ["zeroize"] }
blake3.workspace = true
# `zeroize` clears the cipher's copy of the key on drop (ruling 37).
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.3"
serde_json.workspace = true
tracing.workspace = true
# ── agent ─────────────────────────────────────────────────────────────────
# SSH key generation inside the authority mints with the OS RNG.
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
# RSA private-key operations, constant-time. Already in the lock (rustls).
ring = { version = "0.17.14", optional = true }
# Builds the full RSA key (CRT values included) from OpenSSH's components and
# exports it as PKCS#8 for ring, once per load (ruling 59).
rsa = { version = "0.9", default-features = false, optional = true }
signature = { version = "2", optional = true }
ssh-agent-lib = { version = "0.6", optional = true }
ssh-key = { version = "0.6", features = ["ed25519", "encryption"], optional = true }
thiserror = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
# ── keeper surface ────────────────────────────────────────────────────────
chirograph = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# DPAPI, the `AutoOs` root's wrap on Windows.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }
# `os-presence`: UserConsentVerifier, and its window-parented interop.
windows = { version = "0.62", optional = true, features = [
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_System_WinRT",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"], optional = true }

[dev-dependencies]
# The wallet sealer's moved tests seal through eidetic's trait (DR-B).
eidetic.workspace = true
# The moved agent and signing tests (DR-B).
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
# Tests verify RSA signatures with ssh-key's public-key verification, which
# is the rsa crate's public operation, independent of the ring signer.
ssh-key = { version = "0.6", features = ["ed25519", "rsa"] }
# The Linux Secret Service receipt reads its lock signal as a stream.
futures-util = "0.3"
gaz = { workspace = true, features = ["muniment"] }
gazette.workspace = true
muniment = { workspace = true, features = ["postcard", "redb"] }
pollster = "0.4"
# The read-model tests serialize chatelaine values to look for secrets.
serde_json.workspace = true
tempfile = "3"
# The moved authority tests exercise the real SSH agent session and, on
# Windows, the named-pipe wire.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "process"] }
# The moved authority tests verify real signatures off the agent wire.
signature = "2"

# Vault lock ruling 6's no-residue instrument over the resident's lock path
# (L2). The residue tracker installs its own global allocator, so this runs
# outside libtest's harness, on one thread.
[[test]]
name = "snapshot_golden"
path = "tests/snapshot_golden.rs"
required-features = ["keeper"]

[[test]]
name = "no_residue"
path = "tests/no_residue.rs"
harness = false
required-features = ["keeper"]

# Vault lock ruling 6's no-residue instrument over the vault and its storages,
# moved from personae with the code it measures (DR-B). It installs its own
# global allocator, so it runs outside libtest's harness, on one thread.
[[test]]
name = "vault_residue"
path = "tests/vault_residue.rs"
harness = false

# Serves vault `ssh` slots over the OpenSSH agent protocol (Windows named
# pipe / Unix socket). Moved from personae (DR-B); the name is unchanged.
[[bin]]
name = "personae-agent"
path = "src/bin/personae-agent.rs"
required-features = ["agent"]

# Inspect and manage the vault from a terminal. `agent` because its `add-ssh`
# door refuses keys the agent cannot sign, as `ssh-add` and the authority's
# import do (chatelaine ruling 60). Moved from personae (DR-B).
[[bin]]
name = "personae-vault"
path = "src/bin/personae-vault/main.rs"
required-features = ["agent"]
