[package]
name = "castellan"
version = "0.0.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Castellan is the credential-keeper port of the Mere platform: the officer of the gate who holds your chatelaine (secrets: passwords, 2FA seeds, tokens) and presents your insignia (graded proofs of identity), in trust for your personae. Hosts embed views; only the castellan touches secrets, and every release is a gate petition."
readme = "README.md"
keywords = ["credentials", "identity", "vault", "agent", "persona"]
categories = ["authentication"]

[features]
# The SitedStationGrant adapter uses Mere's host-side wallet store to issue and
# check the existing signed RemoteAuth envelope. Keep the credential and OTP
# library halves usable without that application-storage dependency.
station-grants = ["dep:pandect"]
# The keeper surface (founded 2026-08-14): the secret-free read model, the
# card/intent projection, and the resident PersonaeHost authority, moved home
# from graphshell per the port law. One feature rather than an embeddable/
# authority pair because the projection already renders pending signing
# requests, which rides personae's agent stack; split when a consumer wants
# views without it.
keeper = [
  "dep:blake3",
  "dep:chirograph",
  "dep:rand_core",
  "dep:serde_json",
  "dep:pandect",
  "dep:ssh-agent-lib",
  "dep:ssh-key",
  "dep:thiserror",
  "dep:tracing",
  "dep:tokio",
  "personae/agent",
]
# Freedesktop Secret Service 0.2 adapter. The portable sealed collection model
# compiles everywhere; the D-Bus server is Linux-only.
secret-service = ["dep:thiserror", "dep:tokio", "dep:tracing", "dep:zbus"]

[dependencies]
# The check conclusions and faults, named directly (insigne proofs plan, B).
insigne = { workspace = true, features = ["verify"] }
# HMAC + the three hashes RFC 6238 allows. RustCrypto, and sha2 is already a
# workspace pin, so this adds one lineage rather than three.
base64.workspace = true
# The secret-free item taxonomy; the OTP display enums are defined there.
chatelaine.workspace = true
# The identity surface's plain types (dramatis repo plan, DR-A).
dramatis.workspace = true
hmac = "0.13"
notochord.workspace = true
personae.workspace = true
serde.workspace = true
sha1 = "0.11"
sha2.workspace = true
uuid.workspace = true
pandect = { workspace = true, optional = true }
zeroize = "1"
# ── keeper surface ────────────────────────────────────────────────────────
blake3 = { workspace = true, optional = true }
chirograph = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# SSH key generation inside the authority mints with the OS RNG.
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
ssh-agent-lib = { version = "0.6", optional = true }
ssh-key = { version = "0.6", features = ["ed25519", "encryption"], optional = true }
thiserror = { version = "1", optional = true }
tracing = { workspace = true, optional = true }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"], optional = true }

[dev-dependencies]
# The Linux Secret Service receipt reads its lock signal as a stream.
futures-util = "0.3"
gaz = { workspace = true, features = ["muniment"] }
gazette.workspace = true
muniment = { workspace = true, features = ["postcard", "redb"] }
pollster = "0.4"
# The read-model tests serialize chatelaine values to look for secrets.
serde_json.workspace = true
tempfile = "3"
# The moved authority tests exercise the real SSH agent session and, on
# Windows, the named-pipe wire.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "process"] }
# The moved authority tests verify real signatures off the agent wire.
signature = "2"

# Vault lock ruling 6's no-residue instrument over the resident's lock path
# (L2). Personae's tracker installs its own global allocator, so this runs
# outside libtest's harness, on one thread.
[[test]]
name = "snapshot_golden"
path = "tests/snapshot_golden.rs"
required-features = ["keeper"]

[[test]]
name = "no_residue"
path = "tests/no_residue.rs"
harness = false
required-features = ["keeper"]
