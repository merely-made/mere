[package]
name = "mere-signalman"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/merely-made/mere"
publish = false
description = "Private Mere port for commissioning and operating Retinue stations through djinn."

[dependencies]
blake3.workspace = true
# The custody client: Signalman asks djinn for a station's keys, its grant
# and its revocation, and opens no wallet (dramatis repo plan, D5, D17).
graphshell = { path = "../graphshell", default-features = false, features = ["native"] }
personae.workspace = true
# The check conclusions and faults, named directly (insigne proofs plan, B).
insigne = { workspace = true, features = ["verify"] }
p2panda-core = "0.7.0"
# This port is consumed from mere.git, where a sibling Retinue checkout does
# not exist. Signalman's desktop workspace patches this exact source back to
# its local Retinue crates so Cargo still builds one type-bearing family.
outrider.workspace = true
postilion.workspace = true
radio-hand.workspace = true
retinue = { workspace = true, features = ["tulle-radio"] }
serde.workspace = true
serde_json.workspace = true
pandect.workspace = true
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
uuid.workspace = true
zeroize = "1"

[dev-dependencies]
tempfile = "3"
