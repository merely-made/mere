[package]
name = "custody-wire"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The custody contract between Djinn and its independently launched custodian: typed operations, zeroizing frames, OS-derived peer principals and the client"

# No custody implementation lives here: a client links this crate, never
# castellan. The custodian links both.
[dependencies]
base64.workspace = true
# The public identity views and intents (secret-free; personae, gaz, serde).
dramatis.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
