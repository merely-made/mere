[package]
name = "pelt-core"
# Landed in mere 2026-09-03; see ports/pelt/Cargo.toml for why the keys genet's
# workspace supplied are stated inline here.
version = "0.2.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false
rust-version = "1.86.0"
repository.workspace = true
description = "Window-neutral retained-session controller for the Pelt reference browser."
readme = "README.md"

[features]
default = []
genet = ["dep:genet-documents", "dep:mere-document-lanes", "dep:netrender", "dep:serde_json"]
image-decode = ["genet-documents?/image-decode"]

[dependencies]
serde_json = { workspace = true, optional = true }
genet-documents = { workspace = true, features = ["livery"], optional = true }
mere-document-lanes = { workspace = true, features = ["retained-clips"], optional = true }
netrender = { workspace = true, optional = true }
genet-host-api = { workspace = true }
workbench = { workspace = true }
inker = { workspace = true }
page-load = { workspace = true }
url = "2.5"
