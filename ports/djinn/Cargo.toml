[package]
name = "djinn"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first desktop resident composition for the Mere stack: identity, local sessions, personal sync, Knot, credential custody, and endpoint ownership."
readme = "README.md"
keywords = ["local-first", "p2p", "resident", "identity", "djot"]
categories = ["command-line-utilities", "authentication"]

[features]
default = ["personal-sync"]
personal-sync = []
# `--passphrase-fd 0` for the harness and its receipts (vault lock ruling 65):
# a passphrase read once from standard input, never the environment. Tests turn
# it on through the dev-dependency on this package below; release builds keep
# the prompt only.
passphrase-fd = []
# The Distillery trainer resource, composed into the works lane
# (`src/resident_distillery.rs`). Gated because it pulls the burn stack into
# the desktop resident: a default build must stay light, and a lane whose
# settings name a trainer this build does not carry is refused loudly rather
# than composed diminished.
trainer = ["distillery/trainer"]
# The same trainer, composed on this machine's discrete GPU. Additive over
# `trainer`, and honest about the difference: a lane that says `device: "gpu"`
# on a build without this feature refuses `open` by name rather than quietly
# training on the CPU, and `HostFacts.gpu` follows the composed resource
# rather than the hardware — a device with an RTX in it still advertises no
# GPU unless a GPU resource was actually registered.
trainer-gpu = ["trainer", "distillery/trainer-gpu"]
# The autodiff trainer arm (esp-trainer-v1-autodiff), composed into the same
# lane and the same resource. Additive over `trainer` and orthogonal to
# `trainer-gpu`: the arm a job asks for lives in its request, the device lives
# in the lane's settings, and a build may carry either, both, or neither. A
# request naming an arm this build does not carry is refused by name at
# admission and never quietly trained with the other one, which is the same
# posture `trainer-gpu` takes about the device.
trainer-autodiff = ["trainer", "distillery/trainer-autodiff"]
# A deliberately opt-in headed receipt host. This composes a temporary real
# Djinn resident and the Graphshell WebRTC door without changing the ordinary
# resident binary or importing fixture release identity into product startup.
distillery-chronicle-receipt-host = [
    "personal-sync",
    "graphshell/webrtc-session",
    "dep:webrtc-carrier",
]

[dependencies]
blake3.workspace = true
# The one crate allowed to link castellan (dramatis repo plan, D4, D16).
# `os-presence`: the resident's own unlock prompt asks Windows Hello first
# (vault lock ruling 47); it moved from personae with custody (DR-B).
castellan = { workspace = true, features = ["keeper", "os-presence"] }
chirograph.workspace = true
# The identity tier's plain types: views, intents, the roster (DR-A, DR-C).
dramatis.workspace = true
incipit.workspace = true
# The operational works composed as this resident's fourth lane
# (`src/resident_distillery.rs`). Default features only unless djinn's own
# `trainer` feature is on: `remote` would pull the burn stack into the desktop
# resident, and `trainer` pulls it deliberately and by the owner's request.
distillery.workspace = true
graphshell = { version = "0.0.2", path = "../graphshell", features = ["personal-sync"] }
graphshell-endpoint.workspace = true
knot-editor.workspace = true
# The resident's own native dialogs (`src/identity_ui.rs`), moved from
# graphshell with the keeper adapters (dramatis repo plan, D15).
light-file-dialog = "3.21.3"
# Immutable saved-site snapshot contract published by Knot, at the workspace's
# Knot revision so knot-site and knot-editor share one Knot source.
knot-site = { git = "https://github.com/merely-made/knot-editor.git", rev = "e224748fb0b251c77963bce071cf08c0d9078708", package = "knot-site", features = ["retinue"] }
# The policy vocabulary the device sensor fills in (`DeviceConditions`), and
# the `ConditionSource` seam it plugs into. `mere-mesh` refuses to touch the
# OS; `src/conditions.rs` is the Windows-facing half that seam expects.
mesh.workspace = true
# The delegation-signing salts the custody route signs with (D11).
insigne.workspace = true
muniment.workspace = true
notochord.workspace = true
pandect.workspace = true
personae = { workspace = true, features = ["ssh"] }
# The receipt hosts' and the native picker's SSH keys (`src/bin/h4*`), and
# the chronicle receipt host's nonces.
rand_core = { version = "0.6", features = ["getrandom"] }
# The H4d receipt host verifies the approved signature.
signature = "2"
sceno.workspace = true
scenotime.workspace = true
serde = { version = "1", features = ["derive"] }
# `lock.toml`, the per-device lock settings a person edits (vault lock ruling 77).
toml = "0.8"
serde_json.workspace = true
rcgen = "0.13.2"
# `--enroll-passphrase` reads the passphrase from the terminal, never the
# environment (vault lock rulings 7 and 39). Already in the lock (minisign).
rpassword = "7.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
gemini-protocol = { version = "=0.1.7", features = ["server"] }
sha2.workspace = true
ssh-agent-lib = "0.6"
# Importing an SSH key through the native picker (`src/identity_ui.rs`).
ssh-key = { version = "0.6", features = ["ed25519", "encryption"] }
thiserror = "1"
# "signal" is what lets the run loop stop the mesh works deliberately on Ctrl-C
# rather than being killed mid-lease.
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
transport = { workspace = true, features = ["notochord"] }
uuid = { workspace = true, features = ["v5"] }
webrtc-carrier = { workspace = true, optional = true }
zeroize = "1"

# Device condition sensing (`src/conditions.rs`). Win32 only — no COM, no WMI,
# no WinRT, so the resident never pays for a COM apartment to read a battery.
# `Win32_NetworkManagement_Ndis` and `Win32_Networking_WinSock` are not called
# directly; `IP_ADAPTER_ADDRESSES_LH` is cfg-gated on both.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# The local clock for `src/conditions.rs` off Windows, where `GetLocalTime` is
# not available and `std` carries no timezone. chrono rather than `time`:
# `time`'s local-offset lookup refuses in a multi-threaded process on Unix, and
# the resident is one. Default features off — "clock" is the whole reason.
[target.'cfg(not(windows))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# `sysctlbyname("hw.memsize")` for `HostFacts::memory_mib`
# (`src/resident_distillery.rs`). macOS has no `/proc/meminfo`, and the sysctl
# is the kernel's own answer; libc rather than spawning `sysctl(8)`, because a
# resident should not fork a process to learn its own memory size. 0.2 is
# already in this workspace's graph.
# logind's session lock and sleep, and Mutter's idle monitor (vault lock
# rulings 73, 75), over D-Bus: the zbus castellan's Secret Service uses.
[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[[bin]]
name = "djinn"
path = "src/bin/djinn.rs"
required-features = ["personal-sync"]

[[bin]]
name = "djinn-site"
path = "src/bin/djinn_site.rs"
required-features = ["personal-sync"]

[[bin]]
name = "djinn-devices"
path = "src/bin/djinn_devices.rs"
required-features = ["personal-sync"]

# Distillery's installed configuration, answered by the running resident
# over the custody route (dramatis repo plan, DR-C). Here rather than in
# distillery because graphshell, which carries the client, depends on it.
[[bin]]
name = "distillery-installed"
path = "src/bin/distillery_installed.rs"
required-features = ["personal-sync"]

# The keeper's identity receipts, moved from graphshell with the adapters
# that hold the authority (D15).
[[bin]]
name = "h4_identity_receipt"
path = "src/bin/h4_identity_receipt.rs"
required-features = ["personal-sync"]

[[bin]]
name = "persona_switch_receipt"
path = "src/bin/persona_switch_receipt.rs"
required-features = ["personal-sync"]

[[bin]]
name = "h4d_browser_receipt_host"
path = "src/bin/h4d_browser_receipt_host.rs"
required-features = ["personal-sync"]

[[bin]]
name = "h4e_browser_import_receipt_host"
path = "src/bin/h4e_browser_import_receipt_host.rs"
required-features = ["personal-sync"]

[[bin]]
name = "distillery_chronicle_receipt_host"
path = "src/bin/distillery_chronicle_receipt_host.rs"
required-features = ["distillery-chronicle-receipt-host"]

[dev-dependencies]
# This package with `passphrase-fd`, so the binary the tests spawn reads the
# harness's passphrase (ruling 65).
djinn = { path = ".", default-features = false, features = ["passphrase-fd"] }
# The shared resident harness (djinn test harness plan): path only, unpublished,
# so packaging drops it.
djinn-testkit = { path = "../../crates/system/djinn-testkit" }
insigne = { workspace = true, features = ["verify"] }
# The trainer receipt (`tests/distillery_trainer.rs`) authors the synthetic
# base model and reads the published artifacts back out of the model library,
# so the *test* names eidetic and safetensors. Production djinn does not:
# `src/resident_distillery.rs` speaks only `muniment::RedbBackend` and
# distillery's own re-exported trainer vocabulary.
eidetic.workspace = true
# The route adapter's test in `resident_mere`: graphshell's `mere_route`, the
# mere view's model it fills, and the kernel's relations to fill it with.
graphshell = { version = "0.0.2", path = "../graphshell", features = ["personal-sync", "mere-route"] }
graphshell-endpoint.workspace = true
kernel.workspace = true
mere-view.workspace = true
p2panda-core = "0.7.0"
# The Knot residue test's baselines (iroh alone, p2panda-net alone), built as
# mere-transport's seed residue test builds them; transport's own rows.
iroh = "1.0.3"
p2panda-net = { package = "mere-p2panda-net", version = "=0.7.5", default-features = false, features = [
  "address_book",
  "iroh_endpoint",
  "iroh_mdns",
  "discovery",
  "gossip",
  "sync",
] }
stickleback.workspace = true
safetensors = "0.4"
scenotime.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

# Vault lock rulings 48 and 49: what Knot leaves of its seed, strict on the
# paths that open no network and judged against iroh's and p2panda-net's own
# blocks for the sync host; castellan's residue tracker (its own global allocator, no
# libtest).
[[test]]
name = "knot_residue"
path = "tests/knot_residue.rs"
harness = false
