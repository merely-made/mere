[package]
name = "djinn-custodian"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent Castellan custody service core; synthetic receiving integration only until H1 passes"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
native-host = []

[dependencies]
castellan.workspace = true
personae.workspace = true
base64.workspace = true
blake3.workspace = true
getrandom = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize = "1"

[dev-dependencies]
tempfile = "3"
