[package]
name = "djinn-custodian"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The independently launched Castellan custodian: the only process that opens, unlocks, locks, signs with and releases from Djinn's vault"

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "djinn-custodian"
path = "src/bin/djinn-custodian.rs"

[features]
default = []
# The private C ABI the signed macOS host links (testing/macos-castellan-custodian-h1).
native-host = []

[dependencies]
castellan.workspace = true
custody-wire = { path = "wire" }
insigne = { workspace = true, features = ["verify"] }
personae.workspace = true
base64.workspace = true
blake3.workspace = true
getrandom = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
