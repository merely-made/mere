[package]
name = "mere-alembic"
version = "0.0.1"
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
description = "Alembic is the recall and workshop component of Distillery, the Mere platform's works: the memory surfaces (short-term, long-term, codicils, search) behind a `recall` feature, and the granted-agent and automation workshop over them — create, grant, run, observe, interrupt, and dissolve a bounded actor. Athanor (mere-athanor), the distillation furnace, is its authority half and the first such actor. Inside Distillery since 2026-09-02: Distillery runs models, its Alembic component runs work over them."
readme = "README.md"
keywords = ["memory", "agents", "recall", "automation", "local-first"]
categories = ["development-tools"]

[lib]
name = "alembic"
path = "src/lib.rs"

[features]
# The memory surfaces without the workshop, for a host that wants recall only.
# Mirrors castellan's `keeper` split: an embeddable half a host composes, and
# an authority half that stays with the resident.
recall = ["dep:kernel", "dep:serde"]

[dependencies]
kernel = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
chartulary.workspace = true
euclid = "0.22"
kernel = { workspace = true, features = ["fixtures"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
