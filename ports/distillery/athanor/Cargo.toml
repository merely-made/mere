[package]
rust-version = "1.97.1"
name = "mere-athanor"
version = "0.0.1"
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
description = "Athanor is the distillation furnace of Distillery, the Mere platform's works: the authority half of Alembic's workshop — what a furnace pass is, what it may propose (distillation, cleanup, facet proposals), and the grants, runs, petitions, and revocation over bounded actors. It proposes and never becomes graph-truth authority; Djinn schedules it as one resident service."
readme = "README.md"
keywords = ["memory", "agents", "distillation", "automation", "local-first"]
categories = ["development-tools"]

[lib]
name = "athanor"
path = "src/lib.rs"

[features]
default = ["furnace"]
furnace = ["dep:alembic", "alembic/recall", "dep:eidetic", "dep:kernel", "dep:pandect"]
workshop = ["dep:alembic", "alembic/workshop", "dep:servitor", "dep:muniment", "dep:serde", "dep:serde_json", "dep:blake3"]
workshop-worker = ["workshop", "dep:armillary"]
workshop-sealed = ["workshop", "dep:eidetic"]
workshop-destination = ["workshop", "dep:pandect", "dep:kernel", "dep:chartulary", "dep:euclid", "dep:uuid"]

[dependencies]
alembic = { workspace = true, optional = true }
eidetic = { workspace = true, optional = true }
kernel = { workspace = true, optional = true }
pandect = { workspace = true, optional = true }
servitor = { workspace = true, optional = true }
muniment = { workspace = true, optional = true }
armillary = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
blake3 = { version = "1", optional = true }
chartulary = { workspace = true, optional = true }
euclid = { version = "0.22", optional = true }
uuid = { version = "1", optional = true }

[dev-dependencies]
chacha20poly1305 = "=0.10.1"
async-trait = "0.1"
chartulary.workspace = true
euclid = "0.22"
kernel = { workspace = true, features = ["fixtures"] }
muniment = { workspace = true, features = ["directory"] }
pollster = "0.4"
serde_json = "1"
tempfile = "3"
