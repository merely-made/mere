[package]
rust-version = "1.97.1"
name = "distillery"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The model-works port of the Mere platform: a host for mesh-supervised inference, embedding, and training jobs."
readme = "README.md"
keywords = ["inference", "embedding", "mesh", "harness", "compute"]
categories = ["concurrency"]

[dependencies]
tracing = { workspace = true, optional = true }
stickleback = { workspace = true, optional = true }
p2panda-store = { version = "0.7.0", default-features = false, optional = true }
chacha20poly1305 = { version = "0.11", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
zeroize = { version = "1", optional = true }
insigne.workspace = true
mesh = { workspace = true, features = ["admitted-ingress"] }
incipit.workspace = true
muniment.workspace = true
personae.workspace = true
pandect.workspace = true
cambium.workspace = true
chirograph.workspace = true
graphshell-endpoint.workspace = true
sceno.workspace = true
scenograph.workspace = true
scenomise.workspace = true
scenotime.workspace = true
eidetic = { workspace = true, optional = true }
eidetic-search = { workspace = true, optional = true }
# The decoder half is named by the features that need it (`trainer`,
# `flora`), so `inference` can carry the actor without the Burn stack.
esp = { workspace = true, optional = true }
armillary.workspace = true
apparatus = { package = "mere-apparatus", path = "../../crates/domain/apparatus", default-features = false, features = ["serde"], optional = true }
safetensors = { version = "0.4", optional = true }
pollster = { version = "0.4", optional = true }
notochord = { workspace = true, features = ["tokio"], optional = true }
mere-surface-api = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
p2panda-core = "0.7.0"
transport.workspace = true
burn-backend = { version = "=0.22.0", optional = true }
burn-ir = { version = "=0.22.0", optional = true }
burn-remote = { version = "=0.22.0", default-features = false, features = ["client", "server", "iroh"], optional = true }
iroh = { version = "1.0.3", optional = true }

[features]
default = []
remote = ["dep:burn-backend", "dep:burn-ir", "dep:burn-remote", "dep:iroh"]
trainer = ["dep:esp", "esp/decoder-lora", "dep:eidetic", "dep:pollster", "dep:safetensors", "tokio/rt"]
# The trainer on the local discrete GPU. Additive over `trainer`: it turns on
# esp's wgpu decoder backend and the adapter probe that comes with it, so a
# host can ask which adapter the runtime would bind *before* composing a
# device on it. Nothing here changes what the CPU trainer does.
trainer-gpu = ["trainer", "esp/decoder-wgpu"]
# The autodiff trainer (v1). Additive over `trainer`: it turns on esp's
# `decoder-autodiff`, which is where the burn autodiff and optimizer feature
# edges enter this build. Composes with `trainer-gpu`; a build carrying both
# runs either arm on either device. Without it the autodiff request arm still
# deserializes, and the job refuses it by name.
trainer-autodiff = ["trainer", "esp/decoder-autodiff"]
flora = ["dep:eidetic", "dep:esp", "esp/decoder-lora", "dep:safetensors"]
# The resident inference lane (resident inference and recall plan, I1): esp's
# actor and provider seam, the run table and the `inference.ask` endpoint. No
# model runtime: the host supplies the provider.
inference = ["dep:esp", "esp/actor", "dep:apparatus"]
inference-embedding = ["inference-model", "esp/persistence", "esp/bert"]
inference-gpu = ["inference-model", "esp/decoder-wgpu", "dep:tracing"]
inference-stages = ["inference-model", "dep:notochord", "tokio/io-util"]
inference-wire = ["dep:eidetic"]
inference-model = ["inference-wire","dep:eidetic-search", "inference", "esp/decoder-flex", "esp/model-session", "dep:eidetic", "dep:pollster", "dep:stickleback", "dep:p2panda-store", "dep:chacha20poly1305", "dep:rand_core", "dep:zeroize"]

[dev-dependencies]
# Supplier-owned tiny models and templates; enabled only for test targets.
esp-test-support = { workspace = true }
safetensors = "0.4"
notochord = { workspace = true, features = ["tokio"] }
stickleback.workspace = true
# Tests and examples bind throwaway identities (vault lock plan, ruling 96).
transport = { workspace = true, features = ["test-identity"] }
burn-flex = { version = "=0.22.0", features = ["default"] }
gemot.workspace = true
mien.workspace = true
mooting.workspace = true
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
# Personae's residue tracker, included by path, clears its own buffers.
zeroize = "1"
proofs.workspace = true
genet-scripted-dom = { workspace = true }
layout-dom-api = { workspace = true }
# The walk fixtures author a p2panda log directly, so the test names
# `Operation<MeshExt>`. `mesh` re-exports `MeshExt` and `to_operation` but not
# p2panda's own `Operation`, and a helper that returns one has to say so.

# Personae's tracking allocator owns this binary's heap, so it runs without
# libtest (vault lock rulings 44 and 92).
[[test]]
name = "transport_residue"
path = "tests/transport_residue.rs"
harness = false
