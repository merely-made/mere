[package]
rust-version = "1.97.1"
name = "distillery-native-fixture"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Native numerical control for Distillery's browser model matrix."

[workspace]

[dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["ndarray", "std"] }
esp = { features = ["bert", "decoder"], git = "https://github.com/merely-made/esp.git", rev = "b20ae7db257dae83493031efd92da3a102c44a48" }
serde_json = "1"

[[bin]]
name = "distillery-decoder-native-fixture"
path = "src/bin/decoder.rs"

[workspace.package]
rust-version = "1.97.1"

