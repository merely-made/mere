[package]
rust-version = "1.97.1"
name = "distillery-model-probe"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/mere"
publish = false
description = "Headed browser evidence surface for Distillery's local model corridor."

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
blake3 = "1.5"
burn = { version = "=0.22.0", default-features = false, features = ["std", "wgpu"] }
eidetic = { default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943" }
esp = { features = ["bert-validation", "bert-wgpu", "decoder-wgpu"], git = "https://github.com/merely-made/esp.git", rev = "af5597c670da111713dd306f4feba8db892a86d2" }
# The module start runs the static constructors once (rulings 532, 533, 536).
cambium-genet-web-host = { path = "../../../crates/cambium/cambium-genet-web-host" }
# One wasm-bindgen family with graphshell-web and cambium-genet-web-host
# (ruling 545). The old 0.2.122 pin is gone: wgpu 30.0.0 decoded a successful
# error-scope pop through `JsOption`, which wasm-bindgen 0.2.126 and later read
# as an error, and wgpu 30.0.1 decodes it through `JsNullable` instead (burn
# plan 13.37). cambium-genet-web-host's workspace wgpu requires 30.0.1.
js-sys = "=0.3.106"
muniment = { features = ["indexeddb"], git = "https://github.com/merely-made/eidetic.git", rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
    "DedicatedWorkerGlobalScope",
    "Response",
] }

[patch.crates-io]
# Canonical promoted families; keep registry and Git consumers type-identical.
armillary = { git = "https://github.com/merely-made/armillary.git", rev = "6827559937f07f78a6a830dfbfcaa54210dd093c" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943" }
commons-spine = { git = "https://github.com/merely-made/gemot.git", rev = "67ce0ac3e2b48be951a677a9eca245eaabd56d63" }
dict-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943" }
errand = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
esp = { git = "https://github.com/merely-made/esp.git", rev = "af5597c670da111713dd306f4feba8db892a86d2" }
finger-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
fsp-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
