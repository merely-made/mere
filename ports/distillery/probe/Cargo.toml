[package]
rust-version = "1.97.1"
name = "distillery-model-probe"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/mere"
publish = false
description = "Headed browser evidence surface for Distillery's local model corridor."

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
blake3 = "1.5"
burn = { version = "=0.22.0", default-features = false, features = ["std", "wgpu"] }
eidetic = { path = "../../../crates/eidetic/eidetic-core", default-features = false }
esp = { path = "../../../crates/intel/esp", features = ["bert-validation", "bert-wgpu", "decoder-wgpu"] }
# The module start runs the static constructors once (rulings 532, 533, 536).
cambium-genet-web-host = { path = "../../../crates/cambium/cambium-genet-web-host" }
# One wasm-bindgen family with graphshell-web and cambium-genet-web-host
# (ruling 545). The old 0.2.122 pin is gone: wgpu 30.0.0 decoded a successful
# error-scope pop through `JsOption`, which wasm-bindgen 0.2.126 and later read
# as an error, and wgpu 30.0.1 decodes it through `JsNullable` instead (burn
# plan 13.37). cambium-genet-web-host's workspace wgpu requires 30.0.1.
js-sys = "=0.3.106"
muniment = { path = "../../../crates/eidetic/muniment", features = ["indexeddb"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
    "DedicatedWorkerGlobalScope",
    "Response",
] }

[patch.crates-io]
# cambium-genet-web-host rides Genet; [patch] is not inherited, so these rows
# restate graphshell-web's, at the same immutable Genet revision.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084", version = "=0.1.2" }
# Classic 0.11 and its owned repairs, coherent with Mere's root Scene aliases.
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
cubecl-runtime = { path = "../../../support/patches/cubecl-runtime" }
cubek-reduce = { path = "../../../support/patches/cubek-reduce" }

[workspace.package]
rust-version = "1.97.1"

# Published shadow-resource repair across Genet and host renderer contracts.
# Genet retains its qualified source pin; this root redirects the complete
# runtime family to one immutable Git source identity. Standalone roots must
# repeat this bridge. Retire after coordinated Genet supplier adoption.
[patch."https://github.com/merely-made/netrender.git"]
netrender = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
netrender_device = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
paint_list_api = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
paint_list_render = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "6a24ae08f55129b474282b8e4911564f875ce5fd" }
