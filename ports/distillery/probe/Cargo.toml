[package]
name = "distillery-model-probe"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/mere"
publish = false
description = "Headed browser evidence surface for Distillery's local model corridor."

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
blake3 = "1.5"
burn = { version = "=0.22.0", default-features = false, features = ["std", "wgpu"] }
eidetic = { path = "../../../crates/eidetic/eidetic-core", default-features = false }
esp = { path = "../../../crates/intel/esp", features = ["bert-validation", "bert-wgpu", "decoder-wgpu"] }
# The module start runs the static constructors once (rulings 532, 533, 536).
cambium-genet-web-host = { path = "../../../crates/cambium/cambium-genet-web-host" }
# One wasm-bindgen family with graphshell-web and cambium-genet-web-host
# (ruling 545). The old 0.2.122 pin is gone: wgpu 30.0.0 decoded a successful
# error-scope pop through `JsOption`, which wasm-bindgen 0.2.126 and later read
# as an error, and wgpu 30.0.1 decodes it through `JsNullable` instead (burn
# plan 13.37). cambium-genet-web-host's workspace wgpu requires 30.0.1.
js-sys = "=0.3.106"
muniment = { path = "../../../crates/eidetic/muniment", features = ["indexeddb"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
    "DedicatedWorkerGlobalScope",
    "Response",
] }

[patch.crates-io]
# cambium-genet-web-host rides Genet; [patch] is not inherited, so these rows
# restate graphshell-web's, at the same immutable Genet revision.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda", version = "=0.1.2" }
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
cubecl-runtime = { path = "../../../support/patches/cubecl-runtime" }
cubek-reduce = { path = "../../../support/patches/cubek-reduce" }
