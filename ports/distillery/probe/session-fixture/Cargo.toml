[package]
rust-version = "1.97.1"
name = "distillery-model-session-fixture"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Real PEFT LoRA receipt for ESP's immutable ModelSession seam."

[workspace]

[dependencies]
eidetic = { default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
esp = { features = ["decoder-lora"], git = "https://github.com/merely-made/esp.git", rev = "0ba91dbce5aaaad1b866a3891a0255045ba5131b" }
half = "2"
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
ndarray = "0.17"
pollster = "0.4"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mere's ruled 0.11 row; a standalone workspace states it inline.
sha2 = "0.11"

[patch.crates-io]
# Canonical promoted families; keep registry and Git consumers type-identical.
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
esp = { git = "https://github.com/merely-made/esp.git", rev = "0ba91dbce5aaaad1b866a3891a0255045ba5131b" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
# Match the stable runtime policy of the other Distillery fixtures.

[workspace.package]
rust-version = "1.97.1"

[patch."https://github.com/merely-made/mere.git"]
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
esp = { git = "https://github.com/merely-made/esp.git", rev = "0ba91dbce5aaaad1b866a3891a0255045ba5131b" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }

[patch."https://www.github.com/merely-made/mere.git"]
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
esp = { git = "https://github.com/merely-made/esp.git", rev = "0ba91dbce5aaaad1b866a3891a0255045ba5131b" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }

# Suppliers that still name eidetic aa94fe22 (gemot, murm, esp) resolve to this
# revision through the www form of the URL, the same repository under another
# source key, so one eidetic resolves. Drop once they repin.
[patch."https://github.com/merely-made/eidetic.git"]
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "5afe6723b75cc2b62420328c079c05c60c90380d" }
