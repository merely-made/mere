[package]
name = "distillery-model-session-fixture"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Real PEFT LoRA receipt for ESP's immutable ModelSession seam."

[workspace]

[dependencies]
eidetic = { path = "../../../../crates/eidetic/eidetic-core", default-features = false }
esp = { path = "../../../../crates/intel/esp", features = ["decoder-lora"] }
half = "2"
muniment = { path = "../../../../crates/eidetic/muniment" }
ndarray = "0.17"
pollster = "0.4"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mere's ruled 0.11 row; a standalone workspace states it inline.
sha2 = "0.11"

[patch.crates-io]
# Match the stable runtime policy of the other Distillery fixtures.
cubecl-runtime = { path = "../../../../support/patches/cubecl-runtime" }
