[package]
rust-version = "1.97.1"
name = "distillery-model-session-fixture"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Real PEFT LoRA receipt for ESP's immutable ModelSession seam."

[workspace]

[dependencies]
eidetic = { default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "de6b1dce75dd6725d72c79b829e4878c7903a381" }
esp = { features = ["decoder-lora"], git = "https://github.com/merely-made/esp.git", rev = "a2561b0b9766a4ad4d9924c02194bb414667b9ef" }
half = "2"
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "de6b1dce75dd6725d72c79b829e4878c7903a381" }
ndarray = "0.17"
pollster = "0.4"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mere's ruled 0.11 row; a standalone workspace states it inline.
sha2 = "0.11"

