[package]
name = "distillery-remote-minilm-fixture"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Two-peer native WGPU receipt for Distillery's lease-bound Burn Remote lane."

[workspace]

[dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["remote", "std", "wgpu"] }
burn-wgpu = { version = "=0.22.0", default-features = false, features = ["std"] }
cubecl = { version = "=0.11.0", default-features = false }
distillery = { path = "../..", features = ["remote"] }
esp = { path = "../../../../crates/intel/esp", features = ["bert"] }
identity = { package = "personae", path = "../../../../crates/dramatis/personae" }
mesh = { package = "mere-mesh", path = "../../../../crates/mesh/mesh" }
muniment = { path = "../../../../crates/eidetic/muniment" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# A probe binary with throwaway identities, so it uses the test-only
# keypair builder (vault lock plan, ruling 96).
transport = { package = "mere-transport", path = "../../../../crates/murm/transport", features = ["test-identity"] }

[features]
default = []
fusion = ["burn-wgpu/fusion"]
autotune = ["burn-wgpu/autotune"]
fusion-autotune = ["fusion", "autotune"]

[patch.crates-io]
# Match the root's render source policy; patches are not inherited by this workspace.
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
burn-remote = { path = "../../../../support/patches/burn-remote" }
cubecl-runtime = { path = "../../../../support/patches/cubecl-runtime" }
cubek-reduce = { path = "../../../../support/patches/cubek-reduce" }
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
