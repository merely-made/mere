[package]
rust-version = "1.97.1"
name = "distillery-remote-minilm-fixture"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Two-peer native WGPU receipt for Distillery's lease-bound Burn Remote lane."

[workspace]

[dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["remote", "std", "wgpu"] }
burn-wgpu = { version = "=0.22.0", default-features = false, features = ["std"] }
cubecl = { version = "=0.11.0", default-features = false }
distillery = { path = "../..", features = ["remote"] }
esp = { path = "../../../../crates/intel/esp", features = ["bert"] }
identity = { package = "personae", git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
mesh = { package = "mere-mesh", path = "../../../../crates/mesh/mesh" }
muniment = { path = "../../../../crates/eidetic/muniment" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# A probe binary with throwaway identities, so it uses the test-only
# keypair builder (vault lock plan, ruling 96).
transport = { package = "mere-transport", git = "https://github.com/merely-made/murm.git", rev = "b49df894635bac95823284efee6c445885eaf62a", features = ["test-identity"] }

[features]
default = []
fusion = ["burn-wgpu/fusion"]
autotune = ["burn-wgpu/autotune"]
fusion-autotune = ["fusion", "autotune"]

[patch.crates-io]
# Match the root's render source policy; patches are not inherited by this workspace.
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
burn-remote = { path = "../../../../support/patches/burn-remote" }
cubecl-runtime = { path = "../../../../support/patches/cubecl-runtime" }
cubek-reduce = { path = "../../../../support/patches/cubek-reduce" }
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }

[workspace.package]
rust-version = "1.97.1"

# Keep the imported carrier and local actor graph on one shared leaf source.
[patch."https://github.com/merely-made/mere.git"]
muniment = { path = "../../../../crates/eidetic/muniment" }
stickleback = { path = "../../../../crates/stickleback" }
mere-proofs = { path = "../../../../crates/system/proofs" }
luggage = { path = "../../../../crates/system/luggage" }
