<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burn Browser Binary-Graph Reproducer</title>
  <style>
    body { max-width: 64rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; }
    button { font: inherit; padding: .55rem .9rem; }
    pre { padding: 1rem; overflow: auto; background: #111; color: #eee; }
  </style>
</head>
<body>
  <h1>Burn Browser Binary-Graph Reproducer</h1>
  <p>Shared-input binary operations, LayerNorm, and embedding controls through BrowserWebGpu.</p>
  <button id="run" type="button">Run graph cases</button>
  <p id="status">idle</p>
  <pre id="output">{}</pre>
  <script type="module">
    // Receipt gate (Mark, "Gate every receipt"): every uncaught page error or
    // unhandled rejection is recorded, and any entry fails the receipt.
    const receiptGateFailures = [];
    window.addEventListener("error", (event) => {
      receiptGateFailures.push(`uncaught: ${event.message}`);
    });
    window.addEventListener("unhandledrejection", (event) => {
      receiptGateFailures.push(`unhandled rejection: ${event.reason}`);
    });
    // The gate's positive control: `?plant_page_error=throw|reject` plants one
    // page error while a run is live.
    function plantPageErrorForControl() {
      const planted = new URLSearchParams(location.search).get("plant_page_error");
      if (!planted) return;
      setTimeout(() => {
        if (planted === "reject") {
          Promise.reject(new Error("receipt-gate-control: planted rejection"));
        } else {
          throw new Error("receipt-gate-control: planted page error");
        }
      }, 100);
    }

    const runButton = document.querySelector("#run");
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");

    async function run() {
      const gateSince = receiptGateFailures.length;
      plantPageErrorForControl();
      runButton.disabled = true;
      status.textContent = "running";
      const receipt = await new Promise((resolve) => {
        const worker = new Worker("./worker.js", { type: "module" });
        const finish = (result) => {
          clearTimeout(timeout);
          worker.terminate();
          resolve(result);
        };
        const timeout = setTimeout(() => finish({
          kind: "timeout",
          error: "worker produced no result within 60 seconds",
          gpu_errors: [],
        }), 60_000);
        worker.addEventListener("message", (event) => finish(event.data), { once: true });
        worker.addEventListener("error", (event) => finish({
          kind: "worker_error",
          error: event.message,
          gpu_errors: [],
        }), { once: true });
        worker.postMessage({ command: "run" });
      });
      const passed = receipt.kind === "result"
        && receipt.result.all_cases_match
        && receipt.gpu_errors.length === 0;
      receipt.gate_failures = receiptGateFailures.slice(gateSince);
      receipt.passed = passed && receipt.gate_failures.length === 0;
      output.textContent = JSON.stringify(receipt, null, 2);
      status.textContent = receipt.passed ? "passed" : "failed";
      runButton.disabled = false;
      return receipt;
    }

    runButton.addEventListener("click", run);
    window.burnEmbeddingRepro = { run };
  </script>
</body>
</html>
