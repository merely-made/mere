[package]
rust-version = "1.97.1"
name = "burn-browser-embedding-repro"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Headed BrowserWebGpu reproducer for Burn shared-input binary graphs."

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["std", "wgpu"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = "=0.3.106"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
burn = { version = "=0.22.0", default-features = false, features = ["std", "wgpu"] }

burn-backend = { version = "=0.22.0", default-features = false, features = ["std"] }
burn-cubecl = { version = "=0.22.0", default-features = false, features = ["std", "wgpu"] }

[patch.crates-io]
# Canonical promoted families; keep registry and Git consumers type-identical.
