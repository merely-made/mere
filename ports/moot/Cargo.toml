[package]
name = "mere-moot"
version = "0.0.1"
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
description = "Gemot community surface: murmurs, moots, and coop. Composes existing conversation, governance, and shared-activity domains; technical package mere-moot."
readme = "README.md"
keywords = ["p2p", "chat", "community", "governance", "local-first"]
categories = ["network-programming"]

[lib]
name = "moot"
path = "src/lib.rs"

[features]
default = []
# An opt-in derived view over authorized Fleece page captures. The ordinary
# Moot port stays mountable by murmur without pulling the capture/search lanes.
captured-web = [
    "dep:gemot",
    "dep:servitor",
    "dep:mere-document-lanes",
    "dep:eidetic-search",
]

[dependencies]
gemot = { workspace = true, optional = true }
servitor = { workspace = true, optional = true }
mere-document-lanes = { workspace = true, optional = true, features = ["eidetic-bridge"] }
eidetic-search = { workspace = true, optional = true }
# The coop lifecycle contract is data plus a harness: serde only, never gated.
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
eidetic = { workspace = true }
fleece = { workspace = true }
genet-static-dom = { workspace = true }
