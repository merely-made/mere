[workspace]
resolver = "2"

[package]
name = "moot-ocapn-coop-checks"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
gemot = { version = "0.1.1", git = "https://github.com/merely-made/gemot.git", branch = "main" }
mien = { version = "0.0.1", git = "https://github.com/merely-made/gemot.git", branch = "main" }
transport = { package = "mere-transport", version = "0.0.2", git = "https://github.com/merely-made/murm.git", branch = "main", features = ["noise", "notochord"] }
murm-ocapn-transport = { version = "0.1.0", git = "https://github.com/merely-made/murm.git", branch = "main" }
murm-ocapn = { version = "0.1.0", git = "https://github.com/merely-made/murm.git", branch = "main" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["tokio"] }
personae = { version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["verify"] }
muniment = { version = "0.2.1", git = "https://github.com/merely-made/eidetic.git", branch = "main", features = ["redb"] }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
servitor = { version = "0.0.3", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[patch.crates-io]
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
servitor = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
