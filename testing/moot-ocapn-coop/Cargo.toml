[workspace]
resolver = "2"

[package]
name = "moot-ocapn-coop-checks"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
gemot = { version = "0.1.1", git = "https://www.github.com/merely-made/gemot.git", rev = "c9e5ebfd11167e051133bd27166f3290fc2f5331" }
mien = { version = "0.0.1", git = "https://www.github.com/merely-made/gemot.git", rev = "c9e5ebfd11167e051133bd27166f3290fc2f5331" }
transport = { package = "mere-transport", version = "0.0.2", git = "https://www.github.com/merely-made/murm.git", rev = "bc82e1aa92e4076bd12b1910b3fe3ab992b7acb8", features = ["noise", "notochord"] }
murm-ocapn-transport = { version = "0.1.0", git = "https://www.github.com/merely-made/murm.git", rev = "bc82e1aa92e4076bd12b1910b3fe3ab992b7acb8" }
murm-ocapn = { version = "0.1.0", git = "https://www.github.com/merely-made/murm.git", rev = "bc82e1aa92e4076bd12b1910b3fe3ab992b7acb8" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["tokio"] }
personae = { version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["verify"] }
muniment = { version = "0.2.1", git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31", features = ["redb"] }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
servitor = { version = "0.0.3", git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[patch."https://github.com/merely-made/eidetic.git"]
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }

[patch.crates-io]
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "1fcdb359e72ac6309a96823c3ab5558eaaa3ec31" }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true

[patch."https://github.com/merely-made/murm.git".mere-transport]
git = "https://www.github.com/merely-made/murm.git"
rev = "bc82e1aa92e4076bd12b1910b3fe3ab992b7acb8"

[patch."https://github.com/merely-made/murm.git".murm-ocapn]
git = "https://www.github.com/merely-made/murm.git"
rev = "bc82e1aa92e4076bd12b1910b3fe3ab992b7acb8"

[patch."https://github.com/merely-made/murm.git".murm-ocapn-transport]
git = "https://www.github.com/merely-made/murm.git"
rev = "bc82e1aa92e4076bd12b1910b3fe3ab992b7acb8"

[patch."https://github.com/merely-made/murm.git".murm-sync]
git = "https://www.github.com/merely-made/murm.git"
rev = "bc82e1aa92e4076bd12b1910b3fe3ab992b7acb8"
