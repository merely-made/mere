<!doctype html><style>canvas{width:420px;height:720px}</style><canvas id="d"></canvas><script type="module">
import init,* as module from './pkg/presentation_page.js';const result={result:'pending',controls:[],errors:[]};const assert=(v,m)=>{if(!v)throw Error(m);result.controls.push(m)};const turn=()=>new Promise(r=>requestAnimationFrame(r));async function capture(id){const job=module.request_capture(id);for(let n=0;n<500;n++){const r=module.poll_capture(job);if(r.ready){if(r.error)throw Error(r.error);return r}await turn()}throw Error('capture timeout')}function count(r,colour){let n=0;for(let i=0;i<r.rgba.length;i+=4)if(colour.every((v,j)=>Math.abs(r.rgba[i+j]-v)<=1))n++;return n}try{await init();const id=await module.mount_image_page('d');let frame=await capture(id);assert(count(frame,[255,0,0,255])>=400,'consumer root paint includes owned red image');module.update_image(id,1);await turn();frame=await capture(id);assert(count(frame,[0,0,255,255])>=400,'consumer replacement includes blue image');assert(count(frame,[255,0,0,255])===0,'consumer replacement retires red image');module.update_image(id,2);await turn();frame=await capture(id);assert(count(frame,[0,0,255,255])===0,'consumer removal removes blue image');module.dispose_mount(id);for(let n=0;n<100&&!document.querySelector('canvas').getContext('webgl2').isContextLost();n++)await turn();assert(document.querySelector('canvas').getContext('webgl2').isContextLost(),'image consumer context disposed');result.result='pass'}catch(e){result.result='fail';result.errors.push(String(e.stack??e))}await fetch('/result',{method:'POST',body:JSON.stringify(result)});</script>
