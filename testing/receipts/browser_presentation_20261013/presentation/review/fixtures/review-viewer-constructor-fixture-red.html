<!doctype html><style>canvas,graphshell-tree{display:block;width:801px;height:641px}</style><canvas id="d"></canvas><graphshell-tree data-render-backend="webgl2"></graphshell-tree><script type="module">import init,* as module from './pkg/graphshell_web.js';const result={result:'pending',controls:[],errors:[]};const assert=(v,m)=>{if(!v)throw Error(m);result.controls.push(m)};const sleep=()=>new Promise(r=>setTimeout(r,20));async function until(f){for(let i=0;i<1000;i++){if(f())return;await sleep()}throw Error('wait timeout')}try{await init();document.querySelector('#d').remove();const root=document.querySelector('graphshell-tree');let gl;const get=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){const context=get.call(this,type,...args);if(type==='webgl2')gl=context;return context};const add=root.addEventListener;root.addEventListener=function(name,...args){if(name==='wheel')throw Error('gesture refusal');return add.call(this,name,...args)};module.mount_tree(root);await until(()=>root.dataset.mountError);root.addEventListener=add;assert(root.dataset.mountError.includes('wheel'),'gesture constructor refused');await sleep();assert(gl.isContextLost(),'failed viewer construction releases context');assert(!root.querySelector('[data-cambium-mirror]'),'failed viewer construction removes mirror');result.result='pass';}catch(e){result.result='fail';result.errors.push(String(e.stack??e))}await fetch('/result',{method:'POST',body:JSON.stringify(result)});</script>
